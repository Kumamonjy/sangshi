<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>修仙宗门</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--bg:#0a0a1a;--panel:#131328;--border:#2a2a4a;--gold:#d4af37;--jade:#2e8b57;--text:#e0e0e0;--dim:#888;--red:#c0392b;--blue:#2980b9;--purple:#8e44ad;--hp:#e74c3c;--mp:#3498db;--amber:#f39c12}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'STKaiti','KaiTi','SimSun',serif;color:var(--text);font-size:14px}
/* 已移除横屏限制 */
#game{width:100vw;height:100vh;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:8px}
.screen.active{display:flex}
.hidden{display:none!important}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;flex-shrink:0}
.topbar .title{font-size:18px;color:var(--gold);font-weight:bold}
.topbar .resources{display:flex;gap:12px;font-size:12px}
.topbar .res{display:flex;align-items:center;gap:4px}
.topbar .res span{color:var(--gold)}

/* Nav */
.nav{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,auto);gap:6px;margin-bottom:6px;flex-shrink:0}
.nav-btn{padding:10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.nav-btn:active{transform:scale(.95)}
.nav-btn.active{background:var(--border);border-color:var(--gold);color:var(--gold)}

/* Content */
.content{flex:1;overflow-y:auto;padding:4px}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Cards */
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:6px}
.card-title{font-size:14px;color:var(--gold);margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:4px}
.info-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.info-row .label{color:var(--dim)}
.info-row .val{color:var(--text)}

/* Buttons */
.btn{padding:8px 16px;background:var(--jade);border:none;border-radius:6px;color:#fff;font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-gold{background:linear-gradient(135deg,#b8860b,var(--gold))}
.btn-red{background:var(--red)}
.btn-blue{background:var(--blue)}
.btn-gray{background:#555}

/* Cultivation */
.cult-progress{height:20px;background:#1a1a2e;border-radius:10px;overflow:hidden;margin:6px 0;position:relative}
.cult-fill{height:100%;background:linear-gradient(90deg,var(--jade),var(--gold));transition:width .3s;border-radius:10px}
.cult-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;text-shadow:0 0 4px #000}
.realm-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:bold}
.realm-0{background:#333;color:#aaa}.realm-1{background:#1a4720;color:#4caf50}.realm-2{background:#4a3500;color:#ffd700}
.realm-3{background:#003a4a;color:#00bcd4}.realm-4{background:#3a0040;color:#ce93d8}.realm-5{background:#4a1500;color:#ff5722}.realm-6{background:#444;color:#fff}

/* Battle */
#battle-screen{padding:0;background:#000}
#battle-canvas{width:100%;height:100%;display:block}
#ctb-bar{position:absolute;top:4px;left:4px;right:4px;height:36px;background:rgba(10,10,26,.8);border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;padding:0 6px;gap:3px;overflow:hidden}
.ctb-slot{width:28px;height:28px;border-radius:4px;overflow:hidden;border:2px solid;flex-shrink:0;position:relative}
.ctb-slot img{width:100%;height:100%;object-fit:cover}
.ctb-slot .ctb-num{position:absolute;bottom:-2px;right:-2px;font-size:8px;background:#000;padding:0 2px;border-radius:2px}
.ctb-arrow{color:var(--gold);font-size:14px;margin:0 2px}
#battle-log{position:absolute;bottom:4px;left:4px;right:120px;height:48px;background:rgba(10,10,26,.8);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:11px;overflow:hidden;cursor:pointer;user-select:none;transition:height .2s}
#battle-log .log-line{opacity:.6;font-size:10px}
#battle-log .log-line:last-child{opacity:1;font-size:11px;color:var(--gold)}
#battle-log.expanded{height:auto;max-height:55%;overflow-y:auto;z-index:6}
#battle-log.expanded .log-line{opacity:.85}
#battle-log .log-hint{position:absolute;top:2px;right:6px;font-size:9px;color:var(--gold);opacity:.7}
#battle-stats{position:absolute;bottom:56px;left:4px;right:120px;background:rgba(10,10,26,.85);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--text);display:block;cursor:pointer;z-index:5;max-height:22px;overflow:hidden;transition:max-height .25s}
#battle-stats.expanded{max-height:60%;overflow-y:auto}
#battle-ctrl{position:absolute;bottom:4px;right:4px;display:flex;flex-direction:column;gap:4px}
#battle-ctrl button{padding:6px 12px;font-size:12px;border-radius:4px}
#battle-result{position:absolute;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:10;padding:20px}
#battle-result.show{display:flex}
#battle-result h2{font-size:28px;margin:0}
#battle-result .win{color:var(--gold)}
#battle-result .lose{color:var(--red)}
#battle-result button{padding:10px 24px;font-size:16px}
.result-tabs{display:flex;gap:6px}
.result-tab{padding:6px 18px;font-size:13px;background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:6px;color:var(--dim);cursor:pointer}
.result-tab.active{background:rgba(212,175,55,.2);border-color:var(--gold);color:var(--gold)}
#result-content{width:100%;max-width:360px;max-height:55vh;overflow-y:auto;background:rgba(20,20,40,.6);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;color:var(--text)}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.result-row:last-child{border-bottom:none}

/* Disciples */
.disc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.disc-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px;font-size:11px;position:relative}
.disc-card.in-team{border-color:var(--gold);box-shadow:0 0 8px rgba(212,175,55,.3)}
.disc-card .disc-name{font-size:13px;color:var(--gold)}
.disc-card .disc-prof{font-size:11px;color:var(--jade)}
.disc-card .disc-realm{font-size:11px}
.disc-card .disc-talents{font-size:9px;color:var(--purple);margin-top:2px}
.disc-card .team-toggle{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer}

/* Realm select */
.realm-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.realm-card .realm-info{flex:1}
.realm-card .realm-name{font-size:15px;color:var(--gold)}
.realm-card .realm-desc{font-size:11px;color:var(--dim);margin-top:2px}
.realm-card .realm-meta{font-size:10px;color:var(--text);margin-top:2px}
.realm-card.locked{opacity:.5}

/* Sect */
.building-card{display:flex;justify-content:space-between;align-items:center;padding:8px;background:var(--panel);border:1px solid var(--border);border-radius:6px;margin-bottom:4px}
.building-info .bname{font-size:13px;color:var(--gold)}
.building-info .bdesc{font-size:10px;color:var(--dim)}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100}
#modal.show{display:flex}
.modal-content{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:20px;max-width:360px;width:90%;text-align:center;max-height:85vh;overflow-y:auto}
.modal-content h3{color:var(--gold);margin-bottom:10px}
.modal-content p{font-size:12px;margin-bottom:10px;line-height:1.5}
.modal-btns{display:flex;gap:8px;justify-content:center}

/* Recruit */
.recruit-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.recruit-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.recruit-card.empty{display:flex;align-items:center;justify-content:center;color:var(--dim);height:80px}
.recruit-portrait-wrap{flex-shrink:0;width:80px;height:100px;border-radius:6px;overflow:hidden;border:1px solid var(--gold)}
.recruit-portrait-wrap canvas{display:block;width:80px;height:100px}
.recruit-card > :not(.recruit-portrait-wrap){flex:1}
.recruit-name{font-size:14px;color:var(--gold);font-weight:bold}
.recruit-prof{font-size:11px;color:var(--dim);margin-top:2px}
.recruit-talents{font-size:10px;margin-top:4px;line-height:1.4}
.recruit-attrs{font-size:10px;color:var(--jade);margin-top:4px}

/* Cultivation chars */
.cult-char{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px}
.cult-char.active{border-color:var(--gold);box-shadow:0 0 6px rgba(212,175,55,.3)}
.cult-char-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.cult-char-name{font-size:14px;color:var(--gold);font-weight:bold}
.cult-char-meta{font-size:11px;color:var(--dim);flex:1;min-width:80px}
.cult-toggle{font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--dim);cursor:pointer}
.cult-toggle.on{background:var(--gold);color:#000;border-color:var(--gold)}
.cult-char-bar{margin-top:4px}

/* Toast */
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);border:1px solid var(--gold);border-radius:8px;padding:10px 20px;font-size:13px;color:var(--gold);z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

/* Char detail */
.char-detail{position:absolute;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;padding:12px;z-index:50;overflow-y:auto}
.char-detail.show{display:flex}
.char-detail .cd-header{display:flex;gap:12px;margin-bottom:10px}
.char-detail .cd-portrait{width:80px;height:100px;border-radius:6px;overflow:hidden;border:1px solid var(--border);flex-shrink:0}
.char-detail .cd-portrait img{width:100%;height:100%;object-fit:cover}
.char-detail .cd-info{flex:1}
.char-detail .cd-name{font-size:18px;color:var(--gold)}
.char-detail .cd-attrs{margin-top:6px}
.char-detail .cd-attrs .attr-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.char-detail .cd-close{position:absolute;top:8px;right:12px;font-size:24px;color:var(--dim);cursor:pointer}
</style>
</head>
<body>

<div id="game">
<!-- Hub -->

<script>
// Auto-generated portrait pool with AI-realistic xianxia art
const PORTRAIT_POOL={"sword_m": ["images/sword_m_0.jpeg", "images/sword_m_1.jpeg", "images/sword_m_2.jpeg", "images/sword_m_3.jpeg"], "sword_f": ["images/sword_f_0.jpeg", "images/sword_f_1.jpeg", "images/sword_f_2.jpeg", "images/sword_f_3.jpeg"], "alchemy_m": ["images/alchemy_m_0.jpeg", "images/alchemy_m_1.jpeg", "images/alchemy_m_2.jpeg", "images/alchemy_m_3.jpeg"], "alchemy_f": ["images/alchemy_f_0.jpeg", "images/alchemy_f_1.jpeg", "images/alchemy_f_2.jpeg", "images/alchemy_f_3.jpeg"], "body_m": ["images/body_m_0.jpeg", "images/body_m_1.jpeg", "images/body_m_2.jpeg", "images/body_m_3.jpeg"], "body_f": ["images/body_f_0.jpeg", "images/body_f_1.jpeg", "images/body_f_2.jpeg", "images/body_f_3.jpeg"], "formation_m": ["images/formation_m_0.jpeg", "images/formation_m_1.jpeg", "images/formation_m_2.jpeg", "images/formation_m_3.jpeg"], "formation_f": ["images/formation_f_0.jpeg", "images/formation_f_1.jpeg", "images/formation_f_2.jpeg", "images/formation_f_3.jpeg"], "spirit_m": ["images/spirit_m_0.jpeg", "images/spirit_m_1.jpeg", "images/spirit_m_2.jpeg", "images/spirit_m_3.jpeg"], "spirit_f": ["images/spirit_f_0.jpeg", "images/spirit_f_1.jpeg", "images/spirit_f_2.jpeg", "images/spirit_f_3.jpeg"], "protagonist_m": ["images/protagonist_m_0.jpeg", "images/protagonist_m_1.jpeg", "images/protagonist_m_2.jpeg", "images/protagonist_m_3.jpeg", "images/protagonist_m_4.jpeg"], "protagonist_f": ["images/protagonist_f_0.jpeg", "images/protagonist_f_1.jpeg", "images/protagonist_f_2.jpeg", "images/protagonist_f_3.jpeg", "images/protagonist_f_4.jpeg"], "mengli": ["images/mengli_0.jpeg"], "sr_metal_m": ["images/sr_metal_m.jpg"], "sr_metal_f": ["images/sr_metal_f.jpg"], "sr_wood_m": ["images/sr_wood_m.jpg"], "sr_wood_f": ["images/sr_wood_f.jpg"], "sr_water_m": ["images/sr_water_m.jpg"], "sr_water_f": ["images/sr_water_f.jpg"], "sr_fire_m": ["images/sr_fire_m.jpg"], "sr_fire_f": ["images/sr_fire_f.jpg"], "sr_earth_m": ["images/sr_earth_m.jpg"], "sr_earth_f": ["images/sr_earth_f.jpg"], "wolf": ["images/wolf_0.jpeg"], "skeleton": ["images/skeleton_0.jpeg"], "snake": ["images/snake_0.jpeg"], "scorpion": ["images/scorpion_0.jpeg"], "tree": ["images/tree_0.jpeg"], "bat": ["images/bat_0.jpeg"], "snakeQueen": ["images/snakeQueen_0.jpeg"], "demonCultivator": ["images/demonCultivator_0.jpeg"], "demonKing": ["images/demonKing_0.jpeg"], "pigDemon": ["images/pigDemon_0.jpeg"], "tigerDemon": ["images/tigerDemon_0.jpeg"], "blackTiger": ["images/blackTiger_0.jpeg"], "bearDemon": ["images/bearDemon_0.jpeg"], "monkeyKing": ["images/monkeyKing_0.jpeg"], "fishMonster": ["images/fishMonster_0.jpeg"], "shrimpSoldier": ["images/shrimpSoldier_0.jpeg"], "crabGeneral": ["images/crabGeneral_0.jpeg"], "turtleElder": ["images/turtleElder_0.jpeg"], "poisonFrog": ["images/poisonFrog_0.jpeg"], "swampSnake": ["images/swampSnake_0.jpeg"], "dragonKing": ["images/dragonKing_0.jpeg"], "poisonToadKing": ["images/poisonToadKing_0.jpeg"], "ghostFire": ["images/ghostFire_0.jpeg"], "rockBat": ["images/rockBat_0.jpeg"], "caveSpider": ["images/caveSpider_0.jpeg"], "stalactite": ["images/stalactite_0.jpeg"], "caveGhostLord": ["images/caveGhostLord_0.jpeg"]}

const AI_IMG=PORTRAIT_POOL;
//============ PORTRAIT DRAWING v2: profession × gender × realm ============
// Key format: 'profession_gender' for humans (e.g. 'sword_m', 'alchemy_f'), monster id for monsters
// bigRealm adds visual progression (crown, aura, robe trim, hair accent)
function drawPortrait(ctx,x,y,w,h,key,bigRealm=0,portraitIdx=0){
  const cx=x+w/2,cy=y+h/2;
  // Try real AI image first from PORTRAIT_POOL
  const pool = PORTRAIT_POOL[key];
  if(pool && pool.length){
    const ik = key+'_'+(portraitIdx % pool.length);
    if(imgLoaded[ik] && imgLoaded[ik].loaded){
      ctx.drawImage(imgLoaded[ik].img,x,y,w,h);
      return;
    }
    // fallback: 尝试第一张
    if(imgLoaded[key+'_0'] && imgLoaded[key+'_0'].loaded){
      ctx.drawImage(imgLoaded[key+'_0'].img,x,y,w,h);
      return;
    }
  }
  const parts=key.split('_');
  const isMonster=MONSTERS[key]!==undefined||isMonsterKey(parts[0]);
  const prof=parts[0];const gender=parts[1];
  
  // ---- Background gradient ----
  const bgCol=profBgColor(prof,isMonster);
  const grad=ctx.createLinearGradient(x,y,x,y+h);
  grad.addColorStop(0,bgCol[0]);grad.addColorStop(1,bgCol[1]);
  ctx.fillStyle=grad;ctx.fillRect(x,y,w,h);
  // Star sparkles (random seeded by key so they're consistent)
  ctx.fillStyle='rgba(255,255,255,.08)';
  const seed=hashStr(key);
  for(let i=0;i<10;i++){
    const px=x+((seed+i*7919)%100)/100*w;
    const py=y+((seed+i*104729)%100)/100*h*.5;
    ctx.fillRect(px,py,1,1);
  }
  
  // ---- Realm aura rings ----
  if(bigRealm>0){
    ctx.save();
    ctx.strokeStyle=REALM_COLORS[bigRealm]+'60';
    ctx.lineWidth=2;
    for(let i=0;i<Math.min(bigRealm,3);i++){
      ctx.beginPath();
      ctx.arc(cx,cy,w*.40-i*3,0,Math.PI*2);
      ctx.stroke();
    }
    // Gold/crimson trim for high realms
    if(bigRealm>=3){
      ctx.strokeStyle='#d4af37aa';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(cx,cy,w*.46,0,Math.PI*2);ctx.stroke();
    }
    if(bigRealm>=5){
      ctx.strokeStyle='#ff5722aa';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(cx,cy,w*.48,0,Math.PI*2);ctx.stroke();
    }
    ctx.restore();
  }
  
  if(isMonster){
    drawMonsterPortrait(ctx,x,y,w,h,key,bigRealm);
  }else{
    drawHumanPortrait(ctx,x,y,w,h,prof,gender,bigRealm);
  }
}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0}return Math.abs(h)}
function isMonsterKey(k){return ['wolf','skeleton','snake','scorpion','tree','bat','snakeQueen','demonCultivator','demonKing','pigDemon','tigerDemon','blackTiger','monkeyKing','bearDemon','fishMonster','shrimpSoldier','crabGeneral','turtleElder','poisonFrog','swampSnake','dragonKing','poisonToadKing','ghostFire','rockBat','caveSpider','stalactite','caveGhostLord'].includes(k)}

function profBgColor(prof,isMonster){
  const m={
    protagonist:['#1a2f4a','#0d1624'],sword:['#1a4a3a','#0d2420'],alchemy:['#4a1a5a','#200d30'],
    body:['#5a1a1a','#300d0d'],formation:['#1a2a5a','#0d1630'],spirit:['#1a4a5a','#0d2030'],
    mengli:['#0d2a4a','#051530'],
  };
  const m2={wolf:['#2a2a2a','#000'],skeleton:['#3a3a3a','#111'],snake:['#1a3a1a','#0d240d'],
    scorpion:['#3a2a1a','#24160d'],tree:['#0d3a0d','#051805'],bat:['#2a1a3a','#140d24'],
    snakeQueen:['#4a2a5a','#241430'],demonCultivator:['#3a0d0d','#1a0505'],demonKing:['#2a0d2a','#140514'],
    pigDemon:['#3a1a2a','#1a0d18'],tigerDemon:['#3a2a1a','#1a1208'],blackTiger:['#1a1a1a','#000'],
    bearDemon:['#2a1a0d','#140d05'],monkeyKing:['#3a2a0d','#1a1405'],
    ghostFire:['#2a1a3a','#0d0514'],rockBat:['#1a2a3a','#0d1420'],
    caveSpider:['#2a1a2a','#140d14'],stalactite:['#3a3a3a','#1a1a1a'],
    caveGhostLord:['#3a0d3a','#1a051a']};
  return (m[prof]||m2[prof]||['#2a2a2a','#111']);
}

// ============= HUMAN PORTRAIT =============
function drawHumanPortrait(ctx,x,y,w,h,prof,gender,bigRealm){
  const cx=x+w/2,cy=y+h/2;
  const headR=w*.20;
  const headY=y+h*.28;
  const neckY=headY+headR;
  const robeTop=neckY+headR*.3;
  const robeBot=y+h*.95;
  const bodyMaxW=w*.42;
  
  // ---- Robe (trapezoid) ----
  ctx.fillStyle=robeColor(prof);
  ctx.beginPath();
  ctx.moveTo(cx-headR*1.2,robeTop);
  ctx.lineTo(cx+headR*1.2,robeTop);
  ctx.lineTo(cx+bodyMaxW,robeBot);
  ctx.lineTo(cx-bodyMaxW,robeBot);
  ctx.closePath();ctx.fill();
  
  // Robe shade / inner layer
  ctx.fillStyle=robeDark(prof);
  ctx.beginPath();
  ctx.moveTo(cx-headR*1.0,robeTop);
  ctx.lineTo(cx+headR*1.0,robeTop);
  ctx.lineTo(cx+bodyMaxW*.75,robeBot);
  ctx.lineTo(cx-bodyMaxW*.75,robeBot);
  ctx.closePath();ctx.fill();
  
  // Robe trim (varies by realm)
  if(bigRealm>=1){
    ctx.strokeStyle='#d4af37';ctx.lineWidth=bigRealm>=3?2:1;
    ctx.beginPath();
    ctx.moveTo(cx-headR*1.15,robeTop);
    ctx.lineTo(cx+headR*1.15,robeTop);
    ctx.stroke();
  }
  if(bigRealm>=2){
    ctx.fillStyle='#d4af37';
    // Decorative collar
    ctx.beginPath();
    ctx.arc(cx,robeTop,headR*.2,0,Math.PI*2);
    ctx.fill();
  }
  
  // ---- Face ----
  const faceR=headR*1.05;
  const faceY=headY;
  ctx.fillStyle=gender==='f'?'#fbe4d0':'#f0cfa8';
  ctx.beginPath();
  ctx.ellipse(cx,faceY,faceR,faceR*1.15,0,0,Math.PI*2);
  ctx.fill();
  
  // ---- Hair (gender-differentiated) ----
  drawHair(ctx,cx,faceY,faceR,prof,gender,bigRealm);
  
  // ---- Eyes ----
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath();ctx.arc(cx-faceR*.32,faceY+faceR*.12,faceR*.1,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+faceR*.32,faceY+faceR*.12,faceR*.1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(cx-faceR*.28,faceY+faceR*.08,faceR*.04,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+faceR*.36,faceY+faceR*.08,faceR*.04,0,Math.PI*2);ctx.fill();
  
  // Mouth
  ctx.strokeStyle='#8a4a3a';ctx.lineWidth=1;
  ctx.beginPath();
  ctx.arc(cx,faceY+faceR*.5,faceR*.2,0,Math.PI);
  ctx.stroke();
  
  // ---- Accessories (profession-specific) ----
  drawProfessionProp(ctx,cx,cy,w,h,prof,gender);
  
  // ---- Realm crown/highlights (big realms get crown/hair ornament) ----
  if(bigRealm>=3){
    // Jade/crystal hair ornament
    ctx.fillStyle='#2ecc71';
    ctx.beginPath();
    ctx.moveTo(cx,faceY-faceR*1.25);
    ctx.lineTo(cx-faceR*.25,faceY-faceR*.95);
    ctx.lineTo(cx+faceR*.25,faceY-faceR*.95);
    ctx.closePath();ctx.fill();
  }
  if(bigRealm>=5){
    // Crown
    ctx.fillStyle='#d4af37';
    ctx.beginPath();
    ctx.moveTo(cx-faceR*.5,faceY-faceR);
    ctx.lineTo(cx-faceR*.4,faceY-faceR*1.3);
    ctx.lineTo(cx-faceR*.15,faceY-faceR*1.1);
    ctx.lineTo(cx,faceY-faceR*1.4);
    ctx.lineTo(cx+faceR*.15,faceY-faceR*1.1);
    ctx.lineTo(cx+faceR*.4,faceY-faceR*1.3);
    ctx.lineTo(cx+faceR*.5,faceY-faceR);
    ctx.closePath();ctx.fill();
  }
}

function drawHair(ctx,cx,faceY,faceR,prof,gender,bigRealm){
  const hairColor={'protagonist':'#1a1a1a','sword':'#1a1a1a','alchemy':'#3a2a1a','body':'#3a2a1a','formation':'#4a4a4a','spirit':'#3a4a8a','mengli':'#1a1a2a'}[prof]||'#1a1a1a';
  const accentColors=['#d4af37','#ff5722','#2ecc71','#9b59b6','#3498db','#e74c3c'];
  const accentIdx=hashStr(prof+gender)%accentColors.length;
  const accent=bigRealm>=2?accentColors[accentIdx]:null;
  
  if(gender==='m'){
    // Male - top of head + sideburns/long back hair
    ctx.fillStyle=hairColor;
    // Top (full cap, slightly rounded)
    ctx.beginPath();
    ctx.arc(cx,faceY-faceR*.2,faceR*1.15,Math.PI*1.1,Math.PI*1.9,true);
    ctx.fill();
    // Side short hair
    ctx.beginPath();
    ctx.arc(cx-faceR*.7,faceY-faceR*.1,faceR*.5,Math.PI*1.2,Math.PI*1.8);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx+faceR*.7,faceY-faceR*.1,faceR*.5,Math.PI*1.2,Math.PI*1.8);
    ctx.fill();
    // Long back hair (sword/formation/spirit style)
    if(prof==='sword'||prof==='formation'||prof==='spirit'){
      ctx.beginPath();
      ctx.moveTo(cx-faceR*.6,faceY-faceR*.2);
      ctx.lineTo(cx-faceR*.4,faceY+faceR*.8);
      ctx.lineTo(cx+faceR*.4,faceY+faceR*.8);
      ctx.lineTo(cx+faceR*.6,faceY-faceR*.2);
      ctx.closePath();ctx.fill();
    }
    // Front bangs
    ctx.beginPath();
    ctx.moveTo(cx-faceR*.6,faceY-faceR*.3);
    ctx.lineTo(cx-faceR*.2,faceY-faceR*.1);
    ctx.lineTo(cx,faceY-faceR*.4);
    ctx.lineTo(cx+faceR*.2,faceY-faceR*.1);
    ctx.lineTo(cx+faceR*.6,faceY-faceR*.3);
    ctx.lineTo(cx+faceR*.4,faceY-faceR*.2);
    ctx.lineTo(cx-faceR*.4,faceY-faceR*.2);
    ctx.closePath();ctx.fill();
    // Accent streak
    if(accent){ctx.fillStyle=accent;
      ctx.fillRect(cx-faceR*.5,faceY-faceR*.8,faceR*.15,faceR*.5);
    }
  }else{
    // Female - long hair with bun or side-swept
    ctx.fillStyle=hairColor;
    // Big top bun
    ctx.beginPath();
    ctx.arc(cx,faceY-faceR*1.3,faceR*.45,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx,faceY-faceR*.3,faceR*1.1,Math.PI*1.1,Math.PI*1.9,true);
    ctx.fill();
    // Long side hair cascading down
    ctx.beginPath();
    ctx.moveTo(cx-faceR*1.05,faceY-faceR*.2);
    ctx.lineTo(cx-faceR*1.15,faceY+faceR*1.4);
    ctx.lineTo(cx-faceR*.3,faceY+faceR*1.0);
    ctx.closePath();ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx+faceR*1.05,faceY-faceR*.2);
    ctx.lineTo(cx+faceR*1.15,faceY+faceR*1.4);
    ctx.lineTo(cx+faceR*.3,faceY+faceR*1.0);
    ctx.closePath();ctx.fill();
    // Front bangs
    ctx.beginPath();
    ctx.moveTo(cx-faceR*.7,faceY-faceR*.3);
    ctx.lineTo(cx-faceR*.3,faceY-faceR*.1);
    ctx.lineTo(cx,faceY-faceR*.45);
    ctx.lineTo(cx+faceR*.3,faceY-faceR*.1);
    ctx.lineTo(cx+faceR*.7,faceY-faceR*.3);
    ctx.lineTo(cx+faceR*.4,faceY-faceR*.15);
    ctx.lineTo(cx-faceR*.4,faceY-faceR*.15);
    ctx.closePath();ctx.fill();
    // Hair ribbon / accent
    if(accent){
      ctx.fillStyle=accent;
      ctx.beginPath();
      ctx.moveTo(cx-faceR*.2,faceY-faceR*1.5);
      ctx.lineTo(cx,faceY-faceR*1.35);
      ctx.lineTo(cx+faceR*.2,faceY-faceR*1.5);
      ctx.lineTo(cx+faceR*.15,faceY-faceR*1.1);
      ctx.lineTo(cx-faceR*.15,faceY-faceR*1.1);
      ctx.closePath();ctx.fill();
    }
  }
}

function drawProfessionProp(ctx,cx,cy,w,h,prof,gender){
  // Weapon / tool on side or in hand area
  if(prof==='sword'||prof==='protagonist'){
    const side=gender==='f'?-1:1;
    // Long sword
    ctx.strokeStyle='#e0e0e0';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(cx+side*w*.18,cy-h*.2);
    ctx.lineTo(cx+side*w*.22,cy+h*.25);
    ctx.stroke();
    // Hilt/guard
    ctx.fillStyle='#d4af37';
    ctx.fillRect(cx+side*w*.17,cy+h*.22,Math.abs(side*6),4);
    ctx.fillStyle='#4a2a1a';
    ctx.fillRect(cx+side*w*.165,cy+h*.25,Math.abs(side*4),6);
  }
  if(prof==='alchemy'){
    // Cauldron at front
    const by=cy+h*.3;
    const bw=w*.16;
    ctx.fillStyle='#8a4a2a';
    ctx.beginPath();ctx.ellipse(cx,by,bw,bw*.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#d4af37';
    ctx.beginPath();ctx.ellipse(cx,by-bw*.15,bw*.35,bw*.2,0,0,Math.PI*2);ctx.fill();
    // Small flame
    ctx.fillStyle='#ff6b35';
    ctx.beginPath();
    ctx.moveTo(cx,by-bw*.5);ctx.quadraticCurveTo(cx-bw*.2,by-bw*1.1,cx,by-bw*1.3);ctx.quadraticCurveTo(cx+bw*.2,by-bw*1.1,cx,by-bw*.5);
    ctx.fill();
  }
  if(prof==='body'){
    // Glowing fists
    const fy=cy+h*.3;
    const fw=w*.12;
    ctx.fillStyle='#d4af37';
    ctx.beginPath();ctx.arc(cx-w*.22,fy,fw*.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+w*.22,fy,fw*.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(cx-w*.22,fy,fw*.7,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(cx+w*.22,fy,fw*.7,0,Math.PI*2);ctx.stroke();
    // Fist shape
    ctx.fillStyle='#c08a60';
    ctx.beginPath();ctx.arc(cx-w*.22,fy,fw*.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+w*.22,fy,fw*.3,0,Math.PI*2);ctx.fill();
  }
  if(prof==='formation'){
    // Rune circle at feet
    const ry=cy+h*.35;
    ctx.strokeStyle='#d4af37';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(cx,ry,w*.18,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(cx,ry,w*.12,0,Math.PI*2);ctx.stroke();
    // Rune marks
    ctx.fillStyle='#d4af37';ctx.font=`${Math.floor(w*.06)}px serif`;ctx.textAlign='center';
    ctx.fillText('⚘',cx,ry+w*.02);
    // Lines connecting
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2+Math.PI/4;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*w*.12,ry+Math.sin(a)*w*.12);
      ctx.lineTo(cx+Math.cos(a)*w*.18,ry+Math.sin(a)*w*.18);
      ctx.stroke();
    }
  }
  if(prof==='spirit'){
    // 漂浮法珠环绕：脱离袍服区域，悬于肩膀外侧与头顶前
    const orbR=w*.075, glowR=w*.18, hiR=orbR*.35;
    const orbs=[
      {x:cx-w*.30, y:cy-h*.12, c:'#7ec8ff', label:'蓝'},   // 左肩外侧 · 灵光
      {x:cx+w*.30, y:cy-h*.12, c:'#ffe08a', label:'金'},   // 右肩外侧 · 金丹
      {x:cx,       y:cy-h*.22, c:'#e8a4ff', label:'紫'},   // 头顶前侧 · 紫霞
    ];
    for(const o of orbs){
      // 外发光（大光晕）
      const gl=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,glowR);
      gl.addColorStop(0,o.c+'aa');
      gl.addColorStop(.4,o.c+'44');
      gl.addColorStop(1,o.c+'00');
      ctx.fillStyle=gl;
      ctx.beginPath();ctx.arc(o.x,o.y,glowR,0,Math.PI*2);ctx.fill();
      // 中发光
      const gm=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,orbR*2.2);
      gm.addColorStop(0,'#ffffff66');
      gm.addColorStop(1,o.c+'00');
      ctx.fillStyle=gm;
      ctx.beginPath();ctx.arc(o.x,o.y,orbR*2.2,0,Math.PI*2);ctx.fill();
      // 法珠主体
      ctx.fillStyle=o.c;
      ctx.beginPath();ctx.arc(o.x,o.y,orbR,0,Math.PI*2);ctx.fill();
      // 白色高光
      ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.arc(o.x-orbR*.35,o.y-orbR*.35,hiR,0,Math.PI*2);ctx.fill();
    }
    // 手中符咒（男女反侧：男右女左）
    const side=gender==='f'?-1:1;
    const fx=cx+side*w*.22, fy=cy+h*.22;
    // 符咒外形（斜菱形/黄纸）
    ctx.fillStyle='#f4e3b0';
    ctx.strokeStyle='#8a3a3a';ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(fx,fy-h*.05);
    ctx.lineTo(fx+w*.045,fy-h*.03);
    ctx.lineTo(fx+w*.055,fy+h*.03);
    ctx.lineTo(fx,fy+h*.06);
    ctx.lineTo(fx-w*.055,fy+h*.03);
    ctx.lineTo(fx-w*.045,fy-h*.03);
    ctx.closePath();
    ctx.fill();ctx.stroke();
    // 符咒上的红色符文（三道纵线 + 交叉）
    ctx.strokeStyle='#8a1a1a';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(fx-w*.025,fy-h*.01);ctx.lineTo(fx+w*.025,fy+h*.015);ctx.stroke();
    ctx.beginPath();ctx.moveTo(fx,fy-h*.04);ctx.lineTo(fx,fy+h*.05);ctx.stroke();
    ctx.beginPath();ctx.moveTo(fx-w*.015,fy+h*.02);ctx.lineTo(fx+w*.03,fy+h*.04);ctx.stroke();
  }
}

// ============= MONSTER PORTRAIT =============
function drawMonsterPortrait(ctx,x,y,w,h,key,bigRealm){
  const cx=x+w/2,cy=y+h/2;
  if(MONSTERS[key].isBoss){
    // Boss glow
    ctx.strokeStyle='#ff444455';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,cy,w*.48,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#ff4444';ctx.font=`bold ${Math.floor(w*.12)}px serif`;ctx.textAlign='center';
    ctx.fillText('BOSS',cx,cy-h*.35);
  }
  if(bigRealm>0){
    ctx.strokeStyle=REALM_COLORS[bigRealm]+'80';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy-h*.1,w*.42,0,Math.PI*2);ctx.stroke();
  }
  const mr=w*.22;
  const mY=cy-h*.12;
  // Body shape by monster
  const bodyColors={wolf:'#333',skeleton:'#ddd',snake:'#4a7a4a',scorpion:'#6a4a2a',tree:'#3a6a3a',bat:'#5a3a6a',snakeQueen:'#7a4a8a',demonCultivator:'#4a1a1a',demonKing:'#4a1a4a',pigDemon:'#b07a7a',tigerDemon:'#d4a050',blackTiger:'#222',bearDemon:'#6a4a2a',monkeyKing:'#c89030',fishMonster:'#5a9fd4',shrimpSoldier:'#e08a4a',crabGeneral:'#c04040',turtleElder:'#4a9a6a',poisonFrog:'#6abf4a',swampSnake:'#5a7a3a',dragonKing:'#4a7abf',poisonToadKing:'#7a9a3a',ghostFire:'#5a2a8a',rockBat:'#4a5a7a',caveSpider:'#5a2a4a',stalactite:'#8a8a8a',caveGhostLord:'#4a1a5a'};
  ctx.fillStyle=bodyColors[key]||'#555';
  ctx.beginPath();
  ctx.ellipse(cx,mY+mr*.3,mr*.9,mr*1.1,0,0,Math.PI*2);
  ctx.fill();
  // Head
  ctx.fillStyle={'wolf':'#222','skeleton':'#eee','snake':'#5a8a5a','scorpion':'#5a3a1a','tree':'#5a4a2a','bat':'#3a2a4a','snakeQueen':'#8a5a9a','demonCultivator':'#5a2a2a','demonKing':'#6a2a6a','pigDemon':'#c88a8a','tigerDemon':'#eab060','blackTiger':'#333','bearDemon':'#8a5a3a','monkeyKing':'#eab848','fishMonster':'#7abfe4','shrimpSoldier':'#f0aa6a','crabGeneral':'#e05050','turtleElder':'#6aba8a','poisonFrog':'#8adf6a','swampSnake':'#7a9a5a','dragonKing':'#6a9adf','poisonToadKing':'#9aba5a','ghostFire':'#9a5ad4','rockBat':'#5a6a8a','caveSpider':'#7a3a5a','stalactite':'#aaaaaa','caveGhostLord':'#6a2a7a'}[key]||'#666';
  ctx.beginPath();
  ctx.ellipse(cx,mY-mr*.5,mr*.85,mr*.8,0,0,Math.PI*2);
  ctx.fill();
  // Monster-specific features
  if(key==='wolf'){
    ctx.beginPath();ctx.moveTo(cx-mr*.8,mY-mr*.8);ctx.lineTo(cx-mr*.3,mY-mr*1.4);ctx.lineTo(cx-mr*.1,mY-mr*.8);ctx.fill();
    ctx.beginPath();ctx.moveTo(cx+mr*.8,mY-mr*.8);ctx.lineTo(cx+mr*.3,mY-mr*1.4);ctx.lineTo(cx+mr*.1,mY-mr*.8);ctx.fill();
  }
  if(key==='bat'){
    ctx.fillStyle='#222';
    ctx.beginPath();ctx.moveTo(cx-mr*1.5,mY-mr*.2);ctx.lineTo(cx-mr*.5,mY);ctx.lineTo(cx-mr*1.5,mr);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(cx+mr*1.5,mY-mr*.2);ctx.lineTo(cx+mr*.5,mY);ctx.lineTo(cx+mr*1.5,mr);ctx.closePath();ctx.fill();
  }
  if(key==='tree'){
    ctx.fillStyle='#2a5a2a';
    ctx.beginPath();ctx.arc(cx,mY-mr*1.0,mr*1.2,0,Math.PI*2);ctx.fill();
  }
  if(key==='snake'||key==='snakeQueen'){
    ctx.fillStyle='#6a8a4a';
    ctx.beginPath();ctx.arc(cx,mY-mr*.2,mr*.7,Math.PI*1.0,Math.PI*2.0);ctx.fill();
    ctx.fillStyle='#d4af37';
    ctx.beginPath();ctx.arc(cx,mY-mr*1.1,mr*.3,0,Math.PI*2);ctx.fill();
  }
  if(key==='demonKing'){
    ctx.fillStyle='#2a0a2a';
    ctx.beginPath();ctx.moveTo(cx-mr*.7,mY-mr*.8);ctx.lineTo(cx-mr*.4,mY-mr*1.6);ctx.lineTo(cx-mr*.2,mY-mr*.8);ctx.fill();
    ctx.beginPath();ctx.moveTo(cx+mr*.7,mY-mr*.8);ctx.lineTo(cx+mr*.4,mY-mr*1.6);ctx.lineTo(cx+mr*.2,mY-mr*.8);ctx.fill();
  }
  // —— 新怪物特征 ——
  if(key==='pigDemon'){
    // 猪鼻子（大圆鼻孔）
    ctx.fillStyle='#8a4a4a';
    ctx.beginPath();ctx.ellipse(cx,mY-mr*.35,mr*.45,mr*.3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(cx-mr*.15,mY-mr*.35,mr*.08,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+mr*.15,mY-mr*.35,mr*.08,0,Math.PI*2);ctx.fill();
    // 獠牙
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.moveTo(cx-mr*.2,mY-mr*.1);ctx.lineTo(cx-mr*.1,mY+mr*.15);ctx.lineTo(cx-mr*.05,mY-mr*.1);ctx.fill();
    ctx.beginPath();ctx.moveTo(cx+mr*.2,mY-mr*.1);ctx.lineTo(cx+mr*.1,mY+mr*.15);ctx.lineTo(cx+mr*.05,mY-mr*.1);ctx.fill();
    // 大耳朵
    ctx.fillStyle='#a06a6a';
    ctx.beginPath();ctx.ellipse(cx-mr*.9,mY-mr*.7,mr*.35,mr*.5,Math.PI/6,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+mr*.9,mY-mr*.7,mr*.35,mr*.5,-Math.PI/6,0,Math.PI*2);ctx.fill();
  }
  if(key==='tigerDemon'||key==='blackTiger'){
    // 老虎耳朵（三角）
    ctx.fillStyle=key==='blackTiger'?'#1a1a1a':'#c89030';
    ctx.beginPath();ctx.moveTo(cx-mr*.6,mY-mr*.8);ctx.lineTo(cx-mr*.3,mY-mr*1.3);ctx.lineTo(cx-mr*.15,mY-mr*.7);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(cx+mr*.6,mY-mr*.8);ctx.lineTo(cx+mr*.3,mY-mr*1.3);ctx.lineTo(cx+mr*.15,mY-mr*.7);ctx.closePath();ctx.fill();
    // 虎纹（额头+身体条纹）
    ctx.fillStyle=key==='blackTiger'?'#c0392b':'#000';
    ctx.beginPath();ctx.moveTo(cx,mY-mr*.95);ctx.lineTo(cx-mr*.12,mY-mr*.7);ctx.lineTo(cx+mr*.12,mY-mr*.7);ctx.closePath();ctx.fill();
    ctx.fillRect(cx-mr*.6,mY+mr*.2,mr*.12,mr*.5);
    ctx.fillRect(cx-mr*.25,mY+mr*.2,mr*.12,mr*.5);
    ctx.fillRect(cx+mr*.15,mY+mr*.2,mr*.12,mr*.5);
    ctx.fillRect(cx+mr*.5,mY+mr*.2,mr*.12,mr*.5);
    // 胡须
    ctx.strokeStyle=key==='blackTiger'?'#c0392b':'#000';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx-mr*.5,mY-mr*.1);ctx.lineTo(cx-mr*1.2,mY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+mr*.5,mY-mr*.1);ctx.lineTo(cx+mr*1.2,mY);ctx.stroke();
  }
  if(key==='bearDemon'){
    // 圆耳朵
    ctx.fillStyle='#4a3a1a';
    ctx.beginPath();ctx.arc(cx-mr*.7,mY-mr*.8,mr*.25,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+mr*.7,mY-mr*.8,mr*.25,0,Math.PI*2);ctx.fill();
    // 口鼻部（棕色）
    ctx.fillStyle='#5a4a2a';
    ctx.beginPath();ctx.ellipse(cx,mY-mr*.15,mr*.4,mr*.35,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(cx-mr*.12,mY-mr*.2,mr*.07,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+mr*.12,mY-mr*.2,mr*.07,0,Math.PI*2);ctx.fill();
    // 大爪子（身体周围）
    ctx.fillStyle='#6a4a2a';
    for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(cx-mr*1.1+i*mr*1.05,mY+mr*.6,mr*.18,0,Math.PI*2);ctx.fill()}
  }
  if(key==='monkeyKing'){
    // 金色紧箍咒
    ctx.fillStyle='#f4d03f';
    ctx.beginPath();ctx.arc(cx,mY-mr*.75,mr*.7,Math.PI*1.15,Math.PI*1.85);ctx.fill();
    // 尖耳朵
    ctx.fillStyle='#eab848';
    ctx.beginPath();ctx.moveTo(cx-mr*.55,mY-mr*.6);ctx.lineTo(cx-mr*.8,mY-mr*.4);ctx.lineTo(cx-mr*.5,mY-mr*.3);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(cx+mr*.55,mY-mr*.6);ctx.lineTo(cx+mr*.8,mY-mr*.4);ctx.lineTo(cx+mr*.5,mY-mr*.3);ctx.closePath();ctx.fill();
    // 脸部白圈
    ctx.fillStyle='#f0d8a0';
    ctx.beginPath();ctx.ellipse(cx,mY-mr*.2,mr*.6,mr*.55,0,0,Math.PI*2);ctx.fill();
    // 金箍（武器）
    ctx.strokeStyle='#f4d03f';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx+mr*1.0,mY+mr*.4,mr*.35,0,Math.PI*2);ctx.stroke();
  }
  // —— 溶洞口怪物特征 ——
  if(key==='ghostFire'){
    // 漂浮的鬼火火焰（青紫色）
    ctx.fillStyle='#b060ff';
    ctx.beginPath();ctx.moveTo(cx,mY-mr*1.5);ctx.quadraticCurveTo(cx-mr*.7,mY-mr*.8,cx-mr*.4,mY-mr*.3);ctx.quadraticCurveTo(cx,mY-mr*.5,cx+mr*.4,mY-mr*.3);ctx.quadraticCurveTo(cx+mr*.7,mY-mr*.8,cx,mY-mr*1.5);ctx.fill();
    ctx.fillStyle='#e0a0ff';
    ctx.beginPath();ctx.moveTo(cx,mY-mr*1.2);ctx.quadraticCurveTo(cx-mr*.4,mY-mr*.7,cx-mr*.2,mY-mr*.3);ctx.quadraticCurveTo(cx,mY-mr*.45,cx+mr*.2,mY-mr*.3);ctx.quadraticCurveTo(cx+mr*.4,mY-mr*.7,cx,mY-mr*1.2);ctx.fill();
  }
  if(key==='rockBat'){
    // 岩石质感的蝙蝠翅膀
    ctx.fillStyle='#2a3a4a';
    ctx.beginPath();ctx.moveTo(cx-mr*1.6,mY-mr*.3);ctx.lineTo(cx-mr*.5,mY);ctx.lineTo(cx-mr*1.3,mr);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(cx+mr*1.6,mY-mr*.3);ctx.lineTo(cx+mr*.5,mY);ctx.lineTo(cx+mr*1.3,mr);ctx.closePath();ctx.fill();
    // 翅膀上的石纹
    ctx.strokeStyle='#5a6a7a';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx-mr*1.2,mY-mr*.1);ctx.lineTo(cx-mr*.7,mY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+mr*1.2,mY-mr*.1);ctx.lineTo(cx+mr*.7,mY);ctx.stroke();
  }
  if(key==='caveSpider'){
    // 蜘蛛腿（8条）
    ctx.strokeStyle='#3a1a2a';ctx.lineWidth=2;
    for(let i=0;i<4;i++){
      const ang=-Math.PI/2+(i-1.5)*0.5;
      const lx=cx-Math.cos(ang)*mr*.2,ly=mY-mr*.3+Math.sin(ang)*mr*.2;
      const ex=cx-Math.cos(ang)*mr*1.4,ey=mY+Math.sin(ang)*mr*1.2;
      ctx.beginPath();ctx.moveTo(lx,ly);ctx.quadraticCurveTo((lx+ex)/2-mr*.2,(ly+ey)/2,ex,ey);ctx.stroke();
      const rx=cx+Math.cos(ang)*mr*.2;
      const ex2=cx+Math.cos(ang)*mr*1.4;
      ctx.beginPath();ctx.moveTo(rx,ly);ctx.quadraticCurveTo((rx+ex2)/2+mr*.2,(ly+ey)/2,ex2,ey);ctx.stroke();
    }
  }
  if(key==='stalactite'){
    // 钟乳石晶体（头部上方尖锥）
    ctx.fillStyle='#bcbcbc';
    for(let i=-2;i<=2;i++){
      ctx.beginPath();ctx.moveTo(cx+i*mr*.3,mY-mr*.9);ctx.lineTo(cx+i*mr*.3-mr*.12,mY-mr*1.5);ctx.lineTo(cx+i*mr*.3+mr*.12,mY-mr*1.5);ctx.fill();
    }
    ctx.fillStyle='#9a9a9a';
    for(let i=-1;i<=1;i++){
      ctx.beginPath();ctx.moveTo(cx+i*mr*.3,mY-mr*1.0);ctx.lineTo(cx+i*mr*.3-mr*.06,mY-mr*1.4);ctx.lineTo(cx+i*mr*.3+mr*.06,mY-mr*1.4);ctx.fill();
    }
  }
  if(key==='caveGhostLord'){
    // 幽冥王冠（紫色尖冠）
    ctx.fillStyle='#7a2a9a';
    ctx.beginPath();ctx.moveTo(cx-mr*.8,mY-mr*.9);ctx.lineTo(cx-mr*.5,mY-mr*1.6);ctx.lineTo(cx-mr*.25,mY-mr*1.1);ctx.lineTo(cx,mY-mr*1.7);ctx.lineTo(cx+mr*.25,mY-mr*1.1);ctx.lineTo(cx+mr*.5,mY-mr*1.6);ctx.lineTo(cx+mr*.8,mY-mr*.9);ctx.closePath();ctx.fill();
    // 王冠宝石
    ctx.fillStyle='#e040ff';ctx.beginPath();ctx.arc(cx,mY-mr*1.3,mr*.1,0,Math.PI*2);ctx.fill();
    // 飘逸的鬼火须
    ctx.strokeStyle='#b060ff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx-mr*.9,mY);ctx.quadraticCurveTo(cx-mr*1.4,mY+mr*.3,cx-mr*1.1,mY+mr*.7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+mr*.9,mY);ctx.quadraticCurveTo(cx+mr*1.4,mY+mr*.3,cx+mr*1.1,mY+mr*.7);ctx.stroke();
  }
  // Eyes (red glow for most monsters)
  ctx.fillStyle='#ff3333';
  ctx.beginPath();ctx.arc(cx-mr*.3,mY-mr*.4,mr*.15,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+mr*.3,mY-mr*.4,mr*.15,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(cx-mr*.28,mY-mr*.42,mr*.06,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+mr*.32,mY-mr*.42,mr*.06,0,Math.PI*2);ctx.fill();
  // Skeleton teeth
  if(key==='skeleton'){
    ctx.fillStyle='#000';
    ctx.fillRect(cx-mr*.3,mY+mr*.2,mr*.6,mr*.15);
    ctx.fillStyle='#eee';
    for(let i=0;i<5;i++)ctx.fillRect(cx-mr*.3+i*mr*.12,mY+mr*.25,mr*.08,mr*.1);
  }
}

function getPortraitKey(char){
  if(char.isMonster)return MONSTERS[char.mdef.monsterId].img;
  if(char.isPlayer)return 'mengli';
  // 弟子优先使用招募时从"灵根池+职业池"中选定的立绘槽位
  if(char.portraitKey && PORTRAIT_POOL[char.portraitKey]) return char.portraitKey;
  // 旧存档兼容：无 portraitKey 时按灵根/职业推导
  const root=char.spiritRoot;
  if(root && root!=='pseudo'){
    const srKey='sr_'+root+'_'+(char.gender||'m');
    if(PORTRAIT_POOL[srKey] && PORTRAIT_POOL[srKey].length) return srKey;
  }
  return PROFESSIONS[char.profession].img+'_'+(char.gender||'m');
}
// 获取实际立绘数据（base64），从 PORTRAIT_POOL 中选择
function getPortraitData(char){
  const key = getPortraitKey(char);
  const pool = PORTRAIT_POOL[key] || [];
  if(pool.length === 0) return null;
  // 弟子固定 portraitIdx
  if(char.id !== undefined && char.portraitIdx !== undefined){
    return pool[char.portraitIdx % pool.length];
  }
  // 主角/怪物默认取第一张
  return pool[0];
}

function drawBgPortrait(ctx,x,y,w,h){
  const grad=ctx.createLinearGradient(x,y,x,y+h);
  grad.addColorStop(0,'#1a2a4a');grad.addColorStop(1,'#0a0a1a');
  ctx.fillStyle=grad;ctx.fillRect(x,y,w,h);
  // Mountains silhouette
  ctx.fillStyle='#0d1a2a';
  ctx.beginPath();
  ctx.moveTo(x,y+h*.6);
  ctx.lineTo(x+w*.2,y+h*.3);
  ctx.lineTo(x+w*.4,y+h*.5);
  ctx.lineTo(x+w*.6,y+h*.25);
  ctx.lineTo(x+w*.8,y+h*.45);
  ctx.lineTo(x+w,y+h*.35);
  ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath();
  ctx.fill();
  // Mist
  ctx.fillStyle='rgba(200,200,220,.05)';
  ctx.fillRect(x,y+h*.45,w,h*.05);
  ctx.fillRect(x,y+h*.55,w,h*.03);
  // Stars
  ctx.fillStyle='rgba(255,255,200,.3)';
  for(let i=0;i<20;i++){const sx=x+Math.random()*w,sy=y+Math.random()*h*.4;ctx.fillRect(sx,sy,1,1)}
}

// Maps portrait key → local file
const imgLoaded={};
function preloadAIImgs(){
  for(const key in PORTRAIT_POOL){
    const arr=PORTRAIT_POOL[key];
    for(let i=0;i<arr.length;i++){
      const ik=key+'_'+i;
      const img=new Image();
      img.onload=()=>{imgLoaded[ik]={img,loaded:true}};
      img.onerror=()=>{imgLoaded[ik]={loaded:false}};
      img.src=arr[i];
      imgLoaded[ik]={img,loaded:false};
    }
  }
}
// Check if portrait key has real AI image available
function hasAIImg(key){
  return imgLoaded[key]&&imgLoaded[key].loaded;
}

// 统一函数：获取怪物实际拥有的全部技能键（战斗 initChar 与百科共用，确保一致）
// 怪物只使用 MONSTERS 中明确定义的 norm/ult/skillKeys，不自动获得灵根五行技能，确保技能数≤4
function getMonsterSkillKeys(m){
  const keys=[];
  // 兼容两种来源：MONSTERS 定义（norm/ult）与战斗角色对象（monsterSkill/monsterUlt）
  const norm=m.norm||m.monsterSkill;
  const ult=m.ult||m.monsterUlt;
  if(norm)keys.push(norm);
  if(ult)keys.push(ult);
  if(Array.isArray(m.skillKeys))for(const sk of m.skillKeys)if(sk)keys.push(sk);
  const seen=new Set(),out=[];
  for(const k of keys){if(!seen.has(k)){seen.add(k);out.push(k)}}
  return out;
}

function getSkillElem(skKey){
  if(!skKey)return null;
  return SKILLS[skKey]?.elem||null;
}
// 计算五行克制伤害倍率：克制*1.3，被克制*0.7，否则*1.0
function elemCounterMul(attackerElem,defenderRoot){
  if(!attackerElem||!defenderRoot||defenderRoot==='pseudo')return 1;
  if(ELEM_COUNTER[attackerElem]===defenderRoot)return 1.3;
  if(ELEM_COUNTER[defenderRoot]===attackerElem)return 0.7;
  return 1;
}

function getCharPosition(char){
  if(!game.sectPositions) return null;
  if(char.isPlayer || (char.name===game.player.name && !char.id)){
    for(const pos in game.sectPositions){
      if(game.sectPositions[pos].includes('player')) return pos;
    }
  }
  if(char.id){
    for(const pos in game.sectPositions){
      for(const slot of game.sectPositions[pos]){
        if(slot!=='player'){
          const d=game.disciples[slot];
          if(d && d.id===char.id) return pos;
        }
      }
    }
  }
  return null;
}

const TALENT_KEYS=Object.keys(TALENTS);

// Weighted random talent draw: pick among talents of weighted rarity tiers
function pickTalent(){
  const totalW=Object.values(TALENT_RARITY).reduce((s,r)=>s+r.weight,0);
  let r=Math.random()*totalW,tier=1;
  for(const [lv,w] of Object.entries(TALENT_RARITY)){r-=w.weight;if(r<=0){tier=+lv;break}}
  const pool=TALENT_KEYS.filter(k=>TALENTS[k].rarity===tier);
  if(pool.length===0)return pick(TALENT_KEYS);
  return pick(pool);
}
function rollTalents(n){
  const res=[];
  for(let i=0;i<n;i++){
    let t=pickTalent(),guard=20;
    while(res.includes(t)&&guard-->0)t=pickTalent();
    if(!res.includes(t))res.push(t);
  }
  return res;
}
// 主角专属：必定3个天赋，且至少1个稀有(罕见)级别以上
function rollPlayerTalents(){
  const res=[];
  const rarePool=TALENT_KEYS.filter(k=>TALENTS[k].rarity>=3);
  res.push(pick(rarePool));
  while(res.length<3){
    let t=pickTalent(),guard=20;
    while(res.includes(t)&&guard-->0)t=pickTalent();
    if(!res.includes(t))res.push(t);
  }
  return res.sort(()=>Math.random()-.5);
}

// 状态效果描述函数（百科共用，与 applyStatus/tickStatus 同源）
function getStatusDesc(type){
  const cfg=STATUS_CONFIG[type];if(!cfg)return'';
  const parts=[];
  const pct=v=>Math.round(v*100)+'%';
  if(cfg.hpDmg){parts.push('每'+cfg.tickInterval+'秒造成'+cfg.hpDmg+'×层数生命伤害');if(cfg.mpDmg)parts.push(cfg.mpDmg+'×层数法力伤害')}
  else if(cfg.hpHeal){parts.push('每'+cfg.tickInterval+'秒恢复'+cfg.hpHeal+'×层数生命')}
  else if(cfg.mpHeal){parts.push('每'+cfg.tickInterval+'秒恢复'+cfg.mpHeal+'×层数法力')}
  else if(cfg.atkFlat!==undefined){parts.push('每层'+(cfg.atkFlat>0?'提升':'降低')+Math.abs(cfg.atkFlat)+'攻击力')}
  else if(cfg.defFlat!==undefined){parts.push('每层'+(cfg.defFlat>0?'提升':'降低')+Math.abs(cfg.defFlat)+'防御力')}
  else if(cfg.spdPctPer!==undefined){parts.push('每层'+(cfg.spdPctPer>0?'提升':'降低')+pct(Math.abs(cfg.spdPctPer))+'速度')}
  else if(cfg.atkPct!==undefined){parts.push((cfg.atkPct>0?'提升':'降低')+'攻击力(具体由技能决定)')}
  else if(cfg.defPct!==undefined){parts.push((cfg.defPct>0?'提升':'降低')+'防御力(具体由技能决定)')}
  else if(cfg.spdPct!==undefined){parts.push((cfg.spdPct>0?'提升':'降低')+'速度(具体由技能决定)')}
  else if(cfg.critPct!==undefined){parts.push('提升暴击率(具体由技能决定)')}
  else if(cfg.reflectPct!==undefined){parts.push('反弹受到伤害的(具体由技能决定)')}
  else if(cfg.stun){parts.push('跳过行动')}
  parts.push('最高叠加'+cfg.maxStacks+'层');
  parts.push('持续时间由施加技能决定');
  return parts.join('，');
}
// All human characters have: norm (profession basic), ult (profession big), plus universal skills
const HUMAN_SKILLS=['qiBlast','qiBullet','qiStorm','qiHeal'];
const MAX_EQUIPPED=4;
// 每个职业的扩展专属技能键（norm/ult 之外）
const PROFESSION_EXTRA={
  sword:['sword_s2','sword_s3','sword_s4','sword_s5','sword_s6','sword_s7'],
  alchemy:['alchemy_s2','alchemy_s3','alchemy_s4','alchemy_s5','alchemy_s6'],
  body:['body_s2','body_s3','body_s4','body_s5','body_s6','body_s7'],
  formation:['formation_s2','formation_s3','formation_s4','formation_s5','formation_s6','formation_s7','formation_s8'],
  spirit:['spirit_s2','spirit_s3','spirit_s4','spirit_s5','spirit_s6'],
  soul:['soul_s2','soul_s3','soul_s4','soul_s5','soul_s6'],
};
// 职业练气期技能（人阶，建角色即掌握，不参与突破解锁）
const PROFESSION_QI_SKILLS={
  sword:['sword_q1','sword_q2'],
  alchemy:['alchemy_q1','alchemy_q2'],
  body:['body_q1','body_q2'],
  formation:['formation_q1','formation_q2'],
  spirit:['spirit_q1','spirit_q2'],
  soul:['soul_q1','soul_q2'],
};
// 职业技能按大境界解锁顺序：炼气(norm) → 筑基(ult) → 金丹(s2) → 元婴(s3) → 化神(s4) → 渡劫(s5) → 飞升(s6/s7...)
// 即 index 为所需 bigRealm：norm=0, ult=1, extras[0]=2, extras[1]=3 ...
function getProfSkillOrder(prof){
  const p=PROFESSIONS[prof];if(!p)return[];
  return [p.norm,p.ult,...(PROFESSION_EXTRA[prof]||[])];
}
// 某职业技能所需的大境界（index）；非职业技能返回 -1
function getProfSkillRealm(prof,skillKey){
  return getProfSkillOrder(prof).indexOf(skillKey);
}
// 某大境界下应拥有的全部职业技能（norm 永远在内）
function getProfSkillsByRealm(prof,bigRealm){
  const order=getProfSkillOrder(prof);
  return order.slice(0,Math.min(bigRealm+1,order.length));
}
// Returns the initial skill pool at 炼气期 (bigRealm=0): norm + qi-period profession skills + universal skills.
// ult and profession extras are realm-gated (unlocked via breakthrough choice).
function getCharSkills(prof){
  const p=PROFESSIONS[prof];
  const qiSkills=PROFESSION_QI_SKILLS[prof]||[];
  const learned=[p.norm,...qiSkills,...HUMAN_SKILLS];
  // Default equipped: qi-period profession skills first, then universal skills (norm always active, not in slots)
  const equipped=[...qiSkills,...HUMAN_SKILLS].slice(0,MAX_EQUIPPED);
  return{learned,equipped};
}
// 公共技能描述函数（弟子详情与百科共用，与 execute() 实际效果同源）
function getSkillDesc(skKey){
  const s=SKILLS[skKey];if(!s)return'';
  const desc=[];
  const pct=v=>Math.round(v*100)+'%';
  // 目标（仅在造成伤害时显示攻击目标；纯治疗按治疗目标标注；纯自身增益显示自身）
  if(s.dmg){
    if(s.target==='all')desc.push('全体');
    else if(s.target==='randomN')desc.push('随机'+s.randomCount+'目标');
    else if(s.target==='single')desc.push('单体');
  }else if(s.heal){
    // 纯治疗技能：按 healTarget 显示实际治疗目标
    if(s.healTarget==='all')desc.push('全队');
    else desc.push('最低血友方');
  }else if(s.target==='self'){
    desc.push('自身');
  }else if(s.target==='all'){
    desc.push('全队');
  }
  // 伤害/治疗/吸血
  if(s.dmg)desc.push('伤害'+s.dmg+'x攻击');
  if(s.hits)desc.push(s.hits+'连击');
  if(s.heal){const t=s.healTarget==='all'?'全队':'最低血友方';const hb=(s.elem==='wood')?'生命':'攻击';desc.push('治疗'+pct(s.heal)+hb+'('+t+')')}
  if(s.lifesteal)desc.push('吸血'+pct(s.lifesteal));
  if(s.teamMpRestore)desc.push('全队回蓝'+s.teamMpRestore);
  if(s.mpRestoreSelf)desc.push('自身回蓝'+s.mpRestoreSelf);
  // 状态效果（统一从 statuses[] 读取，与 execute() 同源）
  if(s.statuses&&s.statuses.length>0){
    for(const st of s.statuses){
      const cfg=STATUS_CONFIG[st.type];if(!cfg)continue;
      const tgt=st.target==='self'?'自身':st.target==='team'?'全队':st.target==='hit'?'目标':'';
      const chanceStr=st.chance!==undefined&&st.chance<1?pct(st.chance):'';
      const durStr=st.dur?st.dur+'秒':'';
      let valStr='';
      if(st.val!==undefined){
        const sign=st.val>0?'+':'-';
        if(cfg.atkPct!==undefined)valStr='攻击'+sign+pct(Math.abs(st.val));
        else if(cfg.defPct!==undefined)valStr='防御'+sign+pct(Math.abs(st.val));
        else if(cfg.spdPct!==undefined)valStr='速度'+sign+pct(Math.abs(st.val));
        else if(cfg.critPct!==undefined)valStr='暴击'+sign+pct(Math.abs(st.val));
        else if(cfg.reflectPct!==undefined)valStr='反弹'+pct(Math.abs(st.val));
      }
      desc.push((chanceStr?chanceStr+' ':'')+tgt+cfg.name+valStr+(durStr?' '+durStr:''));
    }
  }
  // 驱散（高阶治疗技能附带的负面状态驱散）
  if(s.dispel)desc.push('驱散1种负面');
  // CD/法力
  if(s.cd)desc.push('CD'+s.cd+'回合');
  if(s.mpCost)desc.push(s.mpCost+'法力');
  return desc.join(' ');
}
// How many profession-extras have been unlocked for a char (based on current learnedSkills)
function countProfExtras(char){
  const prof=char.profession;
  if(!prof)return 0;
  const extras=PROFESSION_EXTRA[prof]||[];
  return (char.learnedSkills||[]).filter(k=>extras.includes(k)).length;
}
// Picks 3 candidate skill keys for the breakthrough choice panel
function pickSkillOptions(char){
  const prof=char.profession;
  if(!prof)return[];
  const learned=new Set(char.learnedSkills||[]);
  const bigRealm=char.bigRealm||0;
  // 职业技能（含大招）：仅提供已达到境界要求且尚未学会的
  const profOrder=getProfSkillOrder(prof);
  const profUnlearned=profOrder.filter(k=>{
    if(learned.has(k))return false;
    const req=getProfSkillRealm(prof,k);
    return req>=0 && req<=bigRealm; // norm(req=0)一般已学会，ult(req=1)等需达到对应境界
  });
  const universals=HUMAN_SKILLS.filter(k=>!learned.has(k));
  // 候选池：职业技能（境界达标）> 通用技能（五行技能只能通过藏经阁技能书学习）
  let pool=[...profUnlearned,...universals];
  // 候选不足时，回退到已学会的职业技能作为重复选项
  if(pool.length<3)pool=[...pool,...profOrder.filter(k=>learned.has(k))];
  // 保证首选项为可学的职业技能（若有），引导玩家逐境解锁职业技能
  let result=[];
  if(profUnlearned.length>0){
    result.push(profUnlearned[0]);
    pool=pool.filter(k=>k!==profUnlearned[0]);
  }
  const shuffled=[...pool].sort(()=>Math.random()-.5);
  result=[...result,...shuffled];
  return result.slice(0,Math.min(3,result.length));
}

// ===== 跨设备存档：显式 JSON 存档文本 + URL hash（不依赖 localStorage origin）=====
// 手机端每次预览链接 origin 不同，localStorage 存档会丢失；
// 用存档文本 / 带 hash 的链接可在任意链接恢复进度。
// 存档格式：【修仙宗门存档 v1】\n{JSON}\n【存档结束】
const SAVE_HEADER='【修仙宗门存档 v2】';
const SAVE_FOOTER='【存档结束】';
function exportSaveText(){
  try{
    const json=_serializeSave();
    return SAVE_HEADER+'\n'+json+'\n'+SAVE_FOOTER;
  }catch(e){return ''}
}
function _tryParseSaveText(text){
  if(!text)return null;
  // 先保留原始文本检查标记头（标记头里有空格，strip 后会变）
  let t=text.trim();
  // 1. 新格式：标记头 + JSON + 标记尾（原始文本检查）
  let hIdx=t.indexOf(SAVE_HEADER);
  let fIdx=t.indexOf(SAVE_FOOTER);
  if(hIdx>=0&&fIdx>hIdx){
    let body=t.substring(hIdx+SAVE_HEADER.length,fIdx);
    // body 里可能有换行/空格，但只要前后是 { } 就行
    body=body.trim();
    if(body.startsWith('{')&&body.endsWith('}'))return body;
  }
  if(hIdx>=0){
    let body=t.substring(hIdx+SAVE_HEADER.length).trim();
    if(body.startsWith('{')&&body.endsWith('}'))return body;
  }
  // 彻底清除空白字符（处理手机端复制粘贴带的换行/空格）
  let raw=t.replace(/\s+/g,'');
  if(!raw)return null;
  // 2. 直接 JSON
  if(raw.startsWith('{')&&raw.endsWith('}'))return raw;
  // 3. 兼容旧 base64 存档码（btoa(encodeURIComponent(json))）
  // 手机端可能截断了尾部，尝试逐步截断到合法 base64
  const tryB64=(s)=>{
    try{
      // base64 长度必须是 4 的倍数
      let pad=s;
      while(pad.length%4!==0)pad=pad.slice(0,-1);
      if(!pad)return null;
      const decoded=atob(pad);
      // atob 返回的是 Latin-1，需要检查是否是 % 编码的 JSON
      if(decoded.startsWith('%')){
        try{
          const json=decodeURIComponent(decoded);
          if(json.startsWith('{'))return json;
        }catch(e){}
      }
      // 也可能是直接的 JSON（不经过 encodeURIComponent）
      if(decoded.startsWith('{')&&decoded.endsWith('}'))return decoded;
      return null;
    }catch(e){return null}
  };
  // 先尝试完整字符串
  let r=tryB64(raw);
  if(r)return r;
  // 再尝试逐步截断（处理手机端粘贴截断的情况）
  for(let len=raw.length-4;len>100;len-=4){
    r=tryB64(raw.slice(0,len));
    if(r)return r;
  }
  // 4. 兼容 URL hash 里的 encodeURIComponent JSON
  try{
    const decoded=decodeURIComponent(raw);
    if(decoded.startsWith('{')&&decoded.endsWith('}'))return decoded;
  }catch(e){}
  return null;
}
function _fixTruncatedJSON(json){
  // 尝试修复截断的 JSON：补全缺失的 } ]
  if(!json)return json;
  // 简单修复：如果不以 } 或 ] 结尾，尝试补全
  if(!/[}\]]\s*$/.test(json)){
    // 计算括号不匹配数
    let depth=0,inStr=false,esc=false;
    for(let i=0;i<json.length;i++){
      const c=json[i];
      if(esc){esc=false;continue}
      if(c==='\\'&&inStr){esc=true;continue}
      if(c==='"'){inStr=!inStr;continue}
      if(inStr)continue;
      if(c==='{'||c==='[')depth++;
      else if(c==='}'||c===']')depth--;
    }
    // 补全括号
    if(depth>0){
      // 找到最后一个完整属性值的结尾
      let fixed=json.replace(/,\s*$/, '');
      // 从后往前补全，先补 ] 再补 }
      const stack=[];
      let inStr2=false,esc2=false;
      for(let i=0;i<fixed.length;i++){
        const c=fixed[i];
        if(esc2){esc2=false;continue}
        if(c==='\\'&&inStr2){esc2=true;continue}
        if(c==='"'){inStr2=!inStr2;continue}
        if(inStr2)continue;
        if(c==='{')stack.push('}');
        else if(c==='[')stack.push(']');
        else if(c==='}'||c===']')stack.pop();
      }
      fixed+=stack.reverse().join('');
      return fixed;
    }
  }
  return json;
}
function importSaveText(text){
  try{
    let json=_tryParseSaveText(text);

      json=_fixTruncatedJSON(json);

      return true;
    }
  }catch(e){return false}
}

function _serializeSave(){
  // 处理 Set → Array（endlessRun 里的 deadChars / pillUsed）
  const run=game.endlessRun;
  let runCopy=null;
  if(run){
    runCopy={
      round:run.round,
      deadChars:Array.from(run.deadChars||[]),
      charState:run.charState,
      pillUsed:Array.from(run.pillUsed||[]),
      rewards:run.rewards
    };
  }
  return JSON.stringify({
    player:game.player,disciples:game.disciples,teamSlots:game.teamSlots,
    cultivateSlots:game.cultivateSlots,recruitCandidates:game.recruitCandidates,
    battleSpeed:game.battleSpeed,
    endlessRun:runCopy,
    resources:game.resources,sect:game.sect,sectPositions:game.sectPositions,
    realmProgress:game.realmProgress,warehouse:game.warehouse,lastSave:game.lastSave
  });
}

// 任何版本的旧存档导入时，缺失的字段都会用这里的值填充
const SAVE_DEFAULTS={
  disciples:[],
  cultivateSlots:['player'],
  recruitCandidates:[],
  teamSlots:[],
  resources:{spirit:500,herb:10,skillPage:0},
  sect:{buildings:{cultivationHall:1,herbGarden:1,alchemyRoom:0,library:0,caveDwelling:0}},
  warehouse:{skillBooks:{},pills:{metal:0,wood:0,water:0,fire:0,earth:0,pseudo:0},recoveryPills:{small:0,mid:0,large:0}},
  sectPositions:{leader:['player'],deputy:[],elder:[],guardian:[]},
  realmProgress:{darkForest:{floor:1,cleared:false},shallowShore:{floor:1,cleared:false},mistySwamp:{floor:1,cleared:false},karstCave:{floor:1,cleared:false},beastMountain:{floor:1,cleared:false},ancientBattle:{floor:1,cleared:false},dragonTigerCave:{floor:1,cleared:false},monkeyGarden:{floor:1,cleared:false},valleyDemons:{floor:1,cleared:false}},
  battleSpeed:1,
  endlessRun:null,
};
const PLAYER_DEFAULTS={gender:'m',cultPoints:0,spiritRoot:'pseudo',talents:[],learnedSkills:[],equippedSkills:[]};
// 深度合并：target 缺失的字段从 source 取（不覆盖 target 已有的值）
function _deepFill(target,source){
  if(target===undefined||target===null)return source;
  if(typeof target!=='object'||Array.isArray(target))return target;
  for(const k in source){
    if(target[k]===undefined){
      target[k]=source[k];
    }else if(typeof source[k]==='object'&&!Array.isArray(source[k])&&source[k]!==null){
      _deepFill(target[k],source[k]);
    }
  }
  return target;
}

function _deserializeSave(json){
  const s=JSON.parse(json);
  // 1. 先把存档数据合并到 game（Object.assign 只合并顶层）
  Object.assign(game,s);
  // 2. 深度填充顶层缺失字段（用 SAVE_DEFAULTS）
  _deepFill(game,SAVE_DEFAULTS);
  // 3. 玩家对象缺失字段
  if(game.player){
    _deepFill(game.player,PLAYER_DEFAULTS);
    if(!Array.isArray(game.player.talents))game.player.talents=[];
    if(!Array.isArray(game.player.learnedSkills))game.player.learnedSkills=[];
    if(!Array.isArray(game.player.equippedSkills))game.player.equippedSkills=[];
  }
  // 4. 弟子对象逐个补默认值
  if(Array.isArray(game.disciples)){
    for(const d of game.disciples){
      if(!d)continue;
      _deepFill(d,PLAYER_DEFAULTS);
      if(!Array.isArray(d.talents))d.talents=[];
      if(!Array.isArray(d.learnedSkills))d.learnedSkills=[];
      if(!Array.isArray(d.equippedSkills))d.equippedSkills=[];
    }
  }
  // 5. 嵌套对象进一步深填
  if(game.warehouse){
    if(game.warehouse.pills)_deepFill(game.warehouse.pills,SAVE_DEFAULTS.warehouse.pills);
    if(game.warehouse.recoveryPills)_deepFill(game.warehouse.recoveryPills,SAVE_DEFAULTS.warehouse.recoveryPills);
    if(!game.warehouse.skillBooks)game.warehouse.skillBooks={};
  }
  if(game.resources)_deepFill(game.resources,SAVE_DEFAULTS.resources);
  if(game.sect&&game.sect.buildings)_deepFill(game.sect.buildings,SAVE_DEFAULTS.sect.buildings);
  if(game.sectPositions){
    for(const pos of ['leader','deputy','elder','guardian']){
      if(!Array.isArray(game.sectPositions[pos]))game.sectPositions[pos]=pos==='leader'?['player']:[];
    }
  }
  // 6. 修炼位槽校验
  game.cultivateSlots=game.cultivateSlots.filter(s=>s==='player'||game.disciples[s]).slice(0,4);
  if(!game.cultivateSlots.includes('player'))game.cultivateSlots.unshift('player');
  // 7. 宗门职位过滤无效槽位
  const validSlots=['player',...game.disciples.map((_,i)=>i)];
  for(const pos in game.sectPositions){
    game.sectPositions[pos]=game.sectPositions[pos].filter(s=>validSlots.includes(s));
  }
  if(!game.sectPositions.leader.includes('player'))game.sectPositions.leader=['player'];
  // 8. endlessRun Set 还原
  if(game.endlessRun){
    if(Array.isArray(game.endlessRun.deadChars))game.endlessRun.deadChars=new Set(game.endlessRun.deadChars);
    else game.endlessRun.deadChars=new Set();
    if(Array.isArray(game.endlessRun.pillUsed))game.endlessRun.pillUsed=new Set(game.endlessRun.pillUsed);
    else game.endlessRun.pillUsed=new Set();
  }
  // 9. 技能回补（旧存档缺职业技能）
  const backfillQiSkills=(ch)=>{
    if(!ch||!ch.profession)return;
    const qiSkills=PROFESSION_QI_SKILLS[ch.profession]||[];
    if(!Array.isArray(ch.learnedSkills))ch.learnedSkills=getCharSkills(ch.profession).learned;
    for(const qk of qiSkills){if(!ch.learnedSkills.includes(qk))ch.learnedSkills.splice(1,0,qk)}
    if(!Array.isArray(ch.equippedSkills))ch.equippedSkills=getCharSkills(ch.profession).equipped;
  };
  backfillQiSkills(game.player);
  if(game.disciples)for(const d of game.disciples)backfillQiSkills(d);
}

    if(!game.warehouse.recoveryPills)game.warehouse.recoveryPills={small:0,mid:0,large:0};

    // 清理无效职务并保证掌门存在
    const validSlots=['player',...game.disciples.map((_,i)=>i)];
    for(const pos in game.sectPositions){
      game.sectPositions[pos]=game.sectPositions[pos].filter(s=>validSlots.includes(s));
    }
    if(!game.sectPositions.leader.includes('player'))game.sectPositions.leader=['player'];
    if(!game.player.gender)game.player.gender='m';

    if(game.disciples){for(const d of game.disciples){
      if(!d.portraitKey || !PORTRAIT_POOL[d.portraitKey]){
        // 旧存档：按灵根池优先、回退职业池推导 portraitKey
        let pk=null;
        if(d.spiritRoot && d.spiritRoot!=='pseudo'){
          const srKey='sr_'+d.spiritRoot+'_'+(d.gender||'m');
          if(PORTRAIT_POOL[srKey] && PORTRAIT_POOL[srKey].length) pk=srKey;
        }
        if(!pk) pk=(PROFESSIONS[d.profession]?.img||d.profession)+'_'+(d.gender||'m');
        d.portraitKey=pk;
      }
      const pool = PORTRAIT_POOL[d.portraitKey] || [];

      else d.portraitIdx=0;

    const sanitize=(arr)=>{if(!arr)return rollTalents(rnd(3)+1);let clean=arr.filter(t=>TALENTS[t]).slice(0,3);while(clean.length<1)clean.push(pickTalent());return clean};
    // 主角天赋修复：保证3个且至少1个稀有(罕见)以上
    const sanitizePlayer=(arr)=>{
      let clean=(arr||[]).filter(t=>TALENTS[t]).slice(0,3);
      if(!clean.some(t=>TALENTS[t].rarity>=3)){
        const rarePool=TALENT_KEYS.filter(k=>TALENTS[k].rarity>=3&&!clean.includes(k));
        if(rarePool.length)clean.push(pick(rarePool));

    // 补全新秘境进度
    for(const sr of SECRET_REALMS){if(!game.realmProgress[sr.id])game.realmProgress[sr.id]={floor:1,cleared:false}}
    if(game.recruitCandidates){for(const d of game.recruitCandidates){if(d&&!d.spiritRoot)d.spiritRoot=randomSpiritRoot()}}
    // Backfill skills: ensure learnedSkills/equippedSkills exist for player & disciples
    // 职业技能按大境界解锁：炼气期仅 norm，ult/扩展技能需达到对应大境界才能学会
    const sanitizeSkills=(ch)=>{
      if(!ch.profession)return;
      const def=getCharSkills(ch.profession);
      const bigRealm=ch.bigRealm||0;
      const profOrder=getProfSkillOrder(ch.profession);
      const norm=PROFESSIONS[ch.profession].norm;
      if(!Array.isArray(ch.learnedSkills)){
        // 全新角色：炼气期初始池（仅 norm + 通用技能，不含 ult/职业扩展）
        ch.learnedSkills=[...def.learned];
      }else{
        // 过滤非法技能，并强制移除境界未达标的职业技能
        ch.learnedSkills=ch.learnedSkills.filter(k=>{
          if(!SKILLS[k])return false;
          const req=getProfSkillRealm(ch.profession,k);
          if(req>=0 && req>bigRealm)return false; // 职业技能境界不够，移除
          return true;
        });
      }
      // 确保普攻 norm 常驻
      if(!ch.learnedSkills.includes(norm))ch.learnedSkills.unshift(norm);
      // 确保练气期职业技能常驻（旧存档回补）
      const qiSkills=PROFESSION_QI_SKILLS[ch.profession]||[];
      for(const qk of qiSkills){if(!ch.learnedSkills.includes(qk))ch.learnedSkills.splice(1,0,qk)}
      // equipped：排除 norm、限制数量、必须 ⊆ learned
      if(!Array.isArray(ch.equippedSkills))ch.equippedSkills=def.equipped;
      else ch.equippedSkills=ch.equippedSkills.filter(k=>SKILLS[k]&&k!==norm).slice(0,MAX_EQUIPPED);
      // 若装备栏有空位，自动装备尚未装备的练气期职业技能
      for(const qk of qiSkills){
        if(ch.equippedSkills.length<MAX_EQUIPPED && !ch.equippedSkills.includes(qk) && ch.learnedSkills.includes(qk)){
          ch.equippedSkills.push(qk);
        }
      }
      ch.equippedSkills=ch.equippedSkills.filter(k=>ch.learnedSkills.includes(k));
    };
    sanitizeSkills(game.player);
    if(game.disciples){for(const d of game.disciples){sanitizeSkills(d)}}
    // Backfill cultivate slots (ensure valid & max 4)
    if(!Array.isArray(game.cultivateSlots)||game.cultivateSlots.length===0)game.cultivateSlots=['player'];
    game.cultivateSlots=game.cultivateSlots.filter(s=>s==='player'||game.disciples[s]).slice(0,4);
    if(!game.cultivateSlots.includes('player'))game.cultivateSlots.unshift('player');
    if(!Array.isArray(game.recruitCandidates))game.recruitCandidates=[];
    const off=Math.min((Date.now()-s.lastSave)/1000,3600*4);
    for(const slot of game.cultivateSlots){
      const ch=getCharFromSlot(slot);
      if(ch)ch.cultPoints=Math.floor(Math.min(ch.cultPoints+off*getCultSpeed(ch)*.5,cultUpgradeCost(ch)));
    }
    return true;
  }catch(e){return false}
}

function talentHtml(tid){const t=TALENTS[tid];if(!t)return '?';const r=TALENT_RARITY[t.rarity]||TALENT_RARITY[1];return`<span style="color:${r.color}">${t.name}</span>`}
function talentChip(tid){const t=TALENTS[tid];if(!t)return '';const r=TALENT_RARITY[t.rarity]||TALENT_RARITY[1];return`<span style="color:${r.color}">${t.name}</span>`}

//============ CHARACTER SYSTEM ============
function calcAttrs(char){
  const p=char.isMonster?char.base:PROFESSIONS[char.profession].base;
  let mods={hp:0,mp:0,atk:0,def:0,spd:0,critRate:0,critDmg:0};
  // 性别修正（人形角色）
  if(!char.isMonster){const gm=genderMods(char);for(const k in mods){mods[k]+=gm[k]}}
  if(char.talents){for(const tid of char.talents){const t=TALENTS[tid];if(!t)continue;const m=t.mods;
    if(m.allMul){mods.hp+=p.hp*m.allMul;mods.mp+=p.mp*m.allMul;mods.atk+=p.atk*m.allMul;mods.def+=p.def*m.allMul;mods.spd+=p.spd*m.allMul}
    if(m.hpMul)mods.hp+=p.hp*m.hpMul;if(m.mpMul)mods.mp+=p.mp*m.mpMul;
    if(m.atkMul)mods.atk+=p.atk*m.atkMul;if(m.defMul)mods.def+=p.def*m.defMul;
    if(m.spdMul)mods.spd+=p.spd*m.spdMul;if(m.critRateAdd)mods.critRate+=m.critRateAdd;if(m.critDmgAdd)mods.critDmg+=m.critDmgAdd;
  }}
  // 灵根加成
  if(!char.isMonster && char.spiritRoot){
    const sr=SPIRIT_ROOTS[char.spiritRoot];
    if(sr && sr.mods){const m=sr.mods;
      if(m.hpMul)mods.hp+=p.hp*m.hpMul;if(m.mpMul)mods.mp+=p.mp*m.mpMul;
      if(m.atkMul)mods.atk+=p.atk*m.atkMul;if(m.defMul)mods.def+=p.def*m.defMul;
      if(m.spdMul)mods.spd+=p.spd*m.spdMul;if(m.critRateAdd)mods.critRate+=m.critRateAdd;if(m.critDmgAdd)mods.critDmg+=m.critDmgAdd;
    }
  }
  // 宗门职务加成
  const pos=getCharPosition(char);
  if(pos){const pm=SECT_POSITIONS[pos].mods;
    if(pm.hpMul)mods.hp+=p.hp*pm.hpMul;if(pm.mpMul)mods.mp+=p.mp*pm.mpMul;
    if(pm.atkMul)mods.atk+=p.atk*pm.atkMul;if(pm.defMul)mods.def+=p.def*pm.defMul;
    if(pm.spdMul)mods.spd+=p.spd*pm.spdMul;if(pm.critRateAdd)mods.critRate+=pm.critRateAdd;if(pm.critDmgAdd)mods.critDmg+=pm.critDmgAdd;
  }
  const eb={hp:p.hp+mods.hp,mp:p.mp+mods.mp,atk:p.atk+mods.atk,def:p.def+mods.def,spd:p.spd+mods.spd,critRate:p.critRate+mods.critRate,critDmg:p.critDmg+mods.critDmg};
  // 怪物境界 = 进入秘境时玩家的大境界（动态缩放）；Boss 额外 realmReq 加成（仅攻击，避免过肉）
  let ts=0,tb=0;
  ts=char.bigRealm*SMALL_PER_BIG+(char.smallRealm-1);
  tb=char.bigRealm;
  let bossAtkBonus=1;
  if(char.isMonster&&char.realmReq>0)bossAtkBonus=1+0.03*char.realmReq;
  // 境界缩放：小境界线性小幅成长，大境界台阶式成长（系数较此前大幅降低，避免跨大境界数值膨胀）
  const hpMul=1+.08*ts+0.5*tb,atkMul=(1+.04*ts+.25*tb)*bossAtkBonus,critMul=1+.15*tb;
  return{
    hp:Math.floor(eb.hp*hpMul),mp:Math.floor(eb.mp*hpMul),
    atk:Math.floor(eb.atk*atkMul),def:Math.floor(eb.def*atkMul),
    spd:eb.spd*critMul,critRate:eb.critRate*critMul,critDmg:eb.critDmg*critMul
  };
}
function realmStr(char){return REALMS[char.bigRealm]+char.smallRealm+'层'}
function getCharName(char){return char.isMonster?char.mdef.name:char.name}
function getSpiritColor(char){const sr=SPIRIT_ROOTS[char&&char.spiritRoot];return sr?sr.color:'#bdbdbd'}
function createPlayer(){const sk=getCharSkills(game.player.profession);const learned=game.player.learnedSkills&&game.player.learnedSkills.length>0?game.player.learnedSkills:sk.learned;const equipped=game.player.equippedSkills&&game.player.equippedSkills.length>0?game.player.equippedSkills:sk.equipped;return{name:game.player.name,profession:game.player.profession,bigRealm:game.player.bigRealm,smallRealm:game.player.smallRealm,talents:game.player.talents,gender:game.player.gender,isPlayer:true,learnedSkills:learned,equippedSkills:equipped}}
function createDisciple(){
  const prof=pick(Object.keys(PROFESSIONS));
  const g = Math.random()<.5?'m':'f';
  // Talent count: 1→50%, 2→40%, 3→10%  (max 3)
  const nt=rnd(100)<10?3:rnd(100)<50?2:1;
  const talents=rollTalents(Math.min(nt,3));
  const sk=getCharSkills(prof);
  const spiritRoot=randomSpiritRoot();
  // 立绘候选池：灵根立绘 + 职业立绘（同性别），合并后随机选一张
  // 例：火灵根体修男 → 从 sr_fire_m 与 body_m 两个池中任选
  const candidates=[];
  if(spiritRoot&&spiritRoot!=='pseudo'){
    const srKey='sr_'+spiritRoot+'_'+g;
    const srPool=PORTRAIT_POOL[srKey]||[];
    for(let i=0;i<srPool.length;i++)candidates.push({key:srKey,idx:i});
  }
  const profKey=prof+'_'+g;
  const profPool=PORTRAIT_POOL[profKey]||[];
  for(let i=0;i<profPool.length;i++)candidates.push({key:profKey,idx:i});
  let portraitKey=profKey,portraitIdx=0;
  if(candidates.length){
    const c=candidates[rnd(candidates.length)];
    portraitKey=c.key;portraitIdx=c.idx;
  }
  const bigRealm=Math.max(0,game.player.bigRealm-1);
  // 新招募弟子：按其大境界自动赋予已达标的职业技能（含大招），保证战力
  const profSkills=getProfSkillsByRealm(prof,bigRealm);
  const learned=[...new Set([...sk.learned,...profSkills])];
  // 装备：优先职业技能（除norm），再补通用技能至 MAX_EQUIPPED
  const profEquip=profSkills.filter(k=>k!==PROFESSIONS[prof].norm);
  const equipped=[...profEquip,...HUMAN_SKILLS].slice(0,MAX_EQUIPPED);
return{id:Date.now()+rnd(999),name:genName(),profession:prof,bigRealm,smallRealm:1,talents,gender:g,portraitKey,portraitIdx,cultPoints:0,spiritRoot,learnedSkills:learned,equippedSkills:equipped};
}
function createMonster(monsterId,floor,playerBigRealm,realmReq){
  const m=MONSTERS[monsterId];
  const scale=1+.15*(floor-1);
  const base={};for(const k in m.base)base[k]=Math.floor(m.base[k]*scale);
  // 怪物小境界随楼层递增：第一关=1层，第二关=2层...超过10层自动进位大境界
  let bigR=Math.max(playerBigRealm||0,realmReq||0);
  let smR=Math.min(floor,SMALL_PER_BIG);
  if(floor>SMALL_PER_BIG){bigR+=Math.floor((floor-1)/SMALL_PER_BIG);smR=((floor-1)%SMALL_PER_BIG)+1}
  return{isMonster:true,mdef:{monsterId,name:m.name},base,talents:[],bigRealm:bigR,smallRealm:smR,profession:null,monsterSkill:m.norm,monsterUlt:m.ult,spiritRoot:m.spiritRoot,skillKeys:m.skillKeys||null,realmReq:realmReq||0};
}

//============ CULTIVATION ============
function getCharFromSlot(slot){
  if(slot==='player')return game.player;
  return game.disciples[slot];
}
function getCultSpeed(char){
  if(!char)char=game.player;
  let s=10*(1+char.bigRealm*.5);
  const lvl=game.sect.buildings.cultivationHall||0;
  s*=1+.10*lvl;
  return s;
}
function cultUpgradeCost(char){
  if(!char)char=game.player;
  const b=char.bigRealm,s=char.smallRealm;
  // 小境界提升：随大境界指数增长，每大境界所需修为大幅提升
  if(s<SMALL_PER_BIG)return Math.floor(100*s*(b+1)*(b+1));
  // 大境界突破
  return Math.floor(1000*(b+1)*(b+1));
}
function canBreakthrough(char){
  if(!char)char=game.player;
  return char.bigRealm<REALMS.length-1&&char.smallRealm>=SMALL_PER_BIG;
}
function doCultivate(slot){
  const char=getCharFromSlot(slot);
  if(!char){toast('角色不存在');return}
  const cost=cultUpgradeCost(char);
  if(char.cultPoints<cost){toast('修为不足');return}
  // 大境界突破需要消耗对应灵根突破丹
  if(canBreakthrough(char)){
    const targetRealm=char.bigRealm+1;
    const pillCost=PILL_COST_PER_REALM[targetRealm]||0;
    const root=char.spiritRoot;
    const have=game.warehouse.pills[root]||0;
    if(have<pillCost){
      const pillName=BREAKTHROUGH_PILLS[root]?.name||'突破丹';
      toast(`需要${pillCost}个${pillName}（持有${have}）`);
      return;
    }
    game.warehouse.pills[root]-=pillCost;
  }
  char.cultPoints-=cost;
  let didBT=false;
  if(canBreakthrough(char)){char.bigRealm++;char.smallRealm=1;didBT=true;toast((char.name||'主角')+'突破至'+REALMS[char.bigRealm]+'!')}
  else{char.smallRealm++;toast((char.name||'主角')+'提升至'+realmStr(char))}
  saveGame();renderCultivation();
  // 突破大境界 → 弹出三选一技能学习
  if(didBT)openSkillChoice(slot);
}
function toggleCultivate(slot){
  const i=game.cultivateSlots.indexOf(slot);
  if(i>=0){
    if(slot==='player'){toast('掌门必须修炼');return}
    game.cultivateSlots.splice(i,1);
  }else{
    if(game.cultivateSlots.length>=4){toast('最多同时修炼4人');return}
    game.cultivateSlots.push(slot);
  }
  saveGame();renderCultivation();
}
