      v=eq;
    }else if(lk==='treasures'){
      const isComp=Array.isArray(v)&&v.some(x=>Array.isArray(x));
      if(isComp){
        const tr=[];
        for(let i=0;i<TREASURE_SLOT_COUNT;i++)tr.push(null);
        for(const it of v){if(Array.isArray(it))tr[it[0]]=genTreasure(it[1])}
        v=tr;
      }
    }
    out[lk]=v;
  }
  return out;
}
function _compressRealmProgress(rp){
  const out={};
  for(const k in rp){const v=rp[k];out[k]=[v.floor||1,v.cleared?1:0]}
  return out;
}
function _decompressRealmProgress(rp){
  const out={};
  for(const k in rp){
    const v=rp[k];
    if(Array.isArray(v))out[k]={floor:v[0]||1,cleared:!!v[1]};
    else if(v&&typeof v==='object')out[k]={floor:v.floor||1,cleared:!!v.cleared};
    else out[k]={floor:v||1,cleared:false};
  }
  return out;
}
function _compressWarehouse(wh){
  if(!wh)return wh;
  const out={...wh};
  if(Array.isArray(out.equipment))out.equipment=out.equipment.map(e=>{const qi=EQUIP_QUALITY_ORDER.indexOf(e.quality);const si=EQUIP_SLOT_ORDER.indexOf(e.slot);return[si<0?e.slot:si,qi<0?e.quality:qi,e.level||0,e.uid||'',_compressAffixes(e.affixes),e.setId||null]});
  if(Array.isArray(out.treasures))out.treasures=out.treasures.map(t=>t.tid);
  return out;
}
function _decompressWarehouse(wh){
  if(!wh)return wh;
  if(Array.isArray(wh.equipment)){
    wh.equipment=wh.equipment.map(e=>{
      if(!Array.isArray(e))return e;
      const slot=typeof e[0]==='number'?EQUIP_SLOT_ORDER[e[0]]:e[0];
      const quality=typeof e[1]==='number'?EQUIP_QUALITY_ORDER[e[1]]:e[1];
      // 新格式6元素 / 旧格式7元素
      if(e.length>=7)return _restoreEquipObj(slot,quality,e[2],e[4],e[5],e[6]);
      return _restoreEquipObj(slot,quality,e[2],e[3],e[4],e[5]);
    });
  }
  if(Array.isArray(wh.treasures)){
    wh.treasures=wh.treasures.map(t=>typeof t==='string'?genTreasure(t):t);
  }
  return wh;
}
function _serializeSave(){
  // 处理 Set → Array（endlessRun 里的 deadChars / pillUsed）
  const run=game.endlessRun;
  let runCopy=null;
  if(run){
    runCopy={
      round:run.round,
      deadChars:Array.from(run.deadChars||[]),
      charState:run.charState,
      pillUsed:Array.from(run.pillUsed||[]),
      rewards:run.rewards
    };
  }
  return JSON.stringify({
    player:_compressChar(game.player),
    disciples:game.disciples.map(_compressChar),
    teamSlots:game.teamSlots,
    cultivateSlots:game.cultivateSlots,
    recruitCandidates:(game.recruitCandidates||[]).map(_compressChar),
    battleSpeed:game.battleSpeed,
    endlessRun:runCopy,
    resources:game.resources,sect:game.sect,sectPositions:game.sectPositions,
    realmProgress:_compressRealmProgress(game.realmProgress),
    warehouse:_compressWarehouse(game.warehouse),lastSave:game.lastSave
  });
}
// ============= 存档默认值：缺失字段自动回填 =============
// 任何版本的旧存档导入时，缺失的字段都会用这里的值填充
const SAVE_DEFAULTS={
  disciples:[],
  cultivateSlots:['player'],
  recruitCandidates:[],
  teamSlots:[],
  resources:{spirit:1000,herb:10,skillPage:0},
  sect:{buildings:{cultivationHall:1,herbGarden:1,alchemyRoom:0,library:0,caveDwelling:0,grandArray:0,smithy:0}},
  warehouse:{skillBooks:{},pills:{metal:0,wood:0,water:0,fire:0,earth:0,pseudo:0},recoveryPills:{small:0,mid:0,large:0},equipment:[],treasures:[]},
  sectPositions:{leader:['player'],deputy:[],elder:[],guardian:[]},
  realmProgress:{darkForest:{floor:1,cleared:false},shallowShore:{floor:1,cleared:false},mistySwamp:{floor:1,cleared:false},karstCave:{floor:1,cleared:false},beastMountain:{floor:1,cleared:false},ancientBattle:{floor:1,cleared:false},dragonTigerCave:{floor:1,cleared:false},monkeyGarden:{floor:1,cleared:false},valleyDemons:{floor:1,cleared:false}},
  battleSpeed:1,
  endlessRun:null,
};
const PLAYER_DEFAULTS={gender:'m',portraitIdx:0,cultPoints:0,spiritRoot:'pseudo',talents:[],learnedSkills:[],equippedSkills:[],equipment:{weapon:null,helmet:null,armor:null,shoes:null},treasures:[null,null,null,null],honor:{}};
// 深度合并：target 缺失的字段从 source 取（不覆盖 target 已有的值）
function _deepFill(target,source){
  if(target===undefined||target===null)return source;
  if(typeof target!=='object'||Array.isArray(target))return target;
  for(const k in source){
    if(target[k]===undefined){
      target[k]=source[k];
    }else if(typeof source[k]==='object'&&!Array.isArray(source[k])&&source[k]!==null){
      _deepFill(target[k],source[k]);
    }
  }
  return target;
}

function _deserializeSave(json){
  const s=JSON.parse(json);
  // 解压压缩格式（兼容旧存档：旧格式解压函数会原样保留）
  s.player=_decompressChar(s.player);
  if(Array.isArray(s.disciples))s.disciples=s.disciples.map(_decompressChar);
  if(Array.isArray(s.recruitCandidates))s.recruitCandidates=s.recruitCandidates.map(_decompressChar);
  if(s.realmProgress)s.realmProgress=_decompressRealmProgress(s.realmProgress);
  if(s.warehouse)_decompressWarehouse(s.warehouse);
  // 1. 先把存档数据合并到 game（Object.assign 只合并顶层）
  Object.assign(game,s);
  // 2. 深度填充顶层缺失字段（用 SAVE_DEFAULTS）
  _deepFill(game,SAVE_DEFAULTS);
  // 3. 玩家对象缺失字段
  if(game.player){
    _deepFill(game.player,PLAYER_DEFAULTS);
    if(!Array.isArray(game.player.talents))game.player.talents=[];
    if(!Array.isArray(game.player.learnedSkills))game.player.learnedSkills=[];
    if(!Array.isArray(game.player.equippedSkills))game.player.equippedSkills=[];
    // cultPoints 必须是有效数字
    if(typeof game.player.cultPoints!=='number'||isNaN(game.player.cultPoints))game.player.cultPoints=0;
    // portraitIdx 必须是有效数字且在立绘池范围内
    const mengliPool=PORTRAIT_POOL['mengli']||[];
    if(typeof game.player.portraitIdx!=='number'||isNaN(game.player.portraitIdx)||game.player.portraitIdx<0)game.player.portraitIdx=0;
    if(mengliPool.length)game.player.portraitIdx%=mengliPool.length;
    normalizeCharEquip(game.player);
  }
  // 4. 弟子对象逐个补默认值
  if(Array.isArray(game.disciples)){
    for(const d of game.disciples){
      if(!d)continue;
      _deepFill(d,PLAYER_DEFAULTS);
      if(!Array.isArray(d.talents))d.talents=[];
      if(!Array.isArray(d.learnedSkills))d.learnedSkills=[];
      if(!Array.isArray(d.equippedSkills))d.equippedSkills=[];
      if(typeof d.cultPoints!=='number'||isNaN(d.cultPoints))d.cultPoints=0;
      normalizeCharEquip(d);
    }
  }
  // 5. 嵌套对象进一步深填
  if(game.warehouse){
    if(game.warehouse.pills)_deepFill(game.warehouse.pills,SAVE_DEFAULTS.warehouse.pills);
    if(game.warehouse.recoveryPills)_deepFill(game.warehouse.recoveryPills,SAVE_DEFAULTS.warehouse.recoveryPills);
    if(!game.warehouse.skillBooks)game.warehouse.skillBooks={};
    if(!Array.isArray(game.warehouse.equipment))game.warehouse.equipment=[];
    if(!Array.isArray(game.warehouse.treasures))game.warehouse.treasures=[];
  }
  if(game.resources)_deepFill(game.resources,SAVE_DEFAULTS.resources);
  if(game.sect&&game.sect.buildings)_deepFill(game.sect.buildings,SAVE_DEFAULTS.sect.buildings);
  if(game.sectPositions){
    for(const pos of ['leader','deputy','elder','guardian']){
      if(!Array.isArray(game.sectPositions[pos]))game.sectPositions[pos]=pos==='leader'?['player']:[];
    }
  }
  // 6. 修炼位槽校验
  game.cultivateSlots=game.cultivateSlots.filter(s=>s==='player'||game.disciples[s]).slice(0,4);
  if(!game.cultivateSlots.includes('player'))game.cultivateSlots.unshift('player');
  // 6.5 队伍槽位校验（过滤无效索引，防驱逐后旧存档残留）
  if(!Array.isArray(game.teamSlots))game.teamSlots=[];
  game.teamSlots=game.teamSlots.filter(s=>typeof s==='number'&&s>=0&&s<game.disciples.length).slice(0,5);
  // 7. 宗门职位过滤无效槽位
  const validSlots=['player',...game.disciples.map((_,i)=>i)];
  for(const pos in game.sectPositions){
    game.sectPositions[pos]=game.sectPositions[pos].filter(s=>validSlots.includes(s));
  }
  if(!game.sectPositions.leader.includes('player'))game.sectPositions.leader=['player'];
  // 8. endlessRun Set 还原
  if(game.endlessRun){
    if(Array.isArray(game.endlessRun.deadChars))game.endlessRun.deadChars=new Set(game.endlessRun.deadChars);
    else game.endlessRun.deadChars=new Set();
    if(Array.isArray(game.endlessRun.pillUsed))game.endlessRun.pillUsed=new Set(game.endlessRun.pillUsed);
    else game.endlessRun.pillUsed=new Set();
  }
  // 9. 技能回补（旧存档缺职业技能）
  const backfillQiSkills=(ch)=>{
    if(!ch||!ch.profession)return;
    const qiSkills=PROFESSION_QI_SKILLS[ch.profession]||[];
    if(!Array.isArray(ch.learnedSkills))ch.learnedSkills=getCharSkills(ch.profession).learned;
    for(const qk of qiSkills){if(!ch.learnedSkills.includes(qk))ch.learnedSkills.splice(1,0,qk)}
    if(!Array.isArray(ch.equippedSkills))ch.equippedSkills=getCharSkills(ch.profession).equipped;
  };
  backfillQiSkills(game.player);
  if(game.disciples)for(const d of game.disciples)backfillQiSkills(d);
}

function loadGame(){
  try{
    const d=localStorage.getItem('xianxia_save');if(!d)return false;
    let s=JSON.parse(d);
    // 兼容旧版双重编码存档：若解析结果为字符串则再解一次
    if(typeof s==='string'){try{s=JSON.parse(s)}catch(e){return false}}
    if(!s||typeof s!=='object')return false;
    // 解压角色数据（与 _deserializeSave 一致）
    if(s.player)s.player=_decompressChar(s.player);
    if(Array.isArray(s.disciples))s.disciples=s.disciples.map(_decompressChar);
    if(Array.isArray(s.recruitCandidates))s.recruitCandidates=s.recruitCandidates.map(_decompressChar);
    if(s.realmProgress)s.realmProgress=_decompressRealmProgress(s.realmProgress);
    if(s.warehouse)_decompressWarehouse(s.warehouse);
    Object.assign(game,s);
    // Backfill gender for old saves
    if(!game.sectPositions)game.sectPositions={leader:['player'],deputy:[],elder:[],guardian:[]};
    if(!game.warehouse)game.warehouse={skillBooks:{},pills:{metal:0,wood:0,water:0,fire:0,earth:0,pseudo:0}};
    if(!game.warehouse.skillBooks)game.warehouse.skillBooks={};
    if(!game.warehouse.pills)game.warehouse.pills={metal:0,wood:0,water:0,fire:0,earth:0,pseudo:0};
    else{for(const k of ['metal','wood','water','fire','earth','pseudo']){if(game.warehouse.pills[k]===undefined)game.warehouse.pills[k]=0}}
    if(!game.warehouse.recoveryPills)game.warehouse.recoveryPills={small:0,mid:0,large:0};
    else{for(const k of ['small','mid','large']){if(game.warehouse.recoveryPills[k]===undefined)game.warehouse.recoveryPills[k]=0}}
    // 补全仓库装备/法宝数组（旧存档可能缺失）
    if(!Array.isArray(game.warehouse.equipment))game.warehouse.equipment=[];
    if(!Array.isArray(game.warehouse.treasures))game.warehouse.treasures=[];
    // 补全建筑（旧存档可能缺少新建筑 grandArray）
    if(!game.sect)game.sect={buildings:{}};
    if(!game.sect.buildings)game.sect.buildings={};
    for(const bk in BUILDINGS){if(game.sect.buildings[bk]===undefined)game.sect.buildings[bk]=bk==='cultivationHall'||bk==='herbGarden'?1:0}
    // 清理无效职务并保证掌门存在
    const validSlots=['player',...game.disciples.map((_,i)=>i)];
    for(const pos in game.sectPositions){
      game.sectPositions[pos]=game.sectPositions[pos].filter(s=>validSlots.includes(s));
    }
    if(!game.sectPositions.leader.includes('player'))game.sectPositions.leader=['player'];
    if(!game.player.gender)game.player.gender='m';
    // 为旧弟子补全 portraitKey / portraitIdx
    if(game.disciples){for(const d of game.disciples){
      if(!d.portraitKey || !PORTRAIT_POOL[d.portraitKey]){
        // 旧存档：按灵根池优先、回退职业池推导 portraitKey
        let pk=null;
        if(d.spiritRoot && d.spiritRoot!=='pseudo'){
          const srKey='sr_'+d.spiritRoot+'_'+(d.gender||'m');
          if(PORTRAIT_POOL[srKey] && PORTRAIT_POOL[srKey].length) pk=srKey;
        }
        if(!pk) pk=(PROFESSIONS[d.profession]?.img||d.profession)+'_'+(d.gender||'m');
        d.portraitKey=pk;
      }
      const pool = PORTRAIT_POOL[d.portraitKey] || [];
      if(pool.length){if(d.portraitIdx===undefined)d.portraitIdx=rnd(pool.length);}
      else d.portraitIdx=0;
    }}
    if(game.disciples){for(const d of game.disciples){if(!d.gender)d.gender=Math.random()<.5?'m':'f';if(d.cultPoints===undefined)d.cultPoints=0}}
    // 补全荣誉字段（旧存档可能缺失）
    if(!game.player.honor||typeof game.player.honor!=='object')game.player.honor={};
    if(game.disciples){for(const d of game.disciples){if(!d.honor||typeof d.honor!=='object')d.honor={}}}
    // 补全主角 cultPoints（旧存档可能缺失）
    if(game.player&&game.player.cultPoints===undefined)game.player.cultPoints=0;
    // 补全主角 portraitIdx（旧存档可能缺失），并约束在立绘池范围内
    if(game.player){
      if(game.player.portraitIdx===undefined||typeof game.player.portraitIdx!=='number'||isNaN(game.player.portraitIdx)||game.player.portraitIdx<0)game.player.portraitIdx=0;
      const mp=PORTRAIT_POOL['mengli']||[];if(mp.length)game.player.portraitIdx%=mp.length;
    }
    // 补全角色装备/法宝结构（旧存档可能缺失），强制新建对象避免共享引用
    if(game.player)normalizeCharEquip(game.player);
    if(game.disciples){for(const d of game.disciples)normalizeCharEquip(d)}
    // Backfill talents: drop unknown ids, refill with 1-3 weighted talents, cap 3
    const sanitize=(arr)=>{if(!arr)return rollTalents(rnd(3)+1);let clean=arr.filter(t=>TALENTS[t]).slice(0,3);while(clean.length<1)clean.push(pickTalent());return clean};
    // 主角天赋修复：保证3个且至少1个稀有(罕见)以上
    const sanitizePlayer=(arr)=>{
      let clean=(arr||[]).filter(t=>TALENTS[t]).slice(0,3);
      if(!clean.some(t=>TALENTS[t].rarity>=3)){
        const rarePool=TALENT_KEYS.filter(k=>TALENTS[k].rarity>=3&&!clean.includes(k));
        if(rarePool.length)clean.push(pick(rarePool));
      }
      while(clean.length<3){let t=pickTalent(),g=20;while(clean.includes(t)&&g-->0)t=pickTalent();if(!clean.includes(t))clean.push(t);}
      return clean.slice(0,3);
    };
    game.player.talents=sanitizePlayer(game.player.talents);
    if(game.disciples){for(const d of game.disciples){d.talents=sanitize(d.talents);if(!d.spiritRoot)d.spiritRoot=randomSpiritRoot()}}
    if(!game.player.spiritRoot)game.player.spiritRoot='pseudo';
    // 补全新秘境进度
    for(const sr of SECRET_REALMS){if(!game.realmProgress[sr.id])game.realmProgress[sr.id]={floor:1,cleared:false}}
    if(game.recruitCandidates){for(const d of game.recruitCandidates){if(d&&!d.spiritRoot)d.spiritRoot=randomSpiritRoot()}}
    // Backfill skills: ensure learnedSkills/equippedSkills exist for player & disciples
    // 职业技能按大境界解锁：炼气期仅 norm，ult/扩展技能需达到对应大境界才能学会
    const sanitizeSkills=(ch)=>{
      if(!ch.profession)return;
      const def=getCharSkills(ch.profession);
      const bigRealm=ch.bigRealm||0;
      const profOrder=getProfSkillOrder(ch.profession);
      const norm=PROFESSIONS[ch.profession].norm;
      if(!Array.isArray(ch.learnedSkills)){
        // 全新角色：炼气期初始池（仅 norm + 通用技能，不含 ult/职业扩展）
        ch.learnedSkills=[...def.learned];
      }else{
        // 过滤非法技能，并强制移除境界未达标的职业技能
        ch.learnedSkills=ch.learnedSkills.filter(k=>{
          if(!SKILLS[k])return false;
          const req=getProfSkillRealm(ch.profession,k);
          if(req>=0 && req>bigRealm)return false; // 职业技能境界不够，移除
          return true;
        });
      }
      // 确保普攻 norm 常驻
      if(!ch.learnedSkills.includes(norm))ch.learnedSkills.unshift(norm);
      // 确保练气期职业技能常驻（旧存档回补）
      const qiSkills=PROFESSION_QI_SKILLS[ch.profession]||[];
      for(const qk of qiSkills){if(!ch.learnedSkills.includes(qk))ch.learnedSkills.splice(1,0,qk)}
      // equipped：排除 norm、限制数量、必须 ⊆ learned
      if(!Array.isArray(ch.equippedSkills))ch.equippedSkills=def.equipped;
      else ch.equippedSkills=ch.equippedSkills.filter(k=>SKILLS[k]&&k!==norm).slice(0,MAX_EQUIPPED);
      // 若装备栏有空位，自动装备尚未装备的练气期职业技能
      for(const qk of qiSkills){
        if(ch.equippedSkills.length<MAX_EQUIPPED && !ch.equippedSkills.includes(qk) && ch.learnedSkills.includes(qk)){
          ch.equippedSkills.push(qk);
        }
      }
      ch.equippedSkills=ch.equippedSkills.filter(k=>ch.learnedSkills.includes(k));
    };
    sanitizeSkills(game.player);
    if(game.disciples){for(const d of game.disciples){sanitizeSkills(d)}}
    // Backfill cultivate slots (ensure valid & max 4)
    if(!Array.isArray(game.cultivateSlots)||game.cultivateSlots.length===0)game.cultivateSlots=['player'];
    game.cultivateSlots=game.cultivateSlots.filter(s=>s==='player'||game.disciples[s]).slice(0,4);
    if(!game.cultivateSlots.includes('player'))game.cultivateSlots.unshift('player');
    // 队伍槽位校验（过滤无效索引，防驱逐后旧存档残留）
    if(!Array.isArray(game.teamSlots))game.teamSlots=[];
    game.teamSlots=game.teamSlots.filter(s=>typeof s==='number'&&s>=0&&s<game.disciples.length).slice(0,5);
    if(!Array.isArray(game.recruitCandidates))game.recruitCandidates=[];
    const off=Math.min((Date.now()-s.lastSave)/1000,3600*4);
    for(const slot of game.cultivateSlots){
      const ch=getCharFromSlot(slot);
      if(ch)ch.cultPoints=Math.floor(Math.min(ch.cultPoints+off*getCultSpeed(ch)*.5,cultUpgradeCost(ch)));
    }
    return true;
  }catch(e){return false}
}

//============ CHARACTER SYSTEM ============
function calcAttrs(char){
  const p=char.isMonster?char.base:PROFESSIONS[char.profession].base;
  let mods={hp:0,mp:0,atk:0,def:0,spd:0,critRate:0,critDmg:0};
  // 性别修正（人形角色）
  if(!char.isMonster){const gm=genderMods(char);for(const k in mods){mods[k]+=gm[k]}}
  if(char.talents){for(const tid of char.talents){const t=TALENTS[tid];if(!t)continue;const m=t.mods;
    if(m.allMul){mods.hp+=p.hp*m.allMul;mods.mp+=p.mp*m.allMul;mods.atk+=p.atk*m.allMul;mods.def+=p.def*m.allMul;mods.spd+=p.spd*m.allMul}
    if(m.hpMul)mods.hp+=p.hp*m.hpMul;if(m.mpMul)mods.mp+=p.mp*m.mpMul;
    if(m.atkMul)mods.atk+=p.atk*m.atkMul;if(m.defMul)mods.def+=p.def*m.defMul;
    if(m.spdMul)mods.spd+=p.spd*m.spdMul;if(m.critRateAdd)mods.critRate+=m.critRateAdd;if(m.critDmgAdd)mods.critDmg+=m.critDmgAdd;
  }}
  // 灵根加成
  if(!char.isMonster && char.spiritRoot){
    const sr=SPIRIT_ROOTS[char.spiritRoot];
    if(sr && sr.mods){const m=sr.mods;
      if(m.hpMul)mods.hp+=p.hp*m.hpMul;if(m.mpMul)mods.mp+=p.mp*m.mpMul;
      if(m.atkMul)mods.atk+=p.atk*m.atkMul;if(m.defMul)mods.def+=p.def*m.defMul;
      if(m.spdMul)mods.spd+=p.spd*m.spdMul;if(m.critRateAdd)mods.critRate+=m.critRateAdd;if(m.critDmgAdd)mods.critDmg+=m.critDmgAdd;
    }
  }
  // 宗门职务加成
  const pos=getCharPosition(char);
  if(pos){const pm=SECT_POSITIONS[pos].mods;
    if(pm.hpMul)mods.hp+=p.hp*pm.hpMul;if(pm.mpMul)mods.mp+=p.mp*pm.mpMul;
    if(pm.atkMul)mods.atk+=p.atk*pm.atkMul;if(pm.defMul)mods.def+=p.def*pm.defMul;
    if(pm.spdMul)mods.spd+=p.spd*pm.spdMul;if(pm.critRateAdd)mods.critRate+=pm.critRateAdd;if(pm.critDmgAdd)mods.critDmg+=pm.critDmgAdd;
  }
  // 荣誉加成：按通关层数阶梯小幅提升对应灵根属性（人形角色）
  if(!char.isMonster){
    const hm=getHonorMods(char);
    if(hm.hp)mods.hp+=p.hp*hm.hp;
    if(hm.mp)mods.mp+=p.mp*hm.mp;
    if(hm.atk)mods.atk+=p.atk*hm.atk;
    if(hm.def)mods.def+=p.def*hm.def;
    if(hm.spd)mods.spd+=p.spd*hm.spd;
    if(hm.critRate)mods.critRate+=hm.critRate;
    if(hm.critDmg)mods.critDmg+=hm.critDmg;
  }
  const eb={hp:p.hp+mods.hp,mp:p.mp+mods.mp,atk:p.atk+mods.atk,def:p.def+mods.def,spd:p.spd+mods.spd,critRate:p.critRate+mods.critRate,critDmg:p.critDmg+mods.critDmg};
  // 怪物境界 = 进入秘境时玩家的大境界（动态缩放）；Boss 额外 realmReq 加成（仅攻击，避免过肉）
  let ts=0,tb=0;
  ts=char.bigRealm*SMALL_PER_BIG+(char.smallRealm-1);
  tb=char.bigRealm;
  let bossAtkBonus=1;
  if(char.isMonster&&char.realmReq>0)bossAtkBonus=1+0.03*char.realmReq;
  // 境界缩放：小境界线性小幅成长，大境界台阶式成长（系数较此前大幅降低，避免跨大境界数值膨胀）
  const hpMul=1+.12*ts+1.0*tb,atkMul=(1+.08*ts+.5*tb)*bossAtkBonus,critMul=1+.2*tb;
  // 宗门大阵固定属性加成（仅人形角色，境界倍率之后叠加，不随境界缩放）
  let gaHp=0,gaAtk=0,gaDef=0;
  // 装备固定属性加成（绝对值）与法宝百分比加成
  const eqFlat={hp:0,mp:0,atk:0,def:0,spd:0,critRate:0,critDmg:0};
  const trMods={hpMul:0,mpMul:0,atkMul:0,defMul:0,spdMul:0,critRateAdd:0,critDmgAdd:0};
  if(!char.isMonster){
    const gaLvl=game.sect.buildings.grandArray||0;
    gaHp=200*gaLvl;gaAtk=50*gaLvl;gaDef=25*gaLvl;
    const es=sumEquipStats(char.equipment);
    for(const k in eqFlat)eqFlat[k]=es[k];
    const tm=sumTreasureMods(char.treasures);
    for(const k in trMods)trMods[k]=tm[k];
    // 装备套装加成（与法宝百分比加成同级叠加）
    const sb=getSetBonuses(char.equipment).mods;
    trMods.hpMul+=sb.hpMul;trMods.mpMul+=sb.mpMul;trMods.atkMul+=sb.atkMul;
    trMods.defMul+=sb.defMul;trMods.spdMul+=sb.spdMul;
    trMods.critRateAdd+=sb.critRateAdd;trMods.critDmgAdd+=sb.critDmgAdd;
  }
  return{
    hp:Math.floor((eb.hp*hpMul+gaHp+eqFlat.hp)*(1+trMods.hpMul)),
    mp:Math.floor((eb.mp*hpMul+eqFlat.mp)*(1+trMods.mpMul)),
    atk:Math.floor((eb.atk*atkMul+gaAtk+eqFlat.atk)*(1+trMods.atkMul)),
    def:Math.floor((eb.def*atkMul+gaDef+eqFlat.def)*(1+trMods.defMul)),
    spd:Math.round((eb.spd*critMul+eqFlat.spd)*(1+trMods.spdMul)*100)/100,
    critRate:Math.round((eb.critRate*critMul+trMods.critRateAdd)*100)/100,
    critDmg:Math.round((eb.critDmg*critMul+trMods.critDmgAdd)*100)/100
  };
}

function hexA(hex,a){

}

return{id:'d'+Math.random().toString(36).slice(2,9),name:genName(),profession:prof,bigRealm,smallRealm:1,talents,gender:g,portraitKey,portraitIdx,cultPoints:0,spiritRoot,learnedSkills:learned,equippedSkills:equipped,equipment:{weapon:null,helmet:null,armor:null,shoes:null},treasures:[null,null,null,null],honor:{}};

// 根据楼层大境界决定boss掉落技能书的品阶（按概率分布）
// 每个大境界对所有品阶都有概率，概率之和为1
function getBossBookGrade(bigRealm){
  // [人, 黄, 玄, 地, 天] 概率表
  // 每个大境界可掉落多个品阶，概率随境界提升向高阶平滑过渡
  const gradeTable=[
    [0.90, 0.10, 0.00, 0.00, 0.00], // 练气：人90% / 黄10%
    [0.60, 0.40, 0.00, 0.00, 0.00], // 筑基：人60% / 黄40%
    [0.10, 0.50, 0.40, 0.00, 0.00], // 金丹：人10% / 黄50% / 玄40%
    [0.00, 0.15, 0.45, 0.40, 0.00], // 元婴：黄15% / 玄45% / 地40%
    [0.00, 0.00, 0.15, 0.50, 0.35], // 化神：玄15% / 地50% / 天35%
    [0.00, 0.00, 0.00, 0.20, 0.80], // 渡劫：地20% / 天80%
    [0.00, 0.00, 0.00, 0.10, 0.90], // 飞升：地10% / 天90%
  ];
  const grades=['人','黄','玄','地','天'];
  const probs=gradeTable[Math.min(bigRealm,gradeTable.length-1)];
  const r=Math.random();
  let acc=0;
  for(let i=0;i<grades.length;i++){
    acc+=probs[i];
    if(r<acc)return grades[i];
  }
  return grades[grades.length-1];
}
// 从所有五行技能中随机挑一个指定品阶的技能书
function getRandomSkillBookByGrade(grade){
  const all=[];
  for(const elem in SPIRIT_SKILLS){
    for(const sk of SPIRIT_SKILLS[elem]){
      if(SKILLS[sk]?.grade===grade)all.push(sk);
    }
  }
  if(all.length===0){
    // 没有该品阶技能时降阶
    const order=['天','地','玄','黄','人'];
    const idx=order.indexOf(grade);
    for(let i=idx+1;i<order.length;i++){
      for(const elem in SPIRIT_SKILLS){
        for(const sk of SPIRIT_SKILLS[elem]){
          if(SKILLS[sk]?.grade===order[i])all.push(sk);
        }
      }
      if(all.length>0)break;
    }
  }
  return all.length>0?pick(all):null;
}

function getCharFromSlot(slot){

function getCultSpeed(char){
  if(!char)char=game.player;
  let s=10*(1+char.bigRealm*.5);

function cultUpgradeCost(char){
  if(!char)char=game.player;
  const b=char.bigRealm,s=char.smallRealm;
  // 小境界提升：随大境界指数增长，每大境界所需修为大幅提升
  if(s<SMALL_PER_BIG)return Math.floor(100*s*(b+1)*(b+1));
  // 大境界突破
  return Math.floor(1000*(b+1)*(b+1));
}
function canBreakthrough(char){
  if(!char)char=game.player;
  return char.bigRealm<REALMS.length-1&&char.smallRealm>=SMALL_PER_BIG;
}
function doCultivate(slot){
  const char=getCharFromSlot(slot);
  if(!char){toast('角色不存在');return}
  const cost=cultUpgradeCost(char);
  if(char.cultPoints<cost){toast('修为不足');return}
  // 大境界突破需要消耗对应灵根突破丹
  if(canBreakthrough(char)){
    const targetRealm=char.bigRealm+1;
    const pillCost=PILL_COST_PER_REALM[targetRealm]||0;
    const root=char.spiritRoot;
    const have=game.warehouse.pills[root]||0;
    if(have<pillCost){
      const pillName=BREAKTHROUGH_PILLS[root]?.name||'突破丹';
      toast(`需要${pillCost}个${pillName}（持有${have}）`);
      return;
    }
    game.warehouse.pills[root]-=pillCost;
  }
  char.cultPoints-=cost;
  let didBT=false;
  if(canBreakthrough(char)){char.bigRealm++;char.smallRealm=1;didBT=true;toast((char.name||'主角')+'突破至'+REALMS[char.bigRealm]+'!')}
  else{char.smallRealm++;toast((char.name||'主角')+'提升至'+realmStr(char))}
  saveGame();renderCultivation();
  // 突破大境界 → 弹出三选一技能学习
  if(didBT)openSkillChoice(slot);
}
function toggleCultivate(slot){
  const i=game.cultivateSlots.indexOf(slot);
  if(i>=0){
    if(slot==='player'){toast('掌门必须修炼');return}
    game.cultivateSlots.splice(i,1);
  }else{
    if(game.cultivateSlots.length>=4){toast('最多同时修炼4人');return}
    game.cultivateSlots.push(slot);
  }
  saveGame();renderCultivation();
}

        const desc=[];

            desc.push(`${chanceStr}${tgt}${cfg.name}${valStr}${durStr?` ${durStr}`:''}`);

function chooseSkill(k){
  const char=getCharFromSlot(_skillChoiceSlot);
  if(!char)return;
  // 境界防御：职业技能（含大招）必须达到对应大境界才能学习
  const req=getProfSkillRealm(char.profession,k);
  if(req>=0 && req>(char.bigRealm||0)){toast('境界不足，无法学习该技能');return}
  if(!Array.isArray(char.learnedSkills))char.learnedSkills=getCharSkills(char.profession).learned;
  if(!char.learnedSkills.includes(k))char.learnedSkills.push(k);
  // Auto-equip if not capped at 4 (norm is never equipped as a slot)
  const norm=PROFESSIONS[char.profession]?.norm;
  if(!Array.isArray(char.equippedSkills))char.equippedSkills=getCharSkills(char.profession).equipped;
  if(k!==norm && char.equippedSkills.length<MAX_EQUIPPED && !char.equippedSkills.includes(k))char.equippedSkills.push(k);
  toast((char.name||'主角')+'学会了 '+SKILLS[k]?.name);
  document.getElementById('modal').classList.remove('show');
  saveGame();
  renderCultivation();
}

//============ 战斗有效属性计算（统一从 c.statuses 读取所有状态） ============
function getEffectiveStats(c){
  let a=c.atk,d=c.def,s=c.spd,cr=c.critRate;
  if(c.statuses){
    for(const type in c.statuses){
      const st=c.statuses[type];
      if(!st||st.stacks<=0)continue;
      const cfg=STATUS_CONFIG[type];if(!cfg)continue;
      // 固定值叠加型（brave/ironwall/weak/shatter）
      if(cfg.atkFlat!==undefined)a+=cfg.atkFlat*st.stacks;
      if(cfg.defFlat!==undefined)d+=cfg.defFlat*st.stacks;
      // 每层百分比叠加型（cold/swift）
      if(cfg.spdPctPer!==undefined)s*=1+cfg.spdPctPer*st.stacks;
      // 单次百分比型（atkUp/defUp/spdUp/critUp/atkDown/spdDown，maxStacks=1，val 由技能给）
      if(cfg.atkPct!==undefined)a*=(1+(st.val||0)*st.stacks);
      if(cfg.defPct!==undefined)d*=(1+(st.val||0)*st.stacks);
      if(cfg.spdPct!==undefined)s*=(1+(st.val||0)*st.stacks);
      if(cfg.critPct!==undefined)cr+=(st.val||0)*100*st.stacks;
    }
  }
  a=Math.max(0,a);d=Math.max(0,d);s=Math.max(0.1,s);
  return{atk:a,def:d,spd:s,critRate:cr};
}
// 是否处于眩晕状态（跳过行动）
function isStunned(c){return c.statuses&&c.statuses.stun&&c.statuses.stun.stacks>0}
// 计算战斗中有效速度（CTB 累积用，包含所有速度修正）
function getEffectiveSpd(c){
  let s=c.spd;
  if(c.statuses){
    for(const type in c.statuses){
      const st=c.statuses[type];if(!st||st.stacks<=0)continue;
      const cfg=STATUS_CONFIG[type];if(!cfg)continue;
      if(cfg.spdPctPer!==undefined)s*=1+cfg.spdPctPer*st.stacks;
      if(cfg.spdPct!==undefined)s*=(1+(st.val||0)*st.stacks);
    }
  }
  return Math.max(0.1,s);
}

//============ BATTLE SYSTEM ============
class Battle{
  constructor(allies,enemies,realmId,floor,opts){
    this.allies=allies.map(c=>this.initChar(c,true));
    this.enemies=enemies.map(c=>this.initChar(c,false));
    this.all=this.allies.concat(this.enemies);
    this.log=[];
    this.stats={allyDmg:0,allyHeal:0,enemyDmg:0,enemyHeal:0};this.logExpanded=false;
    this.over=false;this.winner=null;
    this.actionDelay=0;this.dmgNums=[];this.effects=[];this.particles=[];this.actions=0;
    this.realmId=realmId;this.floor=floor;
    // 集火目标：玩家指定的优先攻击目标（仅对我方单体攻击生效）
    this.focusTarget=null;this.focusMode=false;
    this.turnCount=0;
    this.mpTickTimer=0; // 每 10 秒全员恢复 25 MP 计时器
    this.isEndless=opts&&opts.isEndless; // 百鬼夜行模式
    for(const c of this.all){
      const a=calcAttrs(c);
      c.maxHp=a.hp;c.maxMp=a.mp;c.atk=a.atk;c.def=a.def;c.spd=a.spd;c.critRate=a.critRate;c.critDmg=a.critDmg;
      c.hp=a.hp;c.mp=a.mp;c.alive=true;c.ctb=0;c.cd={};c.statuses=emptyStatuses();c.anim={type:'idle',t:0};
      c.dmgDealt=0;c.healDone=0;
      // 无尽模式：从 charState 恢复 HP/MP（上一轮结算后的状态）
      if(this.isEndless&&c.isAlly&&c.endlessId){
        const st=game.endlessRun.charState[c.endlessId];
        if(st){c.hp=Math.min(c.maxHp,st.hp);c.mp=Math.min(c.maxMp,st.mp)}
      }
    }
    this.addLog('战斗开始!');
  }
  initChar(c,isAlly){
    const ch={...c,isAlly,portraitIdx:c.portraitIdx||0};
    if(c.isMonster){
      // 统一使用 getMonsterSkillKeys 获取怪物技能（与百科同源）
      const allKeys=getMonsterSkillKeys(c);
      ch.skillKeys=allKeys.filter(k=>SKILLS[k]&&k!==c.monsterSkill);
      ch.normKey=c.monsterSkill;
    }else{
      // Human: profession norm is always available; equipped skills fill the 4 battle slots
      ch.skillKeys=[];
      ch.normKey=PROFESSIONS[c.profession].norm;
      const eq=Array.isArray(c.equippedSkills)?c.equippedSkills:getCharSkills(c.profession).equipped;
      for(const sk of eq)if(SKILLS[sk]&&sk!==ch.normKey)ch.skillKeys.push(sk);
      // 无尽模式：保留 endlessId 用于阵亡追踪
      if(c.endlessId)ch.endlessId=c.endlessId;
    }
    return ch;
  }
  update(dt){
    if(this.over)return;
    const spd=game.battleSpeed||1;
    if(this.actionDelay>0){this.actionDelay-=dt*spd;this.updateAnims(dt);return}
    // 每 10 秒所有存活角色恢复 25 法力（战斗续航）
    this.mpTickTimer+=dt*spd;
    if(this.mpTickTimer>=10){
      this.mpTickTimer-=10;
      for(const c of this.all){
        if(!c.alive||c.maxMp<=0)continue;
        const before=c.mp;
        c.mp=Math.min(c.maxMp,c.mp+25);
        const gained=c.mp-before;
        if(gained>0)this.dmgNums.push({char:c,val:gained,type:'mpHeal',t:1});
      }
      this.addLog('灵气涌动，全队恢复25法力');
    }
    // Fill all CTB gauges + tick status DoTs
    for(const c of this.all){
      if(!c.alive)continue;
      // 有效速度：统一从 c.statuses 读取所有速度修正
      const effSpd=getEffectiveSpd(c);
      c.ctb+=effSpd*dt*5*spd;
      // Tick 所有时间制状态
      for(const type in c.statuses){this.tickStatus(c,type,dt)}
    }
    // Check if DoT killed everyone
    this.checkEnd();
    if(this.over)return;
    // Find ready characters, fastest first
    const ready=this.all.filter(c=>c.alive&&c.ctb>=100).sort((a,b)=>b.ctb-a.ctb);
    if(ready.length>0){
      const c=ready[0];c.ctb=0;
      this.execute(c);this.checkEnd();
      this.actionDelay=.3;
    }
    this.updateAnims(dt);
  }
  updateAnims(dt){for(const c of this.all){c.anim.t-=dt*2;if(c.anim.t<=0&&c.anim.type!=='die'){c.anim.type='idle';c.anim.t=0}}}

  // 时间制状态结算：统一遍历，hpDmg/hpHeal/mpHeal 由 cfg.tickInterval 触发，其他状态仅倒计持续时间
  tickStatus(c,type,dt){
    const st=c.statuses?c.statuses[type]:null;
    if(!st||st.stacks<=0)return;
    const cfg=STATUS_CONFIG[type];if(!cfg)return;
    st.durAcc-=dt;
    if(st.durAcc<=0){st.stacks=0;st.tickAcc=0;st.val=0;return}
    if(cfg.tickInterval)st.tickAcc+=dt;
    if(cfg.tickInterval&&st.tickAcc>=cfg.tickInterval){
      st.tickAcc-=cfg.tickInterval;
      // 愈合：恢复生命
      if(cfg.hpHeal){
        const hpHeal=cfg.hpHeal*st.stacks;
        c.hp=Math.min(c.maxHp,c.hp+hpHeal);
        c.healDone=(c.healDone||0)+hpHeal;
        if(c.isAlly)this.stats.allyHeal+=hpHeal;else this.stats.enemyHeal+=hpHeal;
        this.addLog(getCharName(c)+'受到'+cfg.name+'效果，恢复'+hpHeal+'点生命');
        this.dmgNums.push({char:c,val:hpHeal,type:'heal',t:1});
        this.effects.push({type:'heal',char:c,color:cfg.color,t:1});
      }
      // 调息：恢复法力
      if(cfg.mpHeal){
        const mpHeal=cfg.mpHeal*st.stacks;
        c.mp=Math.min(c.maxMp,c.mp+mpHeal);
        this.addLog(getCharName(c)+'受到'+cfg.name+'效果，恢复'+mpHeal+'点法力');
        this.dmgNums.push({char:c,val:mpHeal,type:'mpHeal',t:1});
      }
      // 伤害型状态（中毒/燃烧）
      if(cfg.hpDmg){
        const hpDmg=cfg.hpDmg*st.stacks;
        c.hp=Math.max(0,c.hp-hpDmg);
        this.addLog(getCharName(c)+'受到'+cfg.name+'侵蚀，损失'+hpDmg+'点生命');
        this.dmgNums.push({char:c,val:hpDmg,type:'dot',color:cfg.dmgColor||cfg.color,t:1});
        if(type==='poison'&&cfg.mpDmg){
          const mpDmg=cfg.mpDmg*st.stacks;c.mp=Math.max(0,c.mp-mpDmg);
          this.addLog(getCharName(c)+'中毒侵蚀法力，损失'+mpDmg+'点法力');
          this.dmgNums.push({char:c,val:mpDmg,type:'dot',color:'#3b82f6',t:1});
        }
        if(st.source&&st.source.alive){st.source.dmgDealt+=hpDmg;if(st.source.isAlly)this.stats.allyDmg+=hpDmg;else this.stats.enemyDmg+=hpDmg}
        else{if(c.isAlly)this.stats.enemyDmg+=hpDmg;else this.stats.allyDmg+=hpDmg}
        if(c.hp<=0){c.alive=false;c.anim={type:'die',t:1};this.spawnDeathBurst(c);this.addLog(getCharName(c)+'被'+cfg.name+'侵蚀倒下!')}
      }
    }
  }
  // 统一施加状态：duration 必须由技能指定；val/stacks 可选（百分比型由技能 val 提供具体数值）
  applyStatus(c,type,duration,source,val,stacks){
    if(!c.statuses)c.statuses=emptyStatuses();
    const st=c.statuses[type];
    const cfg=STATUS_CONFIG[type];if(!cfg)return;
    if(!(duration>0))return; // 持续时间必须由技能指定
    const newStacks=stacks||1;
    if(st.stacks<cfg.maxStacks)st.stacks=Math.min(cfg.maxStacks,st.stacks+newStacks);
    st.durAcc=duration;
    if(cfg.tickInterval&&st.tickAcc>cfg.tickInterval)st.tickAcc=0;
    if(val!==undefined)st.val=val; // 百分比型状态记录技能提供的具体数值
    if(source)st.source=source;
    this.addLog(getCharName(c)+(cfg.positive?'获得':'陷入')+cfg.name+(cfg.maxStacks>1?('('+st.stacks+'层)'):'')+'!')
  }
  // 驱散：清除目标1种随机负面状态的全部层数，返回被驱散的状态类型(无则null)
  dispelNegative(c){
    if(!c.statuses)return null;
    const negs=['poison','burn','cold','weak','shatter','atkDown','spdDown','stun'];
    const active=negs.filter(t=>c.statuses[t]&&c.statuses[t].stacks>0);
    if(active.length===0)return null;
    const pick=active[Math.floor(Math.random()*active.length)];
    const st=c.statuses[pick];
    st.stacks=0;st.tickAcc=0;st.durAcc=0;st.val=0;st.source=null;
    return pick;
  }
  execute(c){
    this.actions++;
    const enemies=c.isAlly?this.enemies:this.allies;
    const allies=c.isAlly?this.allies:this.enemies;
    const alive=enemies.filter(e=>e.alive);
    if(alive.length===0)return;
    // ---- Stun check（统一走 c.statuses.stun）----
    if(isStunned(c)){
      // 眩晕只跳过行动，CD 仍正常递减
      for(const k in c.cd)if(c.cd[k]>0)c.cd[k]--;
      this.addLog(`${getCharName(c)}被控制，跳过行动`);
      c.statuses.stun.stacks=0;c.statuses.stun.durAcc=0;
      return;
    }
    // ---- Get effective stats (apply buffs + statuses) ----
    const es=getEffectiveStats(c);
    const atk=es.atk,def=es.def,spd=es.spd,critRate=es.critRate;
    const getEff=t=>getEffectiveStats(t);
    // 候选技能 = 装备技能（按优先级顺序）+ 普攻兜底
    // c.skillKeys 即为 equippedSkills，数组顺序 = 优先级 1>2>3>4
    // 按优先级从高到低遍历，第一个满足法力和冷却条件的技能即被选用
    // 普攻(mpCost:0,cd:0)永远满足条件，故永远不会卡死
    let pickedKey=null,sk=null;
    for(const skk of (c.skillKeys||[])){
      const s=SKILLS[skk];
      if(s&&c.mp>=s.mpCost&&(c.cd[skk]||0)<=0){pickedKey=skk;sk=s;break}
    }
    // 装备技能全部不可用（MP不足/CD中）时，回退普攻
    if(!sk){pickedKey=c.normKey;sk=SKILLS[c.normKey]}
    // 消耗法力与设置冷却
    c.mp-=sk.mpCost;c.cd[pickedKey]=sk.cd;
    c.anim={type:'attack',t:1};
    // ---- MP Restore self ----
    if(sk.mpRestoreSelf){c.mp=Math.min(c.maxMp,c.mp+sk.mpRestoreSelf);this.addLog(`${getCharName(c)}恢复${sk.mpRestoreSelf}法力`)}
    // Target selection
    let targets=[];
    if(sk.dmg){
      if(sk.target==='all'){targets=alive}
      else if(sk.target==='randomN'){
        const n=Math.min(sk.randomCount||2,alive.length);
        const pool=[...alive];
        for(let i=0;i<n;i++){const idx=Math.floor(Math.random()*pool.length);targets.push(pool.splice(idx,1)[0])}
      }
      else{
        // 我方单体攻击：优先打集火目标（若存活），否则默认最低血量百分比
        if(c.isAlly&&this.focusTarget&&this.focusTarget.alive&&alive.includes(this.focusTarget)){
          targets=[this.focusTarget];
        }else{
          targets=[alive.reduce((m,e)=>e.hp/e.maxHp<m.hp/m.maxHp?m:e)];
        }
      }
    }
    // ---- 施加 self/team 类型的状态（伤害前生效，让本次伤害可享受增益）----
    if(sk.statuses){
      for(const st of sk.statuses){
        if(st.target==='self'){this.applyStatus(c,st.type,st.dur,c,st.val,st.stacks)}
        else if(st.target==='team'){for(const a of allies.filter(x=>x.alive))this.applyStatus(a,st.type,st.dur,c,st.val,st.stacks)}
      }
    }
    // Damage (with multi-hit)
    const hits=sk.hits||1;
    // 攻击属性：技能五行前缀优先，否则回退到攻击者灵根（怪物技能无五行前缀时使用其灵根）
    const atkElem=getSkillElem(pickedKey)||(ELEM_SET.has(c.spiritRoot)?c.spiritRoot:null);
    // 字幕/光束颜色：技能五行优先，否则使用攻击者灵根色（与灵根颜色统一）
    const atkColor=atkElem?SPIRIT_ROOTS[atkElem].color:getSpiritColor(c);
    const ecfg=getSkillEffectCfg(pickedKey,c);
    // AOE 技能：施法者处生成蓄力/施法特效（每次施法一次，让玩家看出是谁放的群攻）
    if(sk.target==='all'||sk.target==='randomN'){
      this.effects.push({type:'skillCast',char:c,color:atkColor,variant:ecfg.variant,count:ecfg.particleCount,sizeMul:ecfg.sizeMul,grade:ecfg.grade,t:2.0,t0:2.0});
    }
    for(let h=0;h<hits;h++){
      for(const t of targets){
        if(!t.alive)continue;
        const teff=getEff(t);
        const crit=Math.random()*100<critRate;
        let dmg=atk*sk.dmg*(crit?c.critDmg/100:1);
        dmg*=Math.max(.3,1-teff.def/(teff.def+200));
        dmg=Math.floor(dmg*(.9+Math.random()*.2));
        // 五行克制
        const emul=elemCounterMul(atkElem,t.spiritRoot);
        let elemNote='';
        if(emul>1){dmg=Math.floor(dmg*emul);elemNote='(克制!)'}
        else if(emul<1){dmg=Math.floor(dmg*emul);elemNote='(被克制)'}
        t.hp=Math.max(0,t.hp-dmg);
        c.dmgDealt+=dmg;if(c.isAlly)this.stats.allyDmg+=dmg;else this.stats.enemyDmg+=dmg;
        this.dmgNums.push({char:t,val:dmg,type:'dmg',t:1,crit,color:atkColor});
        t.anim={type:'hit',t:1,crit};
        // 技能特效：单体→弹道+命中爆裂；群体→目标处范围爆发
        if(sk.target==='all'||sk.target==='randomN'){
          this.effects.push({type:'skillBurst',char:t,color:ecfg.color,variant:ecfg.variant,count:ecfg.particleCount,sizeMul:ecfg.sizeMul,grade:ecfg.grade,t:1});
        }else{
          this.effects.push({type:'skillShot',from:c,to:t,color:ecfg.color,variant:ecfg.variant,count:ecfg.particleCount,sizeMul:ecfg.sizeMul,grade:ecfg.grade,t:1});
        }
        this.addLog(`${getCharName(c)}使用${sk.name}${hits>1?'('+(h+1)+'/'+hits+')':''}${crit?'(暴击!)':''}${elemNote}对${getCharName(t)}造成${dmg}伤害`);
        if(sk.lifesteal){const heal=Math.floor(dmg*sk.lifesteal);c.hp=Math.min(c.maxHp,c.hp+heal);c.healDone+=heal;if(c.isAlly)this.stats.allyHeal+=heal;else this.stats.enemyHeal+=heal;this.dmgNums.push({char:c,val:heal,type:'heal',t:1})}
        // ---- 反伤：目标有反伤状态时，将部分伤害反弹给攻击者 ----
        if(t.statuses&&t.statuses.reflect&&t.statuses.reflect.stacks>0){
          const rfCfg=STATUS_CONFIG.reflect;
          const rfPct=t.statuses.reflect.val||0;
          if(rfPct>0){
            const rfDmg=Math.floor(dmg*rfPct);
            c.hp=Math.max(0,c.hp-rfDmg);
            c.dmgDealt+=0;
            if(c.isAlly)this.stats.enemyDmg+=rfDmg;else this.stats.allyDmg+=rfDmg;
            this.dmgNums.push({char:c,val:rfDmg,type:'dmg',t:1,color:rfCfg.color});
            this.addLog(`${getCharName(t)}反弹${rfDmg}伤害给${getCharName(c)}!`);
            if(c.hp<=0){c.alive=false;c.anim={type:'die',t:1};this.spawnDeathBurst(c);this.addLog(`${getCharName(c)}被反伤击败!`)}
          }
        }
        if(t.hp<=0){t.alive=false;t.anim={type:'die',t:1};this.spawnDeathBurst(t);this.addLog(`${getCharName(t)}被击败!`);
          // 集火目标被击败，自动清除并提示
          if(this.focusTarget===t){
            this.focusTarget=null;
            const btn=document.getElementById('focus-btn');
            if(btn){btn.classList.remove('active');btn.style.background='';btn.style.color='';btn.textContent='🎯 集火'}
            this.addLog('集火目标已被击败');
          }
        }
        // ---- 施加 hit 类型的状态（伤害命中后）----
        if(sk.statuses){
          for(const st of sk.statuses){
            if(st.target!=='hit')continue;
            if(st.chance!==undefined&&Math.random()>st.chance)continue;
            this.applyStatus(t,st.type,st.dur,c,st.val,st.stacks);
          }
        }
      }
    }
    // Heal
    if(sk.heal){
      let healTargets;
      if(sk.healTarget==='all'){healTargets=allies.filter(a=>a.alive)}
      else{healTargets=[allies.filter(a=>a.alive).reduce((m,a)=>a.hp/a.maxHp<m.hp/m.maxHp?m:a)]}
      // 木系治疗以施法者生命上限为基准；其他治疗仍以攻击力为基准
      const healBase=(sk.elem==='wood')?c.maxHp:atk;
      for(const t of healTargets){const h=Math.floor(healBase*sk.heal);t.hp=Math.min(t.maxHp,t.hp+h);c.healDone+=h;if(c.isAlly)this.stats.allyHeal+=h;else this.stats.enemyHeal+=h;this.dmgNums.push({char:t,val:h,type:'heal',t:1});this.effects.push({type:'heal',char:t,color:'#4ade80',variant:'heal',t:1});this.addLog(`${getCharName(t)}恢复${h}生命`)}
      // 驱散：高阶治疗技能附带，清除每位治疗目标1种随机负面状态的全部层数
      if(sk.dispel){
        for(const t of healTargets){
          const d=this.dispelNegative(t);
          if(d)this.addLog(`${getCharName(t)}的${STATUS_CONFIG[d].name}被驱散!`)
        }
      }
    }
    // Team MP restore
    if(sk.teamMpRestore){for(const a of allies.filter(x=>x.alive)){a.mp=Math.min(a.maxMp,a.mp+sk.teamMpRestore)}this.addLog(`我方全队恢复${sk.teamMpRestore}法力!`)}
    // Reduce CDs
    for(const k in c.cd)if(c.cd[k]>0)c.cd[k]--;
    this.turnCount++;
  }
  checkEnd(){
    const a=this.allies.some(c=>c.alive),e=this.enemies.some(c=>c.alive);
    if(!a||!e){this.over=true;this.winner=a?'allies':'enemies';this.onEnd()}
  }
  onEnd(){

    if(btn){btn.classList.remove('active');btn.style.background='';btn.style.color='';btn.textContent='🎯 集火'}
    const win=this.winner==='allies';

      let rewardInfo='';

          }
          // 3. 即时发放奖励

          // 宝箱怪赏金：击杀宝箱怪额外获得 100 灵石
          const hasChestMimic=this.enemies.some(e=>e.mdef.monsterId==='chestMimic');
          let chestRewardInfo='';
          if(hasChestMimic){
            game.resources.spirit+=100;
            run.rewards.spirit+=100;

          }
          // 荣誉：无尽模式 BOSS 轮通关，出战角色获得荣誉（取最高轮数）
          if(isBossRound){
            for(const c of this.allies){
              let target=null;
              if(c.isPlayer||c.endlessId==='player')target=game.player;
              else if(c.endlessId!==undefined)target=game.disciples[c.endlessId];
              if(target){target.honor=target.honor||{};target.honor['endless']=Math.max(target.honor['endless']||0,run.round);}
            }
          }
          let pillDropInfo='';

          // 每10层（BOSS层）掉落五行技能书（品阶按玩家大境界概率分布，优先匹配队伍可学灵根）

            }

            if(tr){

              trDropInfo=`<div class="result-row"><span style="color:${EQUIP_QUALITY[td.quality].color}">${td.name}${qualityTag(td.quality)} 法宝</span><span style="color:var(--jade)">+1</span></div>`;
            }
          }
          rewardInfo=`<div class="result-row"><span>第 ${run.round} 轮 ${isBossRound?'(BOSS战)':''}</span><span style="color:var(--gold)">胜利</span></div>
            <div class="result-row"><span>💎 灵石</span><span style="color:var(--jade)">+${spirit}</span></div>
            ${chestRewardInfo}
            <div class="result-row"><span>🌿 灵草</span><span style="color:var(--jade)">+${herb}</span></div>
            <div class="result-row"><span>📜 技能页</span><span style="color:var(--jade)">+${skillPage}</span></div>
            ${pillDropInfo}
            ${bookDropInfo}
            ${trDropInfo}
            <div style="font-size:11px;color:var(--dim);margin-top:6px">阵亡角色：${run.deadChars.size} 人</div>`;
          // 4. 判断是否全灭

          btn.textContent='继续';btn.onclick=()=>{
            exitBattle();
            // Boss胜利后25%概率触发访客，普通关卡胜利后10%概率

              const rid=this.realmId, nxt=this.floor+1;
              _visitorReturn=()=>enterRealmFloor(rid,nxt);
              showVisitor();
            }else{
              enterRealmFloor(this.realmId,this.floor+1);
            }
          };
          // 添加返回宗门按钮
          const bar=document.getElementById('result-btn-bar');
          let backBtn=document.getElementById('result-back-btn');

          backBtn.onclick=()=>{exitBattle();showScreen('hub')};
        }else{
          const loss=Math.floor(game.resources.spirit*.1);
          game.resources.spirit-=loss;
          rewardInfo=`<div class="result-row"><span>💎 灵石损失</span><span style="color:var(--red)">-${loss}</span></div>`;

          if(backBtn2)backBtn2.style.display='none';
        }
      }
      // 标签页
      const tabs=[{id:'summary',name:'概览'},{id:'stats',name:'战报'},{id:'chars',name:'角色'}];

      tabsEl.querySelectorAll('.result-tab').forEach(b=>{
        b.onclick=()=>{
          tabsEl.querySelectorAll('.result-tab').forEach(x=>x.classList.remove('active'));
          b.classList.add('active');
          battle.renderResultTab(b.dataset.rtab,contentEl,rewardInfo);
        };
      });
      battle.renderResultTab('summary',contentEl,rewardInfo);
      saveGame();
      el.classList.add('show');
    },800);
  }

          <span style="color:#f87171;font-size:11px;width:40px;text-align:right;flex-shrink:0">${dmg}</span>

  }
  addLog(msg){this.log.push(msg);if(this.log.length>80)this.log.shift();this.renderLog();this.renderStats()}
  // 生成粒子：在 (x,y) 处向外散射 count 个粒子
  spawnParticles(x,y,count,color,opts={}){
    const speed=opts.speed||3;
    const life=opts.life||0.8;
    const size=(opts.size||3)*(opts.sizeMul||1);
    const shape=opts.shape||'circle';
    const gravity=opts.gravity||0;
    for(let i=0;i<count;i++){
      const ang=Math.random()*Math.PI*2;
      const sp=speed*(0.4+Math.random()*0.9);
      this.particles.push({
        x,y,
        vx:Math.cos(ang)*sp,
        vy:Math.sin(ang)*sp,
        life,maxLife:life,
        color,size:size*(0.6+Math.random()*0.8),
        shape,gravity,
        rot:Math.random()*Math.PI*2,
        vrot:(Math.random()-0.5)*0.3
      });
    }
  }
  // 角色死亡爆发：灵根色粒子 + 冲击波环
  spawnDeathBurst(c){
    if(!c)return;
    const root=SPIRIT_ROOTS[c.spiritRoot];
    const color=root?root.color:'#f87171';
    const variant={metal:'blade',wood:'leaf',water:'ice',fire:'flame',earth:'rock',pseudo:'orb'}[c.spiritRoot]||'orb';
    const x=c._x||0,y=c._y||0;
    // 径向迸发粒子
    this.spawnParticles(x,y+8,34,color,{speed:6,life:1.3,size:6,shape:variant});
    // 白色核心闪光粒子
    this.spawnParticles(x,y+8,14,'#ffffff',{speed:4,life:.7,size:3.5,shape:'orb'});
    // 冲击波环特效
    this.effects.push({type:'deathBurst',x,y,color,t:1.4,t0:1.4});
  }
  renderLog(){const el=document.getElementById('battle-log');if(!el)return;const lines=this.logExpanded?this.log:this.log.slice(-4);el.innerHTML=lines.map(l=>`<div class="log-line">${l}</div>`).join('')+(this.logExpanded?'':'<div class="log-hint">点击查看全部</div>');el.onclick=()=>this.toggleLog()}
  renderStats(){
    const el=document.getElementById('battle-stats');if(!el)return;
    el.style.cursor='pointer';
    const summary=`<div style="display:flex;gap:14px;align-items:center;width:100%"><span style="color:#f87171">伤害 ${this.stats.allyDmg}</span><span style="color:#4ade80">治疗 ${this.stats.allyHeal}</span><span style="color:var(--dim);font-size:9px;margin-left:auto">${this.statsExpanded?'点击收起':'点击查看明细'}</span></div>`;

    el.onclick=()=>this.toggleStats();

  toggleStats(){
    this.statsExpanded=!this.statsExpanded;
    const el=document.getElementById('battle-stats');
    if(el)el.classList.toggle('expanded',this.statsExpanded);

  }
  renderStatsDetail(){
    const el=document.getElementById('battle-stats');if(!el)return '';
    const rows=[];
    const maxDmg=Math.max(1,...this.allies.map(c=>c.dmgDealt||0),...this.enemies.map(c=>c.dmgDealt||0));
    const fmtChar=(c)=>{
      const dmgPct=Math.round((c.dmgDealt||0)/maxDmg*100);
      const name=getCharName(c);
      return `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)">
        <span style="width:54px;flex-shrink:0;font-size:11px;color:${c.isAlly?'#7dd3fc':'#fca5a5'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</span>
        <span style="color:#f87171;font-size:10px;width:42px;text-align:right">${c.dmgDealt||0}</span>
        <div style="flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden"><div style="width:${dmgPct}%;height:100%;background:#f87171;border-radius:3px"></div></div>
        <span style="color:#4ade80;font-size:10px;width:42px;text-align:right">${c.healDone||0}</span>
      </div>`;
    };
    rows.push(`<div style="font-size:10px;color:var(--dim);padding:2px 0">我方</div>`);
    for(const c of this.allies)rows.push(fmtChar(c));
