  toggleLog(){this.logExpanded=!this.logExpanded;const el=document.getElementById('battle-log');if(el)el.classList.toggle('expanded',this.logExpanded);this.renderLog()}
  getTimeline(){
    return this.all.filter(c=>c.alive).sort((a,b)=>b.ctb-a.ctb).slice(0,8);
  }
  render(ctx,W,H){
    ctx.clearRect(0,0,W,H);
    // Background - drawn canvas
    drawBgPortrait(ctx,0,0,W,H,this.realmId);
    // Detect orientation
    const isPortrait=H>W;
    if(isPortrait){
      // Portrait: allies bottom, enemies top, stacked vertically, 3x3 each side
      const slotW=Math.min(W*.22,80),slotH=slotW*1.3;
      this._slotW=slotW;this._slotH=slotH;
      const gap=12;
      const totalCols=3;
      const enemiesStartY=H*.15;
      const alliesStartY=H*.55;
      const leftStart=(W-slotW*totalCols-gap*(totalCols-1))/2;
      // Enemies (top)
      for(let i=0;i<this.enemies.length;i++){
        const c=this.enemies[i];if(!c.alive&&c.anim.type!=='die')continue;
        const col=i%totalCols,row=Math.floor(i/totalCols);
        const x=leftStart+col*(slotW+gap);
        const y=enemiesStartY+row*(slotH+gap);
        c._x=x+slotW/2;c._y=y+slotH/2;
        this.drawChar(ctx,c,x,y,slotW,slotH);
      }
      // Allies (bottom)
      for(let i=0;i<this.allies.length;i++){
        const c=this.allies[i];if(!c.alive&&c.anim.type!=='die')continue;
        const col=i%totalCols,row=Math.floor(i/totalCols);
        const x=leftStart+col*(slotW+gap);
        const y=alliesStartY+row*(slotH+gap);
        c._x=x+slotW/2;c._y=y+slotH/2;
        this.drawChar(ctx,c,x,y,slotW,slotH);
      }
    }else{
      // Landscape: allies left, enemies right
      const slotW=Math.min(W*.12,90),slotH=slotW*1.5;
      this._slotW=slotW;this._slotH=slotH;
      const gap=14;
      const leftStart=W*.05,rightStart=W*.95-slotW*3-gap*2;
      const startY=H*.2,rowH=slotH+gap;
      for(let side=0;side<2;side++){
        const team=side===0?this.allies:this.enemies;
        for(let i=0;i<team.length;i++){
          const c=team[i];if(!c.alive&&c.anim.type!=='die')continue;
          const col=i%3,row=Math.floor(i/3);
          const x=(side===0?leftStart:rightStart)+col*(slotW+gap);
          const y=startY+row*rowH;
          c._x=x+slotW/2;c._y=y+slotH/2;
          this.drawChar(ctx,c,x,y,slotW,slotH);
        }
      }
    }
    // 集火目标标记：在目标头顶画红色十字准星 + 脉冲圈
    if(this.focusTarget&&this.focusTarget.alive){
      const ft=this.focusTarget;
      const fx=ft._x||0,fy=(ft._y||0)-62;
      const pulse=0.5+0.5*Math.sin(performance.now()/200);
      ctx.save();
      // 外圈脉冲
      ctx.globalAlpha=.3+pulse*.4;ctx.strokeStyle='#ff3b3b';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(fx,fy,14+pulse*4,0,Math.PI*2);ctx.stroke();
      // 准星十字
      ctx.globalAlpha=.95;ctx.strokeStyle='#ff3b3b';ctx.lineWidth=2.5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(fx-10,fy);ctx.lineTo(fx-3,fy);ctx.moveTo(fx+3,fy);ctx.lineTo(fx+10,fy);
      ctx.moveTo(fx,fy-10);ctx.lineTo(fx,fy-3);ctx.moveTo(fx,fy+3);ctx.lineTo(fx,fy+10);ctx.stroke();
      // 中心点
      ctx.fillStyle='#ff3b3b';ctx.beginPath();ctx.arc(fx,fy,1.8,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    // Effects (skill projectiles + bursts + heals)
    for(let i=this.effects.length-1;i>=0;i--){
      const e=this.effects[i];e.t-=.03;
      if(e.t<=0){this.effects.splice(i,1);continue}
      const alpha=Math.min(1,e.t*1.5);
      if(e.type==='skillShot'&&e.from&&e.to){
        const fx=e.from._x||0,fy=e.from._y||0,tx=e.to._x||0,ty=e.to._y||0;
        const prog=1-e.t; // 0→1 travel
        const px=fx+(tx-fx)*prog,py=fy+(ty-fy)*prog;
        const sz=6*(e.sizeMul||1);
        ctx.save();
        // 拖尾光束
        ctx.globalAlpha=alpha*.6;
        ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.lineCap='round';
        ctx.shadowColor=e.color;ctx.shadowBlur=14;
        ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(px,py);ctx.stroke();
        // 弹道核心亮线
        ctx.globalAlpha=alpha*.9;ctx.strokeStyle='#fff';ctx.lineWidth=1.2;
        ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(px,py);ctx.stroke();
        // 弹道头部：按 variant 绘制不同形状
        ctx.globalAlpha=alpha;ctx.shadowBlur=16;ctx.shadowColor=e.color;
        const ang=Math.atan2(ty-fy,tx-fx);
        drawVariantShape(ctx,e.variant,px,py,sz,e.color,ang,1);
        // 拖尾粒子
        if(Math.random()<.6){
          this.particles.push({x:px,y:py,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5,
            life:.4,maxLife:.4,color:e.color,size:sz*.4,shape:e.variant,gravity:0,
            rot:Math.random()*6.28,vrot:(Math.random()-.5)*.3});
        }
        ctx.restore();
        // 命中时在目标处迸发粒子
        if(prog>=.95&&!e.burstDone){
          e.burstDone=true;
          this.spawnParticles(tx,ty,Math.max(4,Math.floor(e.count*.6)),e.color,
            {speed:3.5,life:.7,size:sz*.7,shape:e.variant,sizeMul:e.sizeMul||1});
        }
      }else if(e.type==='skillCast'&&e.char){
        // AOE 施法者特效：脚下扩散环 + 上升能量柱 + 向上升腾的粒子
        const cx=e.char._x||0,cy=e.char._y||0;
        const prog=1-e.t/(e.t0||2.0); // 0→1
        const sz=(e.sizeMul||1)*1.1;
        ctx.save();
        // 1) 脚下扩散环（多层，地面椭圆）
        for(let k=0;k<3;k++){
          const ph=(prog*1.4+k/3)%1;
          const r=ph*62*sz;
          const a=(1-ph)*alpha*.9;
          if(r<2)continue;
          ctx.globalAlpha=a;
          ctx.strokeStyle=e.color;ctx.lineWidth=2.6-k*0.4;
          ctx.shadowColor=e.color;ctx.shadowBlur=18;
          ctx.beginPath();ctx.ellipse(cx,cy+14,r,r*0.4,0,0,Math.PI*2);ctx.stroke();
        }
        // 2) 上升能量柱（竖向光柱，从脚下往上，更宽更亮）
        const colH=78*sz;
        const colGrad=ctx.createLinearGradient(cx,cy+14,cx,cy+14-colH);
        colGrad.addColorStop(0,`rgba(255,255,255,${alpha*.9})`);
        colGrad.addColorStop(.35,hexA(e.color,alpha*.85));
        colGrad.addColorStop(1,'rgba(255,255,255,0)');
        ctx.globalAlpha=alpha;
        ctx.fillStyle=colGrad;ctx.shadowColor=e.color;ctx.shadowBlur=24;
        ctx.beginPath();
        const cw=11*sz*(.5+prog*.9);
        ctx.moveTo(cx-cw,cy+14);ctx.lineTo(cx+cw,cy+14);
        ctx.lineTo(cx+cw*.35,cy+14-colH);ctx.lineTo(cx-cw*.35,cy+14-colH);
        ctx.closePath();ctx.fill();
        // 3) 核心白光点（沿柱上升）
        ctx.globalAlpha=alpha*(1-prog*.2);
        ctx.fillStyle='#fff';ctx.shadowBlur=16;
        ctx.beginPath();ctx.arc(cx,cy+14-colH*(.25+prog*.5),4.5*sz,0,Math.PI*2);ctx.fill();
        ctx.restore();
        // 4) 持续向上升腾的粒子（施法者周围）
        if(e.t>0.6&&Math.random()<.9){
          this.spawnParticles(cx+(Math.random()-.5)*28,cy+10,Math.ceil(e.count*.3),e.color,
            {speed:2.4,life:.8,size:3.5*sz,shape:e.variant,sizeMul:sz});
          const lastN=Math.min(4,this.particles.length);
          for(let i=0;i<lastN;i++){
            const p=this.particles[this.particles.length-1-i];
            if(p){p.vy=-Math.abs(p.vy)-1.6;p.vx*=.35}
          }
        }
      }else if(e.type==='skillBurst'&&e.char){
        const cx=e.char._x||0,cy=e.char._y||0;
        const prog=1-e.t;
        const sz=(e.sizeMul||1);
        ctx.save();
        // 多层扩散环
        for(let k=0;k<3;k++){
          const ph=(prog*1.3+k/3)%1;
          const r=ph*55*sz;
          const a=(1-ph)*alpha*.85;
          if(r<2)continue;
          ctx.globalAlpha=a;
          ctx.strokeStyle=e.color;ctx.lineWidth=2.5-k*0.4;
          ctx.shadowColor=e.color;ctx.shadowBlur=12;
          ctx.beginPath();ctx.ellipse(cx,cy+8,r,r*0.42,0,0,Math.PI*2);ctx.stroke();
        }
        // 中心爆发光晕
        ctx.globalAlpha=alpha*(1-prog*.5);
        ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=22;
        ctx.beginPath();ctx.arc(cx,cy+8,(8+prog*10)*sz,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=alpha;ctx.fillStyle='#fff';ctx.shadowBlur=10;
        ctx.beginPath();ctx.arc(cx,cy+8,3*sz,0,Math.PI*2);ctx.fill();
        ctx.restore();
        // 持续喷发粒子
        if(e.t>0.7&&Math.random()<.8){
          this.spawnParticles(cx,cy+8,Math.ceil(e.count*.3),e.color,
            {speed:3,life:.6,size:3.5*sz,shape:e.variant,sizeMul:sz});
        }
      }else if(e.type==='heal'&&e.char){
        const cx=e.char._x||0,cy=e.char._y||0;
        ctx.save();ctx.globalAlpha=alpha;
        ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=14;
        for(let k=0;k<3;k++){
          const off=(1-e.t)*60+k*16;
          const px=cx+Math.sin(k*2+e.t*5)*12,py=cy-off;
          ctx.font='bold 18px sans-serif';ctx.textAlign='center';
          ctx.fillText('+',px,py);
        }
        ctx.globalAlpha=alpha*.4;
        ctx.beginPath();ctx.ellipse(cx,cy+20,30*(1-e.t*.5),8,0,0,Math.PI*2);ctx.fill();
        ctx.restore();
        if(Math.random()<.5){
          this.particles.push({x:cx+(Math.random()-.5)*30,y:cy+10,vx:(Math.random()-.5)*.5,vy:-1-Math.random(),
            life:.8,maxLife:.8,color:e.color,size:2+Math.random()*2,shape:'orb',gravity:0,
            rot:0,vrot:0});
        }
      }else if(e.type==='deathBurst'){
        const cx=e.x||0,cy=(e.y||0)+8;
        const prog=1-e.t/(e.t0||1.4); // 0→1 扩散（基于初始时长归一化）
        ctx.save();
        // 外层扩散冲击环（椭圆地面）
        const rOut=prog*95;
        if(rOut>2){
          ctx.globalAlpha=alpha*(1-prog);
          ctx.strokeStyle=e.color;ctx.lineWidth=3.5;ctx.lineCap='round';
          ctx.shadowColor=e.color;ctx.shadowBlur=22;
          ctx.beginPath();ctx.ellipse(cx,cy+10,rOut,rOut*0.4,0,0,Math.PI*2);ctx.stroke();
        }
        // 内层亮环
        const rIn=prog*55;
        if(rIn>2){
          ctx.globalAlpha=alpha*(1-prog*1.2);
          ctx.strokeStyle='#ffffff';ctx.lineWidth=2;
          ctx.shadowColor='#fff';ctx.shadowBlur=12;
          ctx.beginPath();ctx.ellipse(cx,cy+10,rIn,rIn*0.4,0,0,Math.PI*2);ctx.stroke();
        }
        // 中心爆发光晕
        ctx.globalAlpha=alpha*(1-prog*.6);
        ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=30;
        ctx.beginPath();ctx.arc(cx,cy,14*(1-prog*.5),0,Math.PI*2);ctx.fill();
        // 上升消散的粒子尾迹
        if(Math.random()<.7){
          this.particles.push({x:cx+(Math.random()-.5)*20,y:cy-4,vx:(Math.random()-.5)*1,vy:-1.5-Math.random()*1.5,
            life:.9,maxLife:.9,color:e.color,size:2+Math.random()*2.5,shape:'orb',gravity:-.02,
            rot:0,vrot:0});
        }
        ctx.restore();
      }
    }
    // Particles update & render
    for(let i=this.particles.length-1;i>=0;i--){
      const p=this.particles[i];
      p.life-=0.025;
      if(p.life<=0){this.particles.splice(i,1);continue}
      p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.rot+=p.vrot;
      p.vx*=.96;p.vy*=.96;
      const a=Math.max(0,p.life/p.maxLife);
      ctx.save();ctx.globalAlpha=a;
      ctx.shadowColor=p.color;ctx.shadowBlur=8;
      drawVariantShape(ctx,p.shape,p.x,p.y,p.size,p.color,p.rot,a);
      ctx.restore();
    }
    // Damage numbers
    for(let i=this.dmgNums.length-1;i>=0;i--){
      const d=this.dmgNums[i];d.t-=.02;
      if(d.t<=0){this.dmgNums.splice(i,1);continue}
      const dx=d.char._x||0,dy=d.char._y||0;
      // 从立绘头顶上方开始，向上漂浮 40px
      const y=dy-58-40*(1-d.t);const alpha=d.t;
      ctx.textAlign='center';ctx.textBaseline='alphabetic';
      const txt=(d.type==='heal'||d.type==='mpHeal'?'+':'-')+d.val;
      ctx.font=`bold ${d.crit?28:20}px sans-serif`;
      ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle=`rgba(0,0,0,${Math.min(1,alpha*.95)})`;ctx.strokeText(txt,dx,y);
      let fillColor;
      if(d.type==='heal')fillColor=`rgba(74,222,128,${alpha})`;
      else if(d.type==='mpHeal')fillColor=`rgba(59,130,246,${alpha})`;
      else if(d.type==='dot'&&d.color)fillColor=d.color;
      else if(d.type==='dmg'&&d.color)fillColor=d.color;
      else fillColor=`rgba(255,90,90,${alpha})`;
      ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=fillColor;ctx.fillText(txt,dx,y);ctx.restore();
      if(d.crit){ctx.fillStyle=`rgba(255,230,80,${alpha})`;ctx.font='bold 15px sans-serif';ctx.lineWidth=3;ctx.strokeStyle=`rgba(0,0,0,${alpha})`;ctx.strokeText('暴击!',dx,y+18);ctx.fillText('暴击!',dx,y+18)}
    }
    // CTB timeline update
    this.renderTimeline();
  }
  drawChar(ctx,c,x,y,w,h){
    let ox=0,oy=0,alpha=1;
    if(c.anim.type==='hit'&&c.anim.t>0){
      const t=c.anim.t; // 1→0
      if(c.anim.crit){
        // 暴击固定抖动：固定方向+固定幅度，随时间衰减
        ox=4*t;
        oy=2*t;
      }
      alpha=.4+t*.6;
    }
    if(c.anim.type==='die'){alpha=Math.max(0,c.anim.t)}
    const imgKey=getPortraitKey(c);
    ctx.save();
    ctx.globalAlpha=alpha;
    const fx=x+ox,fy=y+oy;
    // Portrait drawn directly on canvas
    drawPortrait(ctx,fx,fy,w,h,imgKey,c.bigRealm||0,c.portraitIdx||0);
    // Border
    const isFocus=this.focusTarget===c;
    if(isFocus){ctx.shadowColor='#ff3b3b';ctx.shadowBlur=12}
    ctx.strokeStyle=isFocus?'#ff3b3b':(c.isAlly?'#d4af37':'#c0392b');
    ctx.lineWidth=isFocus?3:2;ctx.strokeRect(fx,fy,w,h);
    ctx.shadowBlur=0;
    ctx.restore();
    // HP/MP bars — 移到立绘内部底部（半透明背景），避免被下一排角色遮挡
    if(c.alive||c.anim.type==='die'){
      const bw=w,bh=3;
      const barH=bh*2+1;
      const by=y+h-barH-1; // 立绘内部底部
      ctx.fillStyle='rgba(10,10,25,0.7)';ctx.fillRect(x,by,bw,barH);
      // HP
      const hpPct=c.hp/c.maxHp;
      ctx.fillStyle='#e74c3c';ctx.fillRect(x,by,bw*hpPct,bh);
      // MP
      if(c.maxMp>0){const mpPct=c.mp/c.maxMp;ctx.fillStyle='#3498db';ctx.fillRect(x,by+bh+1,bw*mpPct,bh)}
      // Name
      ctx.fillStyle='#fff';ctx.font='8px serif';ctx.textAlign='center';
      ctx.fillText(getCharName(c),x+w/2,y-2);
      // CTB gauge — 立绘外部紧贴底部
      if(c.alive){
        const ctby=y+h+2;
        ctx.fillStyle='#1a1a2e';ctx.fillRect(x,ctby,bw,2);
        ctx.fillStyle='#f39c12';ctx.fillRect(x,ctby,bw*Math.min(1,c.ctb/100),2);
      }
      // Status icons — 统一遍历所有状态（poison/burn/cold/brave/ironwall/weak/shatter/swift/regen/meditate/atkUp/defUp/spdUp/critUp/atkDown/spdDown/stun）
      if(c.statuses){
        const sts=[];
        for(const k in c.statuses){if(c.statuses[k].stacks>0)sts.push({key:k,n:c.statuses[k].stacks})}
        if(sts.length>0){
          const r=7,gap=4;
          const totalW=sts.length*(r*2+gap)-gap;
          let sx=x+w/2-totalW/2+r;
          const cy=y-12;
          for(const st of sts){
            const cfg=STATUS_CONFIG[st.key];
            if(st.key==='cold'){
              // 雪花：6 条主臂 + 分支
              ctx.strokeStyle=cfg.color;ctx.lineWidth=1.4;ctx.lineCap='round';
              for(let i=0;i<6;i++){
                const a=i*Math.PI/3;
                const ex=sx+Math.cos(a)*r,ey=cy+Math.sin(a)*r;
                ctx.beginPath();ctx.moveTo(sx,cy);ctx.lineTo(ex,ey);ctx.stroke();
                const bx=sx+Math.cos(a)*r*0.55,by=cy+Math.sin(a)*r*0.55,br=r*0.38;
                ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(a+Math.PI/3)*br,by+Math.sin(a+Math.PI/3)*br);ctx.stroke();
                ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(a-Math.PI/3)*br,by+Math.sin(a-Math.PI/3)*br);ctx.stroke();
              }
            }else if(st.key==='burn'){
              // 火苗：外焰 + 内焰
              ctx.fillStyle=cfg.dmgColor||cfg.color;
              ctx.beginPath();
              ctx.moveTo(sx,cy-r);
              ctx.bezierCurveTo(sx+r*0.85,cy-r*0.25,sx+r*0.6,cy+r*0.85,sx,cy+r);
              ctx.bezierCurveTo(sx-r*0.6,cy+r*0.85,sx-r*0.85,cy-r*0.25,sx,cy-r);
              ctx.fill();
              ctx.fillStyle='#fff7cc';
              ctx.beginPath();
              ctx.moveTo(sx,cy-r*0.55);
              ctx.bezierCurveTo(sx+r*0.45,cy-r*0.1,sx+r*0.3,cy+r*0.45,sx,cy+r*0.55);
              ctx.bezierCurveTo(sx-r*0.3,cy+r*0.45,sx-r*0.45,cy-r*0.1,sx,cy-r*0.55);
              ctx.fill();
            }else if(st.key==='poison'){
              // 骷髅：颅骨 + 双眼 + 牙齿
              ctx.fillStyle=cfg.color;
              ctx.beginPath();ctx.arc(sx,cy-r*0.15,r*0.9,0,Math.PI*2);ctx.fill();
              ctx.fillStyle='#0a3d1a';
              ctx.beginPath();ctx.arc(sx-r*0.32,cy-r*0.1,r*0.2,0,Math.PI*2);ctx.arc(sx+r*0.32,cy-r*0.1,r*0.2,0,Math.PI*2);ctx.fill();
              ctx.fillRect(sx-r*0.3,cy+r*0.35,r*0.6,r*0.28);
              ctx.fillStyle=cfg.color;
              ctx.fillRect(sx-r*0.1,cy+r*0.35,r*0.04,r*0.28);
              ctx.fillRect(sx+r*0.06,cy+r*0.35,r*0.04,r*0.28);
            }else if(st.key==='brave'){
              // 剑刃：纵向刀身 + 横向护手 + 柄
              ctx.fillStyle=cfg.color;
              ctx.beginPath();
              ctx.moveTo(sx,cy-r);
              ctx.lineTo(sx+r*0.3,cy-r*0.2);
              ctx.lineTo(sx+r*0.3,cy+r*0.4);
              ctx.lineTo(sx-r*0.3,cy+r*0.4);
              ctx.lineTo(sx-r*0.3,cy-r*0.2);
              ctx.closePath();ctx.fill();
              ctx.fillRect(sx-r*0.6,cy+r*0.4,r*1.2,r*0.18);
              ctx.fillRect(sx-r*0.12,cy+r*0.55,r*0.24,r*0.35);
            }else if(st.key==='ironwall'){
              // 盾牌：盾面 + 内十字
              ctx.fillStyle=cfg.color;
              ctx.beginPath();
              ctx.moveTo(sx,cy-r);
              ctx.lineTo(sx+r*0.7,cy-r*0.5);
              ctx.lineTo(sx+r*0.7,cy+r*0.2);
              ctx.quadraticCurveTo(sx+r*0.5,cy+r,sx,cy+r);
              ctx.quadraticCurveTo(sx-r*0.5,cy+r,sx-r*0.7,cy+r*0.2);
              ctx.lineTo(sx-r*0.7,cy-r*0.5);
              ctx.closePath();ctx.fill();
              ctx.strokeStyle='#37474f';ctx.lineWidth=1.2;
              ctx.beginPath();ctx.moveTo(sx,cy-r*0.5);ctx.lineTo(sx,cy+r*0.6);
              ctx.moveTo(sx-r*0.4,cy+r*0.05);ctx.lineTo(sx+r*0.4,cy+r*0.05);
              ctx.stroke();
            }else if(st.key==='weak'){
              // 虚弱：向下箭头（红色衰减意象）
              ctx.fillStyle=cfg.color;
              ctx.beginPath();
              ctx.moveTo(sx,cy+r);
              ctx.lineTo(sx+r*0.7,cy-r*0.1);
              ctx.lineTo(sx+r*0.35,cy-r*0.1);
              ctx.lineTo(sx+r*0.35,cy-r);
              ctx.lineTo(sx-r*0.35,cy-r);
              ctx.lineTo(sx-r*0.35,cy-r*0.1);
              ctx.lineTo(sx-r*0.7,cy-r*0.1);
              ctx.closePath();ctx.fill();
            }else if(st.key==='shatter'){
              // 破甲：盾形裂纹（多段折线裂痕）
              ctx.fillStyle=cfg.color;
              ctx.beginPath();
              ctx.moveTo(sx,cy-r);
              ctx.lineTo(sx+r*0.6,cy-r*0.5);
              ctx.lineTo(sx+r*0.6,cy+r*0.2);
              ctx.quadraticCurveTo(sx+r*0.45,cy+r,sx,cy+r);
              ctx.quadraticCurveTo(sx-r*0.45,cy+r,sx-r*0.6,cy+r*0.2);
              ctx.lineTo(sx-r*0.6,cy-r*0.5);
              ctx.closePath();ctx.fill();
              ctx.strokeStyle='#3e2723';ctx.lineWidth=1.3;ctx.lineCap='round';
              ctx.beginPath();
              ctx.moveTo(sx-r*0.3,cy-r*0.4);ctx.lineTo(sx-r*0.05,cy);ctx.lineTo(sx-r*0.2,cy+r*0.4);
              ctx.moveTo(sx-r*0.05,cy);ctx.lineTo(sx+r*0.35,cy+r*0.2);
              ctx.stroke();
            }else if(st.key==='swift'){
              // 迅捷：双翼/风迹（两条弧线 + 短尾迹）
              ctx.strokeStyle=cfg.color;ctx.lineWidth=1.6;ctx.lineCap='round';
              ctx.beginPath();
              ctx.moveTo(sx-r*0.9,cy);ctx.quadraticCurveTo(sx-r*0.2,cy-r*0.8,sx+r*0.7,cy-r*0.4);
              ctx.moveTo(sx-r*0.9,cy+r*0.2);ctx.quadraticCurveTo(sx-r*0.2,cy-r*0.6,sx+r*0.7,cy-r*0.2);
              ctx.moveTo(sx-r*0.9,cy+r*0.4);ctx.quadraticCurveTo(sx-r*0.2,cy-r*0.4,sx+r*0.7,cy);
              ctx.stroke();
            }else if(st.key==='regen'||st.key==='meditate'){
              // 愈合(红)/调息(蓝)：爱心 — 两圆 + 三角底
              ctx.fillStyle=cfg.color;
              const hr=r*0.95;
              ctx.beginPath();
              ctx.arc(sx-hr*0.45,cy-hr*0.15,hr*0.45,0,Math.PI*2);
              ctx.arc(sx+hr*0.45,cy-hr*0.15,hr*0.45,0,Math.PI*2);
              ctx.moveTo(sx-hr*0.88,cy-hr*0.05);
              ctx.lineTo(sx,cy+hr*0.85);
              ctx.lineTo(sx+hr*0.88,cy-hr*0.05);
              ctx.closePath();
              ctx.fill();
              // 高光
              ctx.fillStyle='rgba(255,255,255,0.45)';
              ctx.beginPath();ctx.arc(sx-hr*0.3,cy-hr*0.3,hr*0.12,0,Math.PI*2);ctx.fill();
            }else if(st.key==='atkUp'||st.key==='atkDown'||st.key==='defUp'||st.key==='defDown'||st.key==='spdUp'||st.key==='spdDown'||st.key==='critUp'){
              // 百分比型增益/减益：上下双三角箭头
              const isUp=cfg.atkPct>0||cfg.defPct>0||cfg.spdPct>0||cfg.critPct>0;
              ctx.fillStyle=cfg.color;
              if(isUp){
                // 向上箭头（增益）
                ctx.beginPath();
                ctx.moveTo(sx,cy-r);
                ctx.lineTo(sx+r*0.8,cy+r*0.1);
                ctx.lineTo(sx+r*0.35,cy+r*0.1);
                ctx.lineTo(sx+r*0.35,cy+r);
                ctx.lineTo(sx-r*0.35,cy+r);
                ctx.lineTo(sx-r*0.35,cy+r*0.1);
                ctx.lineTo(sx-r*0.8,cy+r*0.1);
                ctx.closePath();ctx.fill();
              }else{
                // 向下箭头（减益）
                ctx.beginPath();
                ctx.moveTo(sx,cy+r);
                ctx.lineTo(sx+r*0.8,cy-r*0.1);
                ctx.lineTo(sx+r*0.35,cy-r*0.1);
                ctx.lineTo(sx+r*0.35,cy-r);
                ctx.lineTo(sx-r*0.35,cy-r);
                ctx.lineTo(sx-r*0.35,cy-r*0.1);
                ctx.lineTo(sx-r*0.8,cy-r*0.1);
                ctx.closePath();ctx.fill();
              }
            }else if(st.key==='stun'){
              // 眩晕：旋转闪电符号（Z 形）
              ctx.strokeStyle=cfg.color;ctx.lineWidth=1.6;ctx.lineCap='round';ctx.lineJoin='round';
              ctx.beginPath();
              ctx.moveTo(sx-r*0.5,cy-r*0.7);
              ctx.lineTo(sx+r*0.3,cy-r*0.2);
              ctx.lineTo(sx-r*0.2,cy+r*0.15);
              ctx.lineTo(sx+r*0.5,cy+r*0.7);
              ctx.stroke();
            }
            // 层数徽章（右下角白字黑描边）
            ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.lineWidth=2;ctx.strokeStyle='rgba(0,0,0,0.85)';
            ctx.fillStyle='#fff';
            ctx.strokeText(st.n,sx+r*0.95,cy+r*0.95);
            ctx.fillText(st.n,sx+r*0.95,cy+r*0.95);
            ctx.textBaseline='alphabetic';
            sx+=r*2+gap;
          }
        }
      }
    }
    ctx.textAlign='left';
  }
  renderTimeline(){
    const el=document.getElementById('ctb-bar');
    if(!el)return;
    const tl=this.getTimeline();
    let html='';
    for(let i=0;i<tl.length;i++){
      const c=tl[i];
      const imgKey=getPortraitKey(c);
      const border=c.isAlly?'#d4af37':'#c0392b';
      html+=`<div class="ctb-slot" style="border-color:${border};background:${ctbBg(imgKey)}">`;
      html+=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px">${ctbIcon(imgKey)}</div>`;
      html+=`<div class="ctb-num">${Math.floor(c.ctb)}</div></div>`;
      if(i===0)html+='<span class="ctb-arrow">▶</span>';
    }
    el.innerHTML=html;
  }
}

//============ SECRET REALM ============
function enterRealm(realmId){
  const sr=SECRET_REALMS.find(r=>r.id===realmId);
  if(game.player.bigRealm<sr.realmReq){toast('境界不足，需要'+REALMS[sr.realmReq]);return}
  game.currentRealmId=realmId;
  const prog=game.realmProgress[realmId];
  enterRealmFloor(realmId,prog.floor);
}
function enterRealmFloor(realmId,floor){
  const sr=SECRET_REALMS.find(r=>r.id===realmId);
  const team=getTeamChars();
  if(team.length===0){toast('需要至少1名角色');return}
  // Generate enemies
  const pBig=game.player.bigRealm;
  const numEn=Math.min(3+Math.floor(floor/2),6);
  const enemies=[];
  const isBoss=floor%5===0;
  if(isBoss){
    const bossList=sr.bosses||(sr.boss?[sr.boss]:[]);
    const numBoss=Math.min(bossList.length,3);
    for(let i=0;i<numBoss;i++)enemies.push(createMonster(bossList[i],floor,pBig,sr.realmReq));
    const minionSlots=6-numBoss;
    for(let i=0;i<Math.min(2,minionSlots);i++)enemies.push(createMonster(pick(sr.monsters),floor,pBig,sr.realmReq))
  }else{for(let i=0;i<numEn;i++)enemies.push(createMonster(pick(sr.monsters),floor,pBig,sr.realmReq))}
  // 宝箱怪：10% 概率替换一只非 BOSS 小怪为宝箱怪
  if(Math.random()<0.1){
    const nonBossIdx=enemies.map((e,i)=>(MONSTERS[e.mdef.monsterId]?.isBoss?-1:i)).filter(i=>i>=0);
    if(nonBossIdx.length>0){
      const ri=nonBossIdx[Math.floor(Math.random()*nonBossIdx.length)];
      enemies[ri]=createMonster('chestMimic',floor,pBig,sr.realmReq);
    }else if(enemies.length<6){
      enemies.push(createMonster('chestMimic',floor,pBig,sr.realmReq));
    }
  }
  game.battle=new Battle(team,enemies,realmId,floor);
  showScreen('battle');
}
function retreat(){
  if(!game.battle)return;
  if(game.battle.isEndless){
    // 百鬼夜行：主动撤退 = 结束本次挑战，保留已获得奖励
    endEndlessRun('retreat');
    return;
  }
  game.battle.over=true;game.battle.winner='enemies';
  game.battle.onEnd();
}
function toggleSpeed(){
  const speeds=[1,2,4];const idx=(speeds.indexOf(game.battleSpeed)+1)%speeds.length;
  game.battleSpeed=speeds[idx];
  document.getElementById('speed-btn').textContent=game.battleSpeed+'x';
}
// 集火：切换选择目标模式
function toggleFocusMode(){
  if(!game.battle||game.battle.over)return;
  const b=game.battle;
  b.focusMode=!b.focusMode;
  const btn=document.getElementById('focus-btn');
  if(b.focusMode){
    btn.classList.add('active');btn.style.background='#ff3b3b';btn.style.color='#fff';
    toast('请点击要集火的敌方目标');
    // 再次点击按钮取消
    btn.textContent='🎯 取消集火';
  }else{
    btn.classList.remove('active');btn.style.background='';btn.style.color='';
    btn.textContent='🎯 集火';
  }
}
// 画布点击：集火模式下选择敌方目标
function onBattleCanvasClick(e){
  if(!game.battle||game.battle.over)return;
  const b=game.battle;
  if(!b.focusMode)return;
  const canvas=document.getElementById('battle-canvas');
  const rect=canvas.getBoundingClientRect();
  const sx=canvas.width/rect.width,sy=canvas.height/rect.height;
  const cx=(e.clientX-rect.left)*sx,cy=(e.clientY-rect.top)*sy;
  // 遍历敌人，判断点击是否落在其立绘槽内
  let hit=null,minDist=Infinity;
  for(const en of b.enemies){
    if(!en.alive)continue;
    const ex=en._x,ey=en._y;
    if(ex==null||ey==null)continue;
    // 槽位半宽/半高（与 render 中 slotW/slotH 近似）
    const hw=b._slotW?b._slotW/2:45,hh=b._slotH?b._slotH/2:58;
    if(cx>=ex-hw&&cx<=ex+hw&&cy>=ey-hh&&cy<=ey+hh){
      const d=Math.hypot(cx-ex,cy-ey);
      if(d<minDist){minDist=d;hit=en}
    }
  }
  if(hit){
    b.focusTarget=hit;
    b.focusMode=false;
    const btn=document.getElementById('focus-btn');
    btn.classList.remove('active');btn.style.background='';btn.style.color='';
    btn.textContent='🎯 集火中';
    toast('已集火：'+getCharName(hit));
  }else{
    toast('未点中敌人，请重试');
  }
}
// 清除集火（目标死亡或战斗结束时调用）
function clearFocusTarget(){
  if(!game.battle)return;
  game.battle.focusTarget=null;game.battle.focusMode=false;
  const btn=document.getElementById('focus-btn');
  if(btn){btn.classList.remove('active');btn.style.background='';btn.style.color='';btn.textContent='🎯 集火'}
}
function exitBattle(){
  document.getElementById('battle-result').classList.remove('show');
  game.battle=null;
  showScreen('realm');
}

//============ 百鬼夜行（无尽挑战） ============
// 获取全部可出战角色（主角 + 弟子），并附加 endlessId
function getAllEndlessChars(){
  const chars=[{id:'player',char:createPlayer()}];
  game.disciples.forEach((d,i)=>chars.push({id:String(i),char:d}));
  return chars;
}
function startEndlessRun(){
  if(game.endlessRun){toast('已有进行中的百鬼夜行');return}
  const allChars=getAllEndlessChars();
  if(allChars.length===0){toast('没有可出战角色');return}
  // 初始化：全员满状态
  const charState={};
  for(const {id,char} of allChars){
    const a=calcAttrs(char);
    charState[id]={hp:a.hp,mp:a.mp};
  }
  game.endlessRun={
    round:1,
    deadChars:new Set(),
    charState,
    pillUsed:new Set(), // 本轮已使用恢复丹的角色 endlessId
    rewards:{spirit:0,herb:0,skillPage:0,pills:{},skillBooks:{}}
  };
  showEndlessSelect();
}
// 角色选择界面（在秘境内容区渲染）
let endlessSelected=[];
function showEndlessSelect(){
  const run=game.endlessRun;
  if(!run)return;
  renderRes('realm-res');
  const allChars=getAllEndlessChars();
  const aliveChars=allChars.filter(({id})=>!run.deadChars.has(id));
  // 若存活不足 1 人，直接结束
  if(aliveChars.length===0){endEndlessRun('defeat');return}
  // 限制选择不超过 6 人，且不超过存活人数
  const maxSel=Math.min(6,aliveChars.length);
  // 清理已选列表中阵亡或超出的角色
  endlessSelected=endlessSelected.filter(id=>aliveChars.some(c=>c.id===id)).slice(0,maxSel);
  const isBoss=run.round%5===0;
  const bossIdx=Math.floor(run.round/5)-1;
  const bossName=isBoss?MONSTERS[ENDLESS_BOSSES[bossIdx%ENDLESS_BOSSES.length]].name:'—';
  let html=`<div style="padding:8px">
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="color:var(--gold);font-size:15px;font-weight:bold">👹 百鬼夜行 · 第 ${run.round} 轮</span>
        <span style="font-size:11px;color:var(--dim)">阵亡 ${run.deadChars.size}/${allChars.length} 人</span>
      </div>
      <div style="font-size:12px;color:var(--text)">
        ${isBoss?`<span style="color:var(--red)">⚠ BOSS战：${bossName}</span>`:'<span style="color:var(--jade)">小怪战</span>'}
        &nbsp;|&nbsp; 怪物小境界 +${run.round}
        &nbsp;|&nbsp; 已获 💎${run.rewards.spirit} 🌿${run.rewards.herb} 📜${run.rewards.skillPage||0}
      </div>
      <div style="font-size:11px;color:var(--dim);margin-top:4px">选择最多 ${maxSel} 名存活角色出战（阵亡角色本次挑战不可再上场）</div>
    </div>`;
  // 角色卡片网格
  html+='<div class="disc-list" style="display:grid;grid-template-columns:1fr 1fr;gap:6px">';
  for(const {id,char} of allChars){
    const dead=run.deadChars.has(id);
    const sel=endlessSelected.includes(id);
    const st=run.charState[id];
    const a=calcAttrs(char);
    const hpPct=st?Math.floor(st.hp/a.hp*100):100;
    const mpPct=st?Math.floor(st.mp/a.mp*100):100;
    const gendSym=(char.gender||'m')==='m'?'♂':'♀';
    const usedPill=!dead&&run.pillUsed.has(id);
    // 恢复丹按钮（仅存活且本轮未用过的角色显示）
    let pillBtns='';
    if(!dead&&!usedPill){
      const parts=[];
      for(const pk in RECOVERY_PILLS){
        const pp=RECOVERY_PILLS[pk];
        const have=game.warehouse.recoveryPills[pk]||0;
        parts.push(`<button class="btn" style="padding:1px 4px;font-size:9px;line-height:1.4;background:${pp.color};color:#000;border:none;border-radius:3px;${have<=0?'opacity:.35;pointer-events:none':''}" onclick="event.stopPropagation();useEndlessPill('${id}','${pk}')" title="${pp.desc}">${pp.name.replace('恢复丹','')}${have>0?'×'+have:''}</button>`);
      }
      pillBtns=`<div style="display:flex;gap:3px;margin-top:3px;flex-wrap:wrap">${parts.join('')}</div>`;
    }
    html+=`<div class="disc-card${sel?' in-team':''}${dead?' locked':''}" style="${dead?'opacity:.4;pointer-events:none':''}" onclick="toggleEndlessSelect('${id}')">
      <div class="disc-name">${char.name} <span style="color:${char.gender==='m'?'#3498db':'#e84393'}">${gendSym}</span></div>
      <div class="disc-prof">${char.profession?PROFESSIONS[char.profession].name:'掌门'}</div>
      <div class="disc-realm"><span class="realm-badge realm-${char.bigRealm}">${realmStr(char)}</span></div>
      <div style="height:6px;background:#333;border-radius:3px;margin-top:3px;overflow:hidden">
        <div style="height:100%;width:${hpPct}%;background:linear-gradient(90deg,#e74c3c,#27ae60)"></div>
      </div>
      <div style="height:4px;background:#333;border-radius:2px;margin-top:2px;overflow:hidden">
        <div style="height:100%;width:${mpPct}%;background:#3498db"></div>
      </div>
      ${pillBtns}
      <div style="font-size:9px;color:var(--dim);margin-top:2px">${dead?'💀 已阵亡':(usedPill?'💊 已用丹':(sel?'✓ 已选':'点击选择'))}</div>
    </div>`;
  }
  html+='</div>';
  // 底部操作栏
  html+=`<div style="position:sticky;bottom:0;background:var(--bg);padding:8px 0;display:flex;gap:6px;margin-top:8px">
    <button class="btn btn-gray" style="flex:1" onclick="endEndlessRun('retreat')">撤退结算</button>
    <button class="btn btn-gold" style="flex:2" onclick="confirmEndlessBattle()" ${endlessSelected.length===0?'disabled':''}>出战 (${endlessSelected.length}/${maxSel})</button>
  </div></div>`;
  document.getElementById('realm-content').innerHTML=html;
  // 仅切换到秘境界面，不触发 renderRealm（避免覆盖选人界面）
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('realm-screen').classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#realm-screen .nav-btn').forEach(b=>{
    const m=b.getAttribute('onclick')||'';
    if(m.includes("'realm'"))b.classList.add('active');
  });
}
function toggleEndlessSelect(id){
  const run=game.endlessRun;
  if(!run||run.deadChars.has(id))return;
  const maxSel=Math.min(6,getAllEndlessChars().filter(c=>!run.deadChars.has(c.id)).length);
  const i=endlessSelected.indexOf(id);
  if(i>=0){endlessSelected.splice(i,1)}
  else{
    if(endlessSelected.length>=maxSel){toast(`最多选择${maxSel}人`);return}
    endlessSelected.push(id);
  }
  showEndlessSelect();
}
// 无尽模式战前使用恢复丹：每存活角色每轮限1颗，阵亡角色不可用
function useEndlessPill(id,kind){
  const run=game.endlessRun;
  if(!run)return;
  if(run.deadChars.has(id)){toast('阵亡角色无法使用丹药');return}
  if(run.pillUsed.has(id)){toast('该角色本轮已用过丹药');return}
  const def=RECOVERY_PILLS[kind];
  if(!def)return;
  const have=game.warehouse.recoveryPills[kind]||0;
  if(have<=0){toast(def.name+'不足');return}
  // 找到角色对象与属性
  const entry=getAllEndlessChars().find(c=>c.id===id);
  if(!entry)return;
  const a=calcAttrs(entry.char);
  const st=run.charState[id];
  if(!st){run.charState[id]={hp:a.hp,mp:a.mp}}
  const cur=run.charState[id];
  const healHp=Math.floor(a.hp*def.pct);
  const healMp=Math.floor(a.mp*def.pct);
  const beforeHp=cur.hp,beforeMp=cur.mp;
  cur.hp=Math.min(a.hp,cur.hp+healHp);
  cur.mp=Math.min(a.mp,cur.mp+healMp);
  const gainedHp=cur.hp-beforeHp,gainedMp=cur.mp-beforeMp;
  game.warehouse.recoveryPills[kind]--;
  run.pillUsed.add(id);
  toast(`${entry.char.name} 使用${def.name}：HP+${gainedHp} MP+${gainedMp}`);
  saveGame();
  showEndlessSelect();
}
// 生成百鬼夜行敌人
function generateEndlessEnemies(round){
  const pBig=game.player.bigRealm;
  const isBoss=round%5===0;
  const enemies=[];
  if(isBoss){
    // BOSS 轮：1 个 BOSS + 小怪填充
    const bossIdx=Math.floor(round/5)-1;
    const bossId=ENDLESS_BOSSES[bossIdx%ENDLESS_BOSSES.length];
    const boss=createMonster(bossId,round,pBig,pBig);
    enemies.push(boss);
    // 小怪池：从所有非 BOSS 怪中随机（宝箱怪仅通过 10% 概率门控出现）
    const minionPool=Object.keys(MONSTERS).filter(k=>!MONSTERS[k].isBoss&&k!=='chestMimic');
    const minionCount=Math.min(2+Math.floor(round/10),4);
    for(let i=0;i<minionCount && enemies.length<6;i++){
      const m=createMonster(pick(minionPool),Math.max(1,round-1),pBig,pBig);
      enemies.push(m);
    }
  }else{
    // 普通轮：3~6 只随机小怪（宝箱怪仅通过 10% 概率门控出现，不进随机池）
    const minionPool=Object.keys(MONSTERS).filter(k=>!MONSTERS[k].isBoss&&k!=='chestMimic');
    const count=Math.min(3+Math.floor(round/3),6);
    for(let i=0;i<count;i++){
      const m=createMonster(pick(minionPool),round,pBig,pBig);
      enemies.push(m);
    }
  }
  // 宝箱怪：10% 概率替换一只非 BOSS 小怪为宝箱怪
  if(Math.random()<0.1){
    const nonBossIdx=enemies.map((e,i)=>(MONSTERS[e.mdef.monsterId]?.isBoss?-1:i)).filter(i=>i>=0);
    if(nonBossIdx.length>0){
      const ri=nonBossIdx[Math.floor(Math.random()*nonBossIdx.length)];
      enemies[ri]=createMonster('chestMimic',round,pBig,pBig);
    }else if(enemies.length<6){
      enemies.push(createMonster('chestMimic',round,pBig,pBig));
    }
  }
  return enemies;
}
function confirmEndlessBattle(){
  const run=game.endlessRun;
  if(!run||endlessSelected.length===0){toast('请选择出战角色');return}
  // 构建出战队伍，附加 endlessId 并恢复 charState 中的 HP/MP
  const team=[];
  for(const id of endlessSelected){
    let char;
    if(id==='player'){char=createPlayer()}
    else{char=game.disciples[id]}
    char.endlessId=id;
    // Battle 构造时会从 charState 恢复 HP/MP
    team.push(char);
  }
  const enemies=generateEndlessEnemies(run.round);
  game.battle=new Battle(team,enemies,null,run.round,{isEndless:true});
  showScreen('battle');
}
// 结束百鬼夜行，展示结算
function endEndlessRun(result){
  const run=game.endlessRun;
  if(!run){showScreen('realm');return}
  const rewards=run.rewards;
  let pillHtml='';
  for(const k in rewards.pills){
    const p=BREAKTHROUGH_PILLS[k];
    pillHtml+=`<div class="result-row"><span style="color:${p.color}">${p.name}</span><span style="color:var(--jade)">+${rewards.pills[k]}</span></div>`;
  }
  let bookHtml='';
  for(const k in rewards.skillBooks){
    const s=SKILLS[k];
    if(!s)continue;
    bookHtml+=`<div class="result-row"><span style="color:${SPIRIT_ROOTS[s.elem]?.color||'#fff'}">${s.name}${gradeTag(s.grade)} 技能书</span><span style="color:var(--jade)">+${rewards.skillBooks[k]}</span></div>`;
  }
  const title=result==='retreat'?'主动撤退':'全员阵亡';
  showModal('👹 百鬼夜行结算',`
    <div style="text-align:center;margin-bottom:10px">
      <div style="font-size:18px;color:${result==='retreat'?'var(--gold)':'var(--red)'};font-weight:bold">${title}</div>
      <div style="font-size:13px;color:var(--dim);margin-top:4px">坚持到第 ${run.round} 轮 · 阵亡 ${run.deadChars.size} 人</div>
    </div>
    <div class="result-row"><span>💎 灵石</span><span style="color:var(--jade)">+${rewards.spirit}</span></div>
    <div class="result-row"><span>🌿 灵草</span><span style="color:var(--jade)">+${rewards.herb}</span></div>
    <div class="result-row"><span>📜 技能页</span><span style="color:var(--jade)">+${rewards.skillPage||0}</span></div>
    ${pillHtml}
    ${bookHtml}
    <div style="font-size:11px;color:var(--dim);margin-top:8px">奖励已即时发放至背包</div>
  `);
  // 清理状态
  game.endlessRun=null;
  endlessSelected=[];
  if(game.battle){
    game.battle.over=true;
    game.battle=null;
  }
  document.getElementById('battle-result').classList.remove('show');
  showScreen('realm');
}

//============ DISCIPLE SYSTEM ============
const RECRUIT_COST=100;
const REFRESH_COST=10;
function refreshCandidates(skipCost){
  if(!skipCost){
    if(game.resources.spirit<REFRESH_COST){toast('灵石不足（需要'+REFRESH_COST+'灵石刷新）');return}
    game.resources.spirit-=REFRESH_COST;
  }
  game.recruitCandidates=[createDisciple(),createDisciple(),createDisciple()];
  saveGame();
  // 刷新所有界面的资源显示，避免扣除后顶部灵石数不更新
  refreshAllRes();
}
// 刷新页面上所有资源显示元素
function refreshAllRes(){
  document.querySelectorAll('[id$="-res"]').forEach(el=>{
    try{renderRes(el.id)}catch(e){}
  });
}
function openRecruit(){
  if(!game.recruitCandidates||game.recruitCandidates.length===0)refreshCandidates(true);
  const modal=document.getElementById('modal');
  const gendSym=m=>m==='m'?'♂':'♀';
  let cards='';
  game.recruitCandidates.forEach((d,i)=>{
    if(!d){cards+=`<div class="recruit-card empty">已招募</div>`;return}
    const root=d.spiritRoot;
    const rootName=SPIRIT_ROOTS[root]?.name||'';
    const rootColor=SPIRIT_ROOTS[root]?.color||'';
    const talentsText=d.talents.map(t=>talentHtml(t)).join('、')||'<span style="color:var(--dim)">无</span>';
    cards+=`<div class="recruit-card">
      <div class="recruit-portrait-wrap">
        <canvas id="recruit-portrait-${i}" width="80" height="100"></canvas>
      </div>
      <div style="flex:1;min-width:0;font-size:13px;line-height:1.6">
        <div>
          <span style="color:var(--gold);font-weight:bold;font-size:15px">${d.name}</span>
          <span style="color:${d.gender==='m'?'#3498db':'#e84393'};margin-left:4px">${gendSym(d.gender)}</span>
          <span style="color:var(--dim);margin-left:8px">${realmStr(d)}</span>
        </div>
        <div><span style="color:var(--dim)">职业：</span><span style="color:#e8d9a0">${PROFESSIONS[d.profession].name}</span></div>
        <div><span style="color:var(--dim)">灵根：</span><span style="color:${rootColor}">${rootName}</span></div>
        <div style="white-space:normal;word-break:break-word"><span style="color:var(--dim)">天赋：</span>${talentsText}</div>
      </div>
      <button class="btn btn-gold" style="flex:0 0 auto;align-self:center;display:flex;flex-direction:column;align-items:center;line-height:1.3;padding:8px 12px" onclick="recruitCandidate(${i})">
        <span>招募</span>
        <span style="font-size:13px">${RECRUIT_COST}💎</span>
      </button>
    </div>`;
  });
  document.getElementById('modal-content').innerHTML=`
    <h3>招募弟子</h3>
    <p style="color:var(--dim)">从下方 3 名候选人中挑选一人招募，也可刷新候选名单。</p>
    <div class="recruit-list">${cards}</div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:10px">
      <button class="btn btn-blue" onclick="refreshCandidates();openRecruit()">刷新名单 (10💎)</button>
      <button class="btn btn-gray" onclick="document.getElementById('modal').classList.remove('show')">关闭</button>
    </div>`;
  modal.classList.add('show');
  // 绘制候选人立绘
  setTimeout(()=>{
    game.recruitCandidates.forEach((d,i)=>{
      if(!d)return;
      const c=document.getElementById('recruit-portrait-'+i);
      if(c){const ctx=c.getContext('2d');drawPortrait(ctx,0,0,c.width,c.height,getPortraitKey(d),d.bigRealm||0,d.portraitIdx||0);ctx.strokeStyle='#d4af37';ctx.lineWidth=2;ctx.strokeRect(0,0,c.width,c.height)}
    });
  },10);
}
function recruitCandidate(idx){
  const d=game.recruitCandidates[idx];
  if(!d){toast('该候选人已被招募');return}
  if(game.disciples.length>=getDiscipleCap()){toast('弟子已满（上限'+getDiscipleCap()+'，请升级洞府）');return}
  if(game.resources.spirit<RECRUIT_COST){toast('灵石不足');return}
  game.resources.spirit-=RECRUIT_COST;
  game.disciples.push(d);
  game.recruitCandidates[idx]=null;
  toast('招募到'+d.name+'('+PROFESSIONS[d.profession].name+')');
  saveGame();
  refreshAllRes();
  openRecruit();
  renderDisciples();
}
function recruitDisciple(){openRecruit()}
// 驱逐弟子：从弟子列表中移除，同时清理队伍/修炼/职务引用
function dismissDisciple(idx){
  if(typeof idx!=='number'){toast('主角不可驱逐');return}
  const d=game.disciples[idx];
  if(!d){toast('弟子不存在');return}
  // 弹窗确认
  showConfirmModal(`驱逐「${d.name}」？`, `该弟子将被永久移除，无法恢复。`, ()=>{
    // 从队伍移除
    game.teamSlots=game.teamSlots.filter(s=>s!==idx);
    // 重新映射队伍索引（删除后索引偏移）
    game.teamSlots=game.teamSlots.map(s=>s>idx?s-1:s);
    // 从修炼槽移除
    game.cultivateSlots=game.cultivateSlots.filter(s=>s!=='player'&&s!==idx).map(s=>typeof s==='number'&&s>idx?s-1:s);
    // 从职务移除
    for(const pos in game.sectPositions){
      game.sectPositions[pos]=game.sectPositions[pos].filter(s=>s!==idx).map(s=>typeof s==='number'&&s>idx?s-1:s);
    }
    // 从无尽模式阵亡列表移除
    if(game.endlessRun&&game.endlessRun.deadChars){
      const newDead=new Set();
      for(const id of game.endlessRun.deadChars){
        if(id==='player')newDead.add('player');
        else{const num=typeof id==='number'?id:parseInt(id);if(!isNaN(num)&&num!==idx)newDead.add(num>idx?num-1:num)}
      }
      game.endlessRun.deadChars=newDead;
    }
    // 归还装备与法宝到仓库
    for(const s of Object.keys(EQUIP_SLOTS)){if(d.equipment&&d.equipment[s])game.warehouse.equipment.push(d.equipment[s])}
    if(Array.isArray(d.treasures))for(const t of d.treasures){if(t)game.warehouse.treasures.push(t)}
    // 删除弟子
    game.disciples.splice(idx,1);
    toast(d.name+'已离开宗门');
    saveGame();
    // 关闭详情面板
    document.getElementById('char-detail').classList.remove('show');
    renderDisciples();
  });
}
// 确认弹窗：title + body + 确认回调
function showConfirmModal(title,body,onConfirm){
  const modal=document.getElementById('modal');
  document.getElementById('modal-content').innerHTML=`
    <h3>${title}</h3>
    <p style="color:var(--dim);margin-bottom:16px">${body}</p>
    <div class="modal-btns" style="margin-top:12px">
      <button class="btn btn-red" id="confirm-yes-btn">确认驱逐</button>
      <button class="btn btn-gray" onclick="closeModal()">取消</button>
    </div>`;
  modal.classList.add('show');
  document.getElementById('confirm-yes-btn').onclick=()=>{
    closeModal();
    onConfirm();
  };
}

//============ 访客系统 ============
const VISITOR_TYPES=[
  {id:'merchant', name:'行商', icon:'🧑‍💼', color:'#d4af37', weight:30},
  {id:'wanderer', name:'云游修士', icon:'🧙', color:'#4caf50', weight:25},
  {id:'hermit', name:'隐士高人', icon:'🧓', color:'#9c27b0', weight:25},
  {id:'alchemist', name:'炼丹师', icon:'⚗️', color:'#ff9800', weight:20},
];

// 触发访客
function showVisitor(){
  const totalW=VISITOR_TYPES.reduce((s,v)=>s+v.weight,0);
  let r=Math.random()*totalW,visitor;
  for(const v of VISITOR_TYPES){r-=v.weight;if(r<=0){visitor=v;break}}
  if(!visitor)return;
  const modal=document.getElementById('modal');
  let body='';
  if(visitor.id==='merchant')body=_visitorMerchantHtml();
  else if(visitor.id==='wanderer')body=_visitorWandererHtml();
  else if(visitor.id==='hermit')body=_visitorHermitHtml();
  else if(visitor.id==='alchemist')body=_visitorAlchemistHtml();
  document.getElementById('modal-content').innerHTML=`
    <h3>${visitor.icon} ${visitor.name}</h3>
    ${body}
    <div class="modal-btns" style="margin-top:12px">
      <button class="btn btn-gray" onclick="closeModal();_visitorLeave()">送客</button>
    </div>`;
  modal.classList.add('show');
}

//============ SECT SYSTEM ============
function buildingCost(key){
  const b=BUILDINGS[key];const lvl=game.sect.buildings[key]||0;
  // 宗门大阵：线性费用（baseCost + costStep * lvl）
  if(b.costStep!==undefined)return b.baseCost+b.costStep*lvl;
  return Math.floor(b.baseCost*Math.pow(b.costMul,lvl));
}
function upgradeBuilding(key){
  const b=BUILDINGS[key];
  const lvl=game.sect.buildings[key]||0;
  const maxLvl=b.maxLevel||10;
  if(lvl>=maxLvl){toast(b.name+'已满级');return}
  const cost=buildingCost(key);
  if(game.resources.spirit<cost){toast('灵石不足');return}
  game.resources.spirit-=cost;
  game.sect.buildings[key]=lvl+1;
  toast(b.name+'升至'+game.sect.buildings[key]+'级');
  saveGame();renderSect();
}

//============ 装备/法宝操作 ============
function getCharByIdx(idx){return idx==='player'?game.player:game.disciples[idx]}
// 根据 uid 在仓库中查找装备/法宝
function findEquipInWarehouse(uid){return game.warehouse.equipment.find(e=>e&&e.uid===uid)}
function findTreasureInWarehouse(uid){return game.warehouse.treasures.find(t=>t&&t.uid===uid)}
// 穿戴装备（从仓库到角色槽位）
function equipItem(idx,slot,uid,noDetail){
  const ch=getCharByIdx(idx);if(!ch)return;
  const eq=findEquipInWarehouse(uid);if(!eq){toast('装备不存在');return}
  if(eq.slot!==slot){toast('部位不符');return}
  // 若槽位已有装备，先卸下回仓库
  const old=ch.equipment[slot];
  ch.equipment[slot]=eq;
  game.warehouse.equipment=game.warehouse.equipment.filter(e=>e.uid!==uid);
  if(old)game.warehouse.equipment.push(old);
  saveGame();
  if(!noDetail)showCharDetail(idx);
}
// 卸下装备（回仓库）
function unequipItem(idx,slot,noDetail){
  const ch=getCharByIdx(idx);if(!ch)return;
  const eq=ch.equipment[slot];if(!eq)return;
  game.warehouse.equipment.push(eq);
  ch.equipment[slot]=null;
  saveGame();
  if(!noDetail)showCharDetail(idx);
}

  const ch=getCharByIdx(idx);if(!ch)return;
  const t=findTreasureInWarehouse(uid);if(!t){toast('法宝不存在');return}
  const old=ch.treasures[slotIdx];
  ch.treasures[slotIdx]=t;
  game.warehouse.treasures=game.warehouse.treasures.filter(x=>x.uid!==uid);
  if(old)game.warehouse.treasures.push(old);
  saveGame();showCharDetail(idx);
}
function unequipTreasure(idx,slotIdx){

  const t=ch.treasures[slotIdx];if(!t)return;

function craftEquipment(slot){
  if((game.sect.buildings.smithy||0)<1){toast('请先升级神兵阁至1级');return}
  const cost=craftCostOf(slot);
  if(game.resources.spirit<cost){toast('灵石不足');return}
  game.resources.spirit-=cost;
  const quality=randomEquipQuality();
  const eq=genEquipment(slot,quality);
  game.warehouse.equipment.push(eq);
  toast('打造成功：'+eq.name+'（'+EQUIP_QUALITY[quality].name+'）');
  saveGame();renderSmithy();

// 升级装备（根据 uid 在仓库或角色身上查找）
function upgradeEquipmentItem(uid){
  if((game.sect.buildings.smithy||0)<1){toast('请先升级神兵阁至1级');return}
  let eq=null;
  eq=game.warehouse.equipment.find(e=>e&&e.uid===uid);
  if(!eq){
    for(const ch of [game.player,...game.disciples]){
      for(const s of Object.keys(EQUIP_SLOTS)){if(ch.equipment[s]&&ch.equipment[s].uid===uid){eq=ch.equipment[s];break}}
      if(eq)break;
    }
  }
  if(!eq){toast('装备不存在');return}
  const maxLvl=EQUIP_QUALITY[eq.quality].maxLevel;
  if((eq.level||0)>=maxLvl){toast('已达品阶上限');return}
  const cost=upgradeCost(eq);
  if(game.resources.spirit<cost){toast('灵石不足');return}
  game.resources.spirit-=cost;
  eq.level=(eq.level||0)+1;
  toast(eq.name+'升至'+eq.level+'级');
  saveGame();renderSmithy();
}

  const eq=findEquipInWarehouse(uid);if(!eq){toast('装备不存在');return}

  game.resources.spirit+=price;
  game.warehouse.equipment=game.warehouse.equipment.filter(e=>e&&e.uid!==uid);

// 法宝合成：3 件同品阶法宝 → 1 件更高品阶法宝（随机）
const TREASURE_QUALITY_ORDER=['fine','rare','epic','legendary','mythic'];
function getNextTreasureQuality(q){
  const idx=TREASURE_QUALITY_ORDER.indexOf(q);
  if(idx<0||idx>=TREASURE_QUALITY_ORDER.length-1)return null;
  return TREASURE_QUALITY_ORDER[idx+1];
}
let _combineSelected=[]; // 选中的法宝 uid 列表
function toggleCombineSelect(uid){
  const idx=_combineSelected.indexOf(uid);
  if(idx>=0)_combineSelected.splice(idx,1);
  else{
    if(_combineSelected.length>=3)return;
    _combineSelected.push(uid);
  }
  renderTreasureCombine();
}
function combineTreasures(){
  if(_combineSelected.length<3){toast('请选择3件法宝');return}
  const trs=_combineSelected.map(uid=>findTreasureInWarehouse(uid)).filter(Boolean);
  if(trs.length<3){toast('法宝不存在');return}
  const q=TREASURES[trs[0].tid]?.quality;
  if(!q){toast('法宝数据异常');return}
  if(!trs.every(t=>TREASURES[t.tid]?.quality===q)){toast('必须选择同品阶法宝');return}
  const nextQ=getNextTreasureQuality(q);
  if(!nextQ){toast('神话品阶已达最高，无法继续合成');return}
  // 消耗 3 件
  for(const uid of _combineSelected){
    game.warehouse.treasures=game.warehouse.treasures.filter(t=>t.uid!==uid);
  }
  // 生成 1 件更高品阶的随机法宝
  const pool=Object.keys(TREASURES).filter(tid=>TREASURES[tid].quality===nextQ);
  const tid=pool[Math.floor(Math.random()*pool.length)];
  const newTr=genTreasure(tid);
  game.warehouse.treasures.push(newTr);
  const name=TREASURES[tid].name;
  toast('合成成功：'+name+'（'+EQUIP_QUALITY[nextQ].name+'）');
  _combineSelected=[];
  saveGame();renderTreasureCombine();
}
function renderTreasureCombine(){
  const el=document.getElementById('modal-content');
  const trs=game.warehouse.treasures||[];
  let html=`<h3>法宝合成 <span style="font-size:11px;color:var(--dim)">3件同品阶 → 1件更高品阶（随机）</span></h3>`;
  html+='<div style="display:flex;gap:6px;margin-bottom:10px">';
  const canCombine=_combineSelected.length===3;
  html+=`<button class="btn ${canCombine?'btn-gold':'btn-gray'}" ${canCombine?'':'disabled'} onclick="combineTreasures()">合成（${_combineSelected.length}/3）</button>`;
  html+=`<button class="btn btn-gray" onclick="_combineSelected=[];renderTreasureCombine()">清空</button>`;
  html+=`<button class="btn btn-gray" style="margin-left:auto" onclick="document.getElementById('modal').classList.remove('show');renderWarehouse()">关闭</button>`;
  html+='</div>';
  if(trs.length===0){
    html+='<p style="color:var(--dim);text-align:center;padding:20px">仓库无法宝</p>';
  }else{
    // 按品阶分组
    for(const q of TREASURE_QUALITY_ORDER){
      const group=trs.filter(t=>TREASURES[t.tid]?.quality===q);
      if(group.length===0)continue;
      const qc=EQUIP_QUALITY[q];
      const nextQ=getNextTreasureQuality(q);
      html+=`<div class="card" style="margin-bottom:8px"><div class="card-title" style="color:${qc.color}">${qc.name}品阶 ${nextQ?'→ '+EQUIP_QUALITY[nextQ].name:'（最高品阶）'}</div>`;
      for(const t of group){
        const td=TREASURES[t.tid];
        const selected=_combineSelected.includes(t.uid);
        html+=`<div class="attr-row" style="${selected?'background:rgba(167,139,250,.15)':''}">
          <span>${td.name} <span style="font-size:10px;color:var(--dim)">${td.desc}</span></span>
          <button class="btn ${selected?'btn-gold':'btn-gray'}" style="font-size:11px;padding:3px 8px" onclick="toggleCombineSelect('${t.uid}')">${selected?'已选':'选择'}</button>
        </div>`;
      }
      html+='</div>';
    }
  }
  el.innerHTML=html;
}

  _combineSelected=[];
  renderTreasureCombine();
  document.getElementById('modal').classList.add('show');
}
// 炼丹：每颗突破丹消耗灵草 = max(5, floor(20 * 0.85^炼丹房等级))
function herbCostPerPill(){
  const lvl=game.sect.buildings.alchemyRoom||0;
  return Math.max(5,Math.floor(20*Math.pow(0.85,lvl)));
}
function brewPill(kind,n){
  n=n||1;
  const lvl=game.sect.buildings.alchemyRoom||0;
  if(lvl<=0){toast('请先升级炼丹房');return}
  // 恢复丹
  if(RECOVERY_PILLS[kind]){
    const per=recHerbCost(kind);
    const cost=per*n;
    if(game.resources.herb<cost){toast('灵草不足（需要'+cost+'）');return}
    game.resources.herb-=cost;
    game.warehouse.recoveryPills[kind]=(game.warehouse.recoveryPills[kind]||0)+n;
    toast('炼制成功：'+RECOVERY_PILLS[kind].name+' ×'+n);
    saveGame();renderAlchemy();return;
  }
  // 突破丹
  const cost=herbCostPerPill()*n;
  if(game.resources.herb<cost){toast('灵草不足（需要'+cost+'）');return}
  game.resources.herb-=cost;
  game.warehouse.pills[kind]=(game.warehouse.pills[kind]||0)+n;
  toast('炼制成功：'+BREAKTHROUGH_PILLS[kind].name+' ×'+n);
  saveGame();renderAlchemy();
}

// 自动退出百鬼夜行结算：用户切换到其它界面时触发
// 百鬼夜行退出确认：标记位，避免弹窗确认后再次拦截
let _endlessExitConfirmed=false;
function showEndlessExitModal(toScreen){
  const html=`
    <h3>百鬼夜行进行中</h3>
    <p style="color:var(--dim);margin-bottom:16px">当前有未结束的百鬼夜行挑战，是否继续？</p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-gold" onclick="confirmEndlessExit(true)">继续挑战</button>
      <button class="btn btn-gray" onclick="confirmEndlessExit(false,'${toScreen}')">结算退出</button>
    </div>`;
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}
function confirmEndlessExit(keepGoing,toScreen){
  document.getElementById('modal').classList.remove('show');
  if(keepGoing)return; // 留在当前界面
  endEndlessRun('retreat');
  _endlessExitConfirmed=true;
  showScreen(toScreen);
}
function tryExitEndlessOnNavigate(toScreen){
  if(!game.endlessRun)return true;
  // 进入战斗界面：直接放行，不要触发撤退结算
  if(toScreen==='battle')return true;
  // 战斗中：直接结算（败北处理——但用户主动离开，按撤退算并保留奖励）
  if(game.battle && game.battle.isEndless){
    // 已经在结算界面 or 正在战斗：先让当前的 battle.onEnd 逻辑走完
    if(game.battle.over){
      // 结算按钮还没点，但用户已切换界面——直接结算
      endEndlessRun('retreat');
      return true;
    }
    // 战斗进行中——调用 retreat 触发结算
    retreat();
    return false; // 等结算界面出来后再导航，让用户看到结算
  }
  // 用户已在弹窗确认结算退出：放行
  if(_endlessExitConfirmed){_endlessExitConfirmed=false;return true}
  // 选角界面——用游戏风格弹窗确认
  showEndlessExitModal(toScreen);
  return false; // 拦截，等用户选择
}
function showScreen(name){
  // 任意切屏时先检查百鬼夜行退出
  if(game.endlessRun){
    const ok=tryExitEndlessOnNavigate(name);
    if(!ok)return; // 拦截导航
  }
  game.screen=name;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(name+'-screen').classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#'+name+'-screen .nav-btn').forEach(b=>{
    const m=b.getAttribute('onclick')||'';
    if(m.includes("'"+name+"'"))b.classList.add('active');
  });
  if(name==='hub')renderHub();
  if(name==='cultivation')renderCultivation();
  if(name==='realm')renderRealm();
  if(name==='disciples')renderDisciples();
  if(name==='sect')renderSect();
  if(name==='warehouse')renderWarehouse();
  if(name==='wiki')renderWiki();
  if(name==='save')renderSave();
}

function toggleSkill(idx,skKey){
  const char=idx==='player'?game.player:game.disciples[idx];
  if(!char)return;
  if(!char.equippedSkills)char.equippedSkills=[];
  const i=char.equippedSkills.indexOf(skKey);
  if(i>=0){char.equippedSkills.splice(i,1)}
  else{
    if(char.equippedSkills.length>=MAX_EQUIPPED){toast(`最多装备${MAX_EQUIPPED}个技能`);return}
    char.equippedSkills.push(skKey);
  }
  saveGame();
  showCharDetail(idx);
}
// 调整已装备技能的优先级：dir=-1 上移（优先级+1），dir=1 下移（优先级-1）
// 优先级由 equippedSkills 数组顺序决定：index 0 = 优先级1
function moveSkillPriority(idx,skKey,dir){
  const char=idx==='player'?game.player:game.disciples[idx];
  if(!char||!char.equippedSkills)return;
  const i=char.equippedSkills.indexOf(skKey);
  if(i<0)return;
  const j=i+dir;
  if(j<0||j>=char.equippedSkills.length)return;
  [char.equippedSkills[i],char.equippedSkills[j]]=[char.equippedSkills[j],char.equippedSkills[i]];
  saveGame();
  showCharDetail(idx);
}
// 渲染技能预设区块（操作区）：普攻常驻 → 已装备技能（优先级+↑↓+卸下）→ 未装备技能（装备）
function renderSkillPreset(char,idx){
  const idxArg=typeof idx==='number'?idx:`'${idx}'`;
  const normKey=PROFESSIONS[char.profession].norm;
  const rows=[];
  // 普攻（常驻）
  {
    const s=SKILLS[normKey];
    rows.push(`<div class="attr-row"><span style="font-weight:bold">${s.name}</span><span style="font-size:11px;color:var(--gold)">常驻</span></div>`);
  }
  // 已装备技能（按优先级1→2→3→4）
  char.equippedSkills.forEach((skKey,eqIdx)=>{
    const s=SKILLS[skKey];if(!s)return;
    const eqBtn=`<button class="btn btn-gray" style="padding:2px 8px;font-size:11px" onclick="event.stopPropagation();toggleSkill(${idxArg},'${skKey}')">卸下</button>`;
    const upBtn=eqIdx>0?
      `<button class="btn btn-gold" style="padding:2px 6px;font-size:11px" onclick="event.stopPropagation();moveSkillPriority(${idxArg},'${skKey}',-1)" title="提升优先级">↑</button>`:'';
    const downBtn=eqIdx<char.equippedSkills.length-1?
      `<button class="btn btn-gold" style="padding:2px 6px;font-size:11px" onclick="event.stopPropagation();moveSkillPriority(${idxArg},'${skKey}',1)" title="降低优先级">↓</button>`:'';
    rows.push(`<div class="attr-row"><span style="font-weight:bold">${s.name}${gradeTag(s.grade)}</span><span style="font-size:11px"><span style="color:var(--jade)">优先级${eqIdx+1}</span> ${upBtn}${downBtn} ${eqBtn}</span></div>`);
  });
  // 未装备技能
  char.learnedSkills.forEach(skKey=>{
    if(skKey===normKey||char.equippedSkills.includes(skKey))return;
    const s=SKILLS[skKey];if(!s)return;
    const eqBtn=char.equippedSkills.length>=MAX_EQUIPPED?
      `<button class="btn btn-gray" style="padding:2px 8px;font-size:11px;opacity:0.5" disabled>已满</button>`:
      `<button class="btn btn-gold" style="padding:2px 8px;font-size:11px" onclick="event.stopPropagation();toggleSkill(${idxArg},'${skKey}')">装备</button>`;
    rows.push(`<div class="attr-row"><span style="font-weight:bold">${s.name}${gradeTag(s.grade)}</span><span style="font-size:11px;color:var(--dim)">未装备 ${eqBtn}</span></div>`);
  });
  return rows.join('');
}
// 渲染技能介绍区块（纯说明，无操作按钮）：所有习得技能按学习顺序列出
function renderSkillInfo(char){
  const normKey=PROFESSIONS[char.profession].norm;

    const s=SKILLS[skKey];if(!s)return'';
    const desc=getSkillDesc(skKey);
    return `<div class="attr-row"><span style="font-weight:bold">${s.name}${gradeTag(s.grade)}</span><span style="font-size:11px;color:var(--dim);text-align:right;max-width:60%">${desc}</span></div>`;

}

const STAT_CN={hp:'生命',mp:'法力',atk:'攻击',def:'防御',spd:'速度',critRate:'暴击',critDmg:'暴伤'};
let _smithyTab='craft';
function openSmithy(){_smithyTab='craft';renderSmithy();document.getElementById('modal').classList.add('show')}
function switchSmithyTab(t){_smithyTab=t;renderSmithy()}
function equipStatStr(eq){
  const s=getEquipStats(eq);
  let str=Object.entries(s).filter(([k,v])=>v>0).map(([k,v])=>`${STAT_CN[k]||k}+${v}`).join(' ');
  if(Array.isArray(eq.affixes)&&eq.affixes.length>0){
    // 合并同类型词条的数值后显示
    const merged={};
    for(const a of eq.affixes){merged[a.stat]=(merged[a.stat]||{name:a.name,val:0});merged[a.stat].val+=a.val}
    str+=' <span style="color:#a78bfa">['+Object.values(merged).map(a=>a.name+'+'+a.val).join(' ')+']</span>';
  }
  return str;
}
function renderSmithy(){

function buySkillBook(sk){
  const price=SKILL_BOOK_PRICES[sk];
  if(game.resources.spirit<price){toast('灵石不足');return}
  game.resources.spirit-=price;
  game.warehouse.skillBooks[sk]=(game.warehouse.skillBooks[sk]||0)+1;
  toast('购入 '+SKILLS[sk].name+' 技能书');
  saveGame();
  renderLibrary();
  renderRes('sect-res');
}
function buyPill(key){
  const nextRealm=Math.min(game.player.bigRealm+1,REALMS.length-1);
  const price=PILL_SHOP_PRICE[nextRealm]||20;
  if(game.resources.spirit<price){toast('灵石不足');return}
  game.resources.spirit-=price;
  game.warehouse.pills[key]=(game.warehouse.pills[key]||0)+1;
  toast('购入 '+BREAKTHROUGH_PILLS[key].name);
  saveGame();
  renderLibrary();
  renderRes('sect-res');
}
let _useBookSkill=null;
let _useBookFromWarehouse=false;
function useSkillBook(sk,fromWarehouse){
  _useBookSkill=sk;
  _useBookFromWarehouse=!!fromWarehouse;
  const s=SKILLS[sk];
  const elem=sk.split('_')[0];
  const isProfBook=PROFESSION_BOOK_SKILLS.includes(sk);
  const chars=[{slot:'player',char:game.player},...game.disciples.map((d,i)=>({slot:i,char:d}))];
  const eligible=chars.filter(({char})=>{
    if(!char)return false;
    if(char.learnedSkills&&char.learnedSkills.includes(sk))return false;
    if(isProfBook){
      // 职业技能书：仅对应职业可学
      return char.profession===elem;
    }
    const sr=char.spiritRoot;
    return sr==='pseudo'||sr===elem;
  });
  let html=`<h3>使用技能书 - ${s.name}${gradeTag(s.grade)}</h3>
    <p style="color:var(--dim);margin-bottom:10px">选择一名弟子学习${isProfBook?'（仅对应职业可学）':'（仅灵根匹配或伪灵根可学）'}</p>`;
  if(eligible.length===0){
    html+='<p style="color:var(--dim);text-align:center;padding:16px">没有可学习该技能的弟子</p>';
  }else{
    for(const {slot,char} of eligible){
      const rootName=SPIRIT_ROOTS[char.spiritRoot]?.name||'未知';
      const rootColor=SPIRIT_ROOTS[char.spiritRoot]?.color;
      html+=`<div class="recruit-card" style="cursor:pointer" onclick="learnFromBook('${sk}','${slot}')">
        <div class="recruit-name">${char.name}</div>
        <div class="recruit-prof" style="font-size:11px">${PROFESSIONS[char.profession]?.name||''} · ${realmStr(char)} · <span style="color:${rootColor}">${rootName}</span></div>
      </div>`;
    }
  }
  html+='<div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button class="btn btn-gray" onclick="returnFromUseBook()">返回</button></div>';
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}
function returnFromUseBook(){
  if(_useBookFromWarehouse){
    document.getElementById('modal').classList.remove('show');
    renderWarehouse();
  }else{
    renderLibrary();
  }
}
function learnFromBook(sk,slot){
  const char=slot==='player'?game.player:game.disciples[slot];
  if(!char)return;
  if(!Array.isArray(char.learnedSkills))char.learnedSkills=getCharSkills(char.profession).learned;
  if(char.learnedSkills.includes(sk)){toast('已学过该技能');return}
  char.learnedSkills.push(sk);
  if(!Array.isArray(char.equippedSkills))char.equippedSkills=getCharSkills(char.profession).equipped;
  if(char.equippedSkills.length<MAX_EQUIPPED)char.equippedSkills.push(sk);
  game.warehouse.skillBooks[sk]=(game.warehouse.skillBooks[sk]||0)-1;
  if(game.warehouse.skillBooks[sk]<=0)delete game.warehouse.skillBooks[sk];
  toast((char.name||'主角')+'学会了 '+SKILLS[sk].name);
  saveGame();
  returnFromUseBook();
}

    for(const s in EQUIP_SLOTS){const b=EQUIP_BASE[s];const bs=Object.entries(b).map(([k,v])=>`${STAT_CN[k]||k}+${v}`).join('，');html+=`<div class="attr-row"><span>${EQUIP_SLOTS[s].icon} ${EQUIP_SLOTS[s].name}</span><span style="font-size:11px;color:var(--dim)">${bs}</span></div>`}
    html+='<div style="font-size:11px;color:var(--dim);margin-top:6px">最终属性 = 基础 × 品阶倍率 × (1+0.5×等级)</div>';
    html+='</div>';
  }else if(tab==='treasure'){
    html+='<div class="card-title">法宝系统</div>';
    html+='<div class="card" style="margin-bottom:10px"><div class="card-title">规则</div>';
    html+='<div class="attr-row"><span>槽位</span><span style="font-size:11px;color:var(--dim)">每角色 4 个法宝槽位</span></div>';
    html+='<div class="attr-row"><span>属性类型</span><span style="font-size:11px;color:var(--dim)">百分比加成（攻击+5%、生命+10% 等），在所有固定加成之后乘算</span></div>';
    html+='<div class="attr-row"><span>升级</span><span style="font-size:11px;color:var(--dim)">不可升级，属性固定</span></div>';
    html+='<div class="attr-row"><span>获取</span><span style="font-size:11px;color:var(--dim)">仅金丹及以上 BOSS 关卡概率掉落（秘境约15%~35%，无尽约28%），品阶随秘境难度提升</span></div>';
    html+='</div>';
    html+='<div class="card" style="margin-bottom:10px"><div class="card-title">法宝图鉴</div>';
    const byQ={};
    for(const tid in TREASURES){const t=TREASURES[tid];(byQ[t.quality]=byQ[t.quality]||[]).push(tid)}
    for(const q of ['fine','rare','epic','legendary','mythic']){
      if(!byQ[q])continue;
      const c=EQUIP_QUALITY[q];
      html+=`<div style="margin-top:6px;font-weight:bold;color:${c.color}">${c.name}</div>`;
      for(const tid of byQ[q]){const t=TREASURES[tid];html+=`<div class="attr-row"><span style="font-weight:bold">${t.name}</span><span style="font-size:11px;color:var(--dim)">${t.desc}</span></div>`}
    }
    html+='</div>';
  }
  el.innerHTML=html;
}

//============ TOAST ============
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500)}

//============ GAME LOOP ============
let lastTime=0;
let herbAccum=0;
// 逻辑循环：setInterval 保证移动端 rAF 被限制时修炼/草药/战斗逻辑仍稳定运行
let _logicLast=performance.now();
let _saveAccum=0;
setInterval(()=>{
  try{
    const now=performance.now();
    const dt=Math.min((now-_logicLast)/1000,1/15);
    _logicLast=now;
    // Cultivation (all selected chars gain cult points, capped at current stage max)
    for(const slot of game.cultivateSlots){
      const ch=getCharFromSlot(slot);
      if(ch){
        if(typeof ch.cultPoints!=='number'||isNaN(ch.cultPoints))ch.cultPoints=0;
        ch.cultPoints=Math.min(ch.cultPoints+getCultSpeed(ch)*dt,cultUpgradeCost(ch));
      }
    }
    // Herb production
    const herbLvl=game.sect.buildings.herbGarden||0;
    if(herbLvl>0){herbAccum+=herbLvl*dt/60;if(herbAccum>=1){game.resources.herb+=Math.floor(herbAccum);herbAccum%=1}}
    // Battle logic
    if(game.battle&&!game.battle.over){game.battle.update(dt)}
    // Auto-save (every 30s)
    _saveAccum+=dt;
    if(_saveAccum>=30){_saveAccum=0;saveGame()}
  }catch(e){console.error('logic tick error',e)}
},100);
// 渲染循环：仅负责画面渲染与 UI 刷新
function gameLoop(time){
  try{
    const dt=Math.min((time-lastTime)/1000,1/15);
    lastTime=time;
    // Battle render
    if(game.battle&&!game.battle.over){
      const canvas=document.getElementById('battle-canvas');
      if(canvas){const ctx=canvas.getContext('2d');game.battle.render(ctx,canvas.width,canvas.height)}
    }
    // Update UI
    if(game.screen==='cultivation'){updateCultBar()}
  }catch(e){console.error('render tick error',e)}
  requestAnimationFrame(gameLoop);
}
function updateCultBar(){
  if(game.screen!=='cultivation')return;
  const bars=document.querySelectorAll('#cult-content .cult-char-bar');
  bars.forEach(el=>{
    const slot=el.dataset.slot;
    const char=getCharFromSlot(slot);
    if(!char)return;
    const cost=cultUpgradeCost(char);
    const fill=el.querySelector('.cult-fill');
    const text=el.querySelector('.cult-text');
    if(fill)fill.style.width=Math.min(100,char.cultPoints/cost*100)+'%';
    if(text)text.textContent=fmt(char.cultPoints)+'/'+fmt(cost);
  });
}

//============ INIT ============
function resizeCanvas(){
  const c=document.getElementById('battle-canvas');
  c.width=window.innerWidth;c.height=window.innerHeight;
}
window.addEventListener('resize',resizeCanvas);
window.addEventListener('orientationchange',()=>setTimeout(resizeCanvas,100));

function init(){
  resizeCanvas();
  // 集火：画布点击选择目标
  document.getElementById('battle-canvas').addEventListener('click',onBattleCanvasClick);
  preloadAIImgs();
  // 优先从 URL hash 读存档（跨 origin/设备可用），其次 localStorage，最后新游戏
  const hasSave=loadFromUrlHash()||loadGame();
  if(!hasSave){
    // 新游戏：创建2名初始弟子
    game.disciples=[createDisciple(),createDisciple()];
    game.teamSlots=[0,1];
    saveGame();
  }else{
    // 加载存档后：如果弟子列表为空，补2名初始弟子（兼容空存档）
    if(!Array.isArray(game.disciples)||game.disciples.length===0){
      game.disciples=[createDisciple(),createDisciple()];
      game.teamSlots=[0,1];
      saveGame();
    }
  }
  showScreen('hub');
  requestAnimationFrame(gameLoop);
}
window.addEventListener('load',init);
</script>
