function chooseSkill(k){
  const char=getCharFromSlot(_skillChoiceSlot);
  if(!char)return;
  // 境界防御：职业技能（含大招）必须达到对应大境界才能学习
  const req=getProfSkillRealm(char.profession,k);
  if(req>=0 && req>(char.bigRealm||0)){toast('境界不足，无法学习该技能');return}
  if(!Array.isArray(char.learnedSkills))char.learnedSkills=getCharSkills(char.profession).learned;
  if(!char.learnedSkills.includes(k))char.learnedSkills.push(k);
  // Auto-equip if not capped at 4 (norm is never equipped as a slot)
  const norm=PROFESSIONS[char.profession]?.norm;
  if(!Array.isArray(char.equippedSkills))char.equippedSkills=getCharSkills(char.profession).equipped;
  if(k!==norm && char.equippedSkills.length<MAX_EQUIPPED && !char.equippedSkills.includes(k))char.equippedSkills.push(k);
  toast((char.name||'主角')+'学会了 '+SKILLS[k]?.name);
  document.getElementById('modal').classList.remove('show');
  saveGame();
  renderCultivation();
}

//============ 战斗有效属性计算（统一从 c.statuses 读取所有状态） ============
function getEffectiveStats(c){
  let a=c.atk,d=c.def,s=c.spd,cr=c.critRate;
  if(c.statuses){
    for(const type in c.statuses){
      const st=c.statuses[type];
      if(!st||st.stacks<=0)continue;
      const cfg=STATUS_CONFIG[type];if(!cfg)continue;
      // 固定值叠加型（brave/ironwall/weak/shatter）
      if(cfg.atkFlat!==undefined)a+=cfg.atkFlat*st.stacks;
      if(cfg.defFlat!==undefined)d+=cfg.defFlat*st.stacks;
      // 每层百分比叠加型（cold/swift）
      if(cfg.spdPctPer!==undefined)s*=1+cfg.spdPctPer*st.stacks;
      // 单次百分比型（atkUp/defUp/spdUp/critUp/atkDown/spdDown，maxStacks=1，val 由技能给）
      if(cfg.atkPct!==undefined)a*=(1+(st.val||0)*st.stacks);
      if(cfg.defPct!==undefined)d*=(1+(st.val||0)*st.stacks);
      if(cfg.spdPct!==undefined)s*=(1+(st.val||0)*st.stacks);
      if(cfg.critPct!==undefined)cr+=(st.val||0)*100*st.stacks;
    }
  }
  a=Math.max(0,a);d=Math.max(0,d);s=Math.max(0.1,s);
  return{atk:a,def:d,spd:s,critRate:cr};
}
// 是否处于眩晕状态（跳过行动）
function isStunned(c){return c.statuses&&c.statuses.stun&&c.statuses.stun.stacks>0}
// 计算战斗中有效速度（CTB 累积用，包含所有速度修正）
function getEffectiveSpd(c){
  let s=c.spd;
  if(c.statuses){
    for(const type in c.statuses){
      const st=c.statuses[type];if(!st||st.stacks<=0)continue;
      const cfg=STATUS_CONFIG[type];if(!cfg)continue;
      if(cfg.spdPctPer!==undefined)s*=1+cfg.spdPctPer*st.stacks;
      if(cfg.spdPct!==undefined)s*=(1+(st.val||0)*st.stacks);
    }
  }
  return Math.max(0.1,s);
}

//============ BATTLE SYSTEM ============
class Battle{
  constructor(allies,enemies,realmId,floor,opts){
    this.allies=allies.map(c=>this.initChar(c,true));
    this.enemies=enemies.map(c=>this.initChar(c,false));
    this.all=this.allies.concat(this.enemies);
    this.log=[];
    this.stats={allyDmg:0,allyHeal:0,enemyDmg:0,enemyHeal:0};this.logExpanded=false;
    this.over=false;this.winner=null;
    this.actionDelay=0;this.dmgNums=[];this.effects=[];this.actions=0;
    this.realmId=realmId;this.floor=floor;
    this.turnCount=0;
    this.mpTickTimer=0; // 每 10 秒全员恢复 25 MP 计时器
    this.isEndless=opts&&opts.isEndless; // 百鬼夜行模式
    for(const c of this.all){
      const a=calcAttrs(c);
      c.maxHp=a.hp;c.maxMp=a.mp;c.atk=a.atk;c.def=a.def;c.spd=a.spd;c.critRate=a.critRate;c.critDmg=a.critDmg;
      c.hp=a.hp;c.mp=a.mp;c.alive=true;c.ctb=0;c.cd={};c.statuses=emptyStatuses();c.anim={type:'idle',t:0};
      c.dmgDealt=0;c.healDone=0;
      // 无尽模式：从 charState 恢复 HP/MP（上一轮结算后的状态）
      if(this.isEndless&&c.isAlly&&c.endlessId){
        const st=game.endlessRun.charState[c.endlessId];
        if(st){c.hp=Math.min(c.maxHp,st.hp);c.mp=Math.min(c.maxMp,st.mp)}
      }
    }
    this.addLog('战斗开始!');
  }
  initChar(c,isAlly){
    const ch={...c,isAlly,portraitIdx:c.portraitIdx||0};
    if(c.isMonster){
      // 统一使用 getMonsterSkillKeys 获取怪物技能（与百科同源）
      const allKeys=getMonsterSkillKeys(c);
      ch.skillKeys=allKeys.filter(k=>SKILLS[k]&&k!==c.monsterSkill);
      ch.normKey=c.monsterSkill;
    }else{
      // Human: profession norm is always available; equipped skills fill the 4 battle slots
      ch.skillKeys=[];
      ch.normKey=PROFESSIONS[c.profession].norm;
      const eq=Array.isArray(c.equippedSkills)?c.equippedSkills:getCharSkills(c.profession).equipped;
      for(const sk of eq)if(SKILLS[sk]&&sk!==ch.normKey)ch.skillKeys.push(sk);
      // 无尽模式：保留 endlessId 用于阵亡追踪
      if(c.endlessId)ch.endlessId=c.endlessId;
    }
    return ch;
  }
  update(dt){
    if(this.over)return;
    const spd=game.battleSpeed||1;
    if(this.actionDelay>0){this.actionDelay-=dt*spd;this.updateAnims(dt);return}
    // 每 10 秒所有存活角色恢复 25 法力（战斗续航）
    this.mpTickTimer+=dt*spd;
    if(this.mpTickTimer>=10){
      this.mpTickTimer-=10;
      for(const c of this.all){
        if(!c.alive||c.maxMp<=0)continue;
        const before=c.mp;
        c.mp=Math.min(c.maxMp,c.mp+25);
        const gained=c.mp-before;
        if(gained>0)this.dmgNums.push({char:c,val:gained,type:'mpHeal',t:1});
      }
      this.addLog('灵气涌动，全队恢复25法力');
    }
    // Fill all CTB gauges + tick status DoTs
    for(const c of this.all){
      if(!c.alive)continue;
      // 有效速度：统一从 c.statuses 读取所有速度修正
      const effSpd=getEffectiveSpd(c);
      c.ctb+=effSpd*dt*5*spd;
      // Tick 所有时间制状态
      for(const type in c.statuses){this.tickStatus(c,type,dt)}
    }
    // Check if DoT killed everyone
    this.checkEnd();
    if(this.over)return;
    // Find ready characters, fastest first
    const ready=this.all.filter(c=>c.alive&&c.ctb>=100).sort((a,b)=>b.ctb-a.ctb);
    if(ready.length>0){
      const c=ready[0];c.ctb=0;
      this.execute(c);this.checkEnd();
      this.actionDelay=.3;
    }
    this.updateAnims(dt);
  }
  updateAnims(dt){for(const c of this.all){c.anim.t-=dt*2;if(c.anim.t<=0&&c.anim.type!=='die'){c.anim.type='idle';c.anim.t=0}}}

  // 时间制状态结算：统一遍历，hpDmg/hpHeal/mpHeal 由 cfg.tickInterval 触发，其他状态仅倒计持续时间
  tickStatus(c,type,dt){
    const st=c.statuses?c.statuses[type]:null;
    if(!st||st.stacks<=0)return;
    const cfg=STATUS_CONFIG[type];if(!cfg)return;
    st.durAcc-=dt;
    if(st.durAcc<=0){st.stacks=0;st.tickAcc=0;st.val=0;return}
    if(cfg.tickInterval)st.tickAcc+=dt;
    if(cfg.tickInterval&&st.tickAcc>=cfg.tickInterval){
      st.tickAcc-=cfg.tickInterval;
      // 愈合：恢复生命
      if(cfg.hpHeal){
        const hpHeal=cfg.hpHeal*st.stacks;
        c.hp=Math.min(c.maxHp,c.hp+hpHeal);
        c.healDone=(c.healDone||0)+hpHeal;
        if(c.isAlly)this.stats.allyHeal+=hpHeal;else this.stats.enemyHeal+=hpHeal;
        this.addLog(getCharName(c)+'受到'+cfg.name+'效果，恢复'+hpHeal+'点生命');
        this.dmgNums.push({char:c,val:hpHeal,type:'heal',t:1});
        this.effects.push({type:'heal',char:c,color:cfg.color,t:1});
      }
      // 调息：恢复法力
      if(cfg.mpHeal){
        const mpHeal=cfg.mpHeal*st.stacks;
        c.mp=Math.min(c.maxMp,c.mp+mpHeal);
        this.addLog(getCharName(c)+'受到'+cfg.name+'效果，恢复'+mpHeal+'点法力');
        this.dmgNums.push({char:c,val:mpHeal,type:'mpHeal',t:1});
      }
      // 伤害型状态（中毒/燃烧）
      if(cfg.hpDmg){
        const hpDmg=cfg.hpDmg*st.stacks;
        c.hp=Math.max(0,c.hp-hpDmg);
        this.addLog(getCharName(c)+'受到'+cfg.name+'侵蚀，损失'+hpDmg+'点生命');
        this.dmgNums.push({char:c,val:hpDmg,type:'dot',color:cfg.dmgColor||cfg.color,t:1});
        if(type==='poison'&&cfg.mpDmg){
          const mpDmg=cfg.mpDmg*st.stacks;c.mp=Math.max(0,c.mp-mpDmg);
          this.addLog(getCharName(c)+'中毒侵蚀法力，损失'+mpDmg+'点法力');
          this.dmgNums.push({char:c,val:mpDmg,type:'dot',color:'#3b82f6',t:1});
        }
        if(st.source&&st.source.alive){st.source.dmgDealt+=hpDmg;if(st.source.isAlly)this.stats.allyDmg+=hpDmg;else this.stats.enemyDmg+=hpDmg}
        else{if(c.isAlly)this.stats.enemyDmg+=hpDmg;else this.stats.allyDmg+=hpDmg}
        if(c.hp<=0){c.alive=false;c.anim={type:'die',t:1};this.addLog(getCharName(c)+'被'+cfg.name+'侵蚀倒下!')}
      }
    }
  }
  // 统一施加状态：duration 必须由技能指定；val/stacks 可选（百分比型由技能 val 提供具体数值）
  applyStatus(c,type,duration,source,val,stacks){
    if(!c.statuses)c.statuses=emptyStatuses();
    const st=c.statuses[type];
    const cfg=STATUS_CONFIG[type];if(!cfg)return;
    if(!(duration>0))return; // 持续时间必须由技能指定
    const newStacks=stacks||1;
    if(st.stacks<cfg.maxStacks)st.stacks=Math.min(cfg.maxStacks,st.stacks+newStacks);
    st.durAcc=duration;
    if(cfg.tickInterval&&st.tickAcc>cfg.tickInterval)st.tickAcc=0;
    if(val!==undefined)st.val=val; // 百分比型状态记录技能提供的具体数值
    if(source)st.source=source;
    this.addLog(getCharName(c)+(cfg.positive?'获得':'陷入')+cfg.name+(cfg.maxStacks>1?('('+st.stacks+'层)'):'')+'!')
  }
  // 驱散：清除目标1种随机负面状态的全部层数，返回被驱散的状态类型(无则null)
  dispelNegative(c){
    if(!c.statuses)return null;
    const negs=['poison','burn','cold','weak','shatter','atkDown','spdDown','stun'];
    const active=negs.filter(t=>c.statuses[t]&&c.statuses[t].stacks>0);
    if(active.length===0)return null;
    const pick=active[Math.floor(Math.random()*active.length)];
    const st=c.statuses[pick];
    st.stacks=0;st.tickAcc=0;st.durAcc=0;st.val=0;st.source=null;
    return pick;
  }
  execute(c){
    this.actions++;
    const enemies=c.isAlly?this.enemies:this.allies;
    const allies=c.isAlly?this.allies:this.enemies;
    const alive=enemies.filter(e=>e.alive);
    if(alive.length===0)return;
    // ---- Stun check（统一走 c.statuses.stun）----
    if(isStunned(c)){
      // 眩晕只跳过行动，CD 仍正常递减
      for(const k in c.cd)if(c.cd[k]>0)c.cd[k]--;
      this.addLog(`${getCharName(c)}被控制，跳过行动`);
      c.statuses.stun.stacks=0;c.statuses.stun.durAcc=0;
      return;
    }
    // ---- Get effective stats (apply buffs + statuses) ----
    const es=getEffectiveStats(c);
    const atk=es.atk,def=es.def,spd=es.spd,critRate=es.critRate;
    const getEff=t=>getEffectiveStats(t);
    // 候选技能 = 装备技能（按优先级顺序）+ 普攻兜底
    // c.skillKeys 即为 equippedSkills，数组顺序 = 优先级 1>2>3>4
    // 按优先级从高到低遍历，第一个满足法力和冷却条件的技能即被选用
    // 普攻(mpCost:0,cd:0)永远满足条件，故永远不会卡死
    let pickedKey=null,sk=null;
    for(const skk of (c.skillKeys||[])){
      const s=SKILLS[skk];
      if(s&&c.mp>=s.mpCost&&(c.cd[skk]||0)<=0){pickedKey=skk;sk=s;break}
    }
    // 装备技能全部不可用（MP不足/CD中）时，回退普攻
    if(!sk){pickedKey=c.normKey;sk=SKILLS[c.normKey]}
    // 消耗法力与设置冷却
    c.mp-=sk.mpCost;c.cd[pickedKey]=sk.cd;
    c.anim={type:'attack',t:1};
    // ---- MP Restore self ----
    if(sk.mpRestoreSelf){c.mp=Math.min(c.maxMp,c.mp+sk.mpRestoreSelf);this.addLog(`${getCharName(c)}恢复${sk.mpRestoreSelf}法力`)}
    // Target selection
    let targets=[];
    if(sk.dmg){
      if(sk.target==='all'){targets=alive}
      else if(sk.target==='randomN'){
        const n=Math.min(sk.randomCount||2,alive.length);
        const pool=[...alive];
        for(let i=0;i<n;i++){const idx=Math.floor(Math.random()*pool.length);targets.push(pool.splice(idx,1)[0])}
      }
      else{targets=[alive.reduce((m,e)=>e.hp/e.maxHp<m.hp/m.maxHp?m:e)]}
    }
    // ---- 施加 self/team 类型的状态（伤害前生效，让本次伤害可享受增益）----
    if(sk.statuses){
      for(const st of sk.statuses){
        if(st.target==='self'){this.applyStatus(c,st.type,st.dur,c,st.val,st.stacks)}
        else if(st.target==='team'){for(const a of allies.filter(x=>x.alive))this.applyStatus(a,st.type,st.dur,c,st.val,st.stacks)}
      }
    }
    // Damage (with multi-hit)
    const hits=sk.hits||1;
    // 攻击属性：技能五行前缀优先，否则回退到攻击者灵根（怪物技能无五行前缀时使用其灵根）
    const atkElem=getSkillElem(pickedKey)||(ELEM_SET.has(c.spiritRoot)?c.spiritRoot:null);
    // 字幕/光束颜色：技能五行优先，否则使用攻击者灵根色（与灵根颜色统一）
    const atkColor=atkElem?SPIRIT_ROOTS[atkElem].color:getSpiritColor(c);
    for(let h=0;h<hits;h++){
      for(const t of targets){
        if(!t.alive)continue;
        const teff=getEff(t);
        const crit=Math.random()*100<critRate;
        let dmg=atk*sk.dmg*(crit?c.critDmg/100:1);
        dmg*=Math.max(.3,1-teff.def/(teff.def+200));
        dmg=Math.floor(dmg*(.9+Math.random()*.2));
        // 五行克制
        const emul=elemCounterMul(atkElem,t.spiritRoot);
        let elemNote='';
        if(emul>1){dmg=Math.floor(dmg*emul);elemNote='(克制!)'}
        else if(emul<1){dmg=Math.floor(dmg*emul);elemNote='(被克制)'}
        t.hp=Math.max(0,t.hp-dmg);
        c.dmgDealt+=dmg;if(c.isAlly)this.stats.allyDmg+=dmg;else this.stats.enemyDmg+=dmg;
        this.dmgNums.push({char:t,val:dmg,type:'dmg',t:1,crit,color:atkColor});
        t.anim={type:'hit',t:1,crit};
        // AOE/随机多目标技能 → 在每个目标位置生成扩散波纹；单体技能 → 直线光束
        if(sk.target==='all'||sk.target==='randomN'){
          this.effects.push({type:'aoeBurst',char:t,color:atkColor,t:1});
        }else{
          this.effects.push({type:'beam',from:c,to:t,color:atkColor,t:1});
        }
        this.addLog(`${getCharName(c)}使用${sk.name}${hits>1?'('+(h+1)+'/'+hits+')':''}${crit?'(暴击!)':''}${elemNote}对${getCharName(t)}造成${dmg}伤害`);
        if(sk.lifesteal){const heal=Math.floor(dmg*sk.lifesteal);c.hp=Math.min(c.maxHp,c.hp+heal);c.healDone+=heal;if(c.isAlly)this.stats.allyHeal+=heal;else this.stats.enemyHeal+=heal;this.dmgNums.push({char:c,val:heal,type:'heal',t:1})}
        // ---- 反伤：目标有反伤状态时，将部分伤害反弹给攻击者 ----
        if(t.statuses&&t.statuses.reflect&&t.statuses.reflect.stacks>0){
          const rfCfg=STATUS_CONFIG.reflect;
          const rfPct=t.statuses.reflect.val||0;
          if(rfPct>0){
            const rfDmg=Math.floor(dmg*rfPct);
            c.hp=Math.max(0,c.hp-rfDmg);
            c.dmgDealt+=0;
            if(c.isAlly)this.stats.enemyDmg+=rfDmg;else this.stats.allyDmg+=rfDmg;
            this.dmgNums.push({char:c,val:rfDmg,type:'dmg',t:1,color:rfCfg.color});
            this.addLog(`${getCharName(t)}反弹${rfDmg}伤害给${getCharName(c)}!`);
            if(c.hp<=0){c.alive=false;c.anim={type:'die',t:1};this.addLog(`${getCharName(c)}被反伤击败!`)}
          }
        }
        if(t.hp<=0){t.alive=false;t.anim={type:'die',t:1};this.addLog(`${getCharName(t)}被击败!`)}
        // ---- 施加 hit 类型的状态（伤害命中后）----
        if(sk.statuses){
          for(const st of sk.statuses){
            if(st.target!=='hit')continue;
            if(st.chance!==undefined&&Math.random()>st.chance)continue;
            this.applyStatus(t,st.type,st.dur,c,st.val,st.stacks);
          }
        }
      }
    }
    // Heal
    if(sk.heal){
      let healTargets;
      if(sk.healTarget==='all'){healTargets=allies.filter(a=>a.alive)}
      else{healTargets=[allies.filter(a=>a.alive).reduce((m,a)=>a.hp/a.maxHp<m.hp/m.maxHp?m:a)]}
      // 木系治疗以施法者生命上限为基准；其他治疗仍以攻击力为基准
      const healBase=(sk.elem==='wood')?c.maxHp:atk;
      for(const t of healTargets){const h=Math.floor(healBase*sk.heal);t.hp=Math.min(t.maxHp,t.hp+h);c.healDone+=h;if(c.isAlly)this.stats.allyHeal+=h;else this.stats.enemyHeal+=h;this.dmgNums.push({char:t,val:h,type:'heal',t:1});this.effects.push({type:'heal',char:t,color:'#4ade80',t:1});this.addLog(`${getCharName(t)}恢复${h}生命`)}
      // 驱散：高阶治疗技能附带，清除每位治疗目标1种随机负面状态的全部层数
      if(sk.dispel){
        for(const t of healTargets){
          const d=this.dispelNegative(t);
          if(d)this.addLog(`${getCharName(t)}的${STATUS_CONFIG[d].name}被驱散!`)
        }
      }
    }
    // Team MP restore
    if(sk.teamMpRestore){for(const a of allies.filter(x=>x.alive)){a.mp=Math.min(a.maxMp,a.mp+sk.teamMpRestore)}this.addLog(`我方全队恢复${sk.teamMpRestore}法力!`)}
    // Reduce CDs
    for(const k in c.cd)if(c.cd[k]>0)c.cd[k]--;
    this.turnCount++;
  }
  checkEnd(){
    const a=this.allies.some(c=>c.alive),e=this.enemies.some(c=>c.alive);
    if(!a||!e){this.over=true;this.winner=a?'allies':'enemies';this.onEnd()}
  }
  onEnd(){
    const win=this.winner==='allies';
    const battle=this;
    setTimeout(()=>{
      const el=document.getElementById('battle-result');
      const title=document.getElementById('result-title');
      const tabsEl=document.getElementById('result-tabs');
      const contentEl=document.getElementById('result-content');
      const btn=document.getElementById('result-btn');
      title.className=win?'win':'lose';
      title.textContent=win?'胜利!':'败北';
      let rewardInfo='';
      // ============ 百鬼夜行模式 ============
      if(this.isEndless){
        const run=game.endlessRun;
        const isBossRound=run.round%5===0;
        if(win){
          // 1. 标记阵亡角色
          for(const c of this.allies){
            if(!c.alive&&c.endlessId)run.deadChars.add(c.endlessId);
          }
          // 2. 存活角色恢复 50% HP/MP，保存状态
          for(const c of this.allies){
            if(c.alive&&c.endlessId){
              run.charState[c.endlessId]={
                hp:Math.min(c.maxHp,c.hp+Math.floor(c.maxHp*.5)),
                mp:Math.min(c.maxMp,c.mp+Math.floor(c.maxMp*.5))
              };
            }
          }
          // 3. 即时发放奖励
          const spirit=30+run.round*5;
          const herb=isBossRound?10+run.round:3+run.round;
          game.resources.spirit+=spirit;
          game.resources.herb+=herb;
          run.rewards.spirit+=spirit;
          run.rewards.herb+=herb;
          let pillDropInfo='';
          if(isBossRound){
            const allPills=Object.keys(BREAKTHROUGH_PILLS);
            for(let i=0;i<2;i++){
              const pk=pick(allPills);
              game.warehouse.pills[pk]=(game.warehouse.pills[pk]||0)+1;
              run.rewards.pills[pk]=(run.rewards.pills[pk]||0)+1;
              pillDropInfo+=`<div class="result-row"><span style="color:${BREAKTHROUGH_PILLS[pk].color}">${BREAKTHROUGH_PILLS[pk].name}</span><span style="color:var(--jade)">+1</span></div>`;
            }
          }
          // 每10层（BOSS层）掉落五行技能书（优先匹配玩家队伍可学灵根）
          let bookDropInfo='';
          if(run.round%10===0){
            const bookPool=[];
            const roots=new Set([game.player.spiritRoot,...game.disciples.map(d=>d.spiritRoot)].filter(Boolean));
            for(const e in SPIRIT_SKILLS){
              if(roots.has(e)||roots.has('pseudo'))bookPool.push(...SPIRIT_SKILLS[e]);
            }
            // 若无匹配灵根，则从全部五行技能中抽取
            const pool=bookPool.length>0?bookPool:Object.values(SPIRIT_SKILLS).flat();
            const dropCount=1+(Math.random()<.4?1:0); // 1~2 本
            for(let i=0;i<dropCount;i++){
              const sk=pick(pool);
              game.warehouse.skillBooks[sk]=(game.warehouse.skillBooks[sk]||0)+1;
              run.rewards.skillBooks=(run.rewards.skillBooks||{});
              run.rewards.skillBooks[sk]=(run.rewards.skillBooks[sk]||0)+1;
              const s=SKILLS[sk];
              bookDropInfo+=`<div class="result-row"><span style="color:${SPIRIT_ROOTS[s.elem]?.color||'#fff'}">${s.name}${gradeTag(s.grade)} 技能书</span><span style="color:var(--jade)">+1</span></div>`;
            }
          }
          rewardInfo=`<div class="result-row"><span>第 ${run.round} 轮 ${isBossRound?'(BOSS战)':''}</span><span style="color:var(--gold)">胜利</span></div>
            <div class="result-row"><span>💎 灵石</span><span style="color:var(--jade)">+${spirit}</span></div>
            <div class="result-row"><span>🌿 灵草</span><span style="color:var(--jade)">+${herb}</span></div>
            ${pillDropInfo}
            ${bookDropInfo}
            <div style="font-size:11px;color:var(--dim);margin-top:6px">阵亡角色：${run.deadChars.size} 人</div>`;
          // 4. 判断是否全灭
          const totalChars=1+game.disciples.length;
          if(run.deadChars.size>=totalChars){
            title.textContent='全员阵亡';
            btn.textContent='结算';btn.onclick=()=>endEndlessRun('defeat');
          }else{
            run.round++;
            run.pillUsed=new Set();
            btn.textContent='下一轮';btn.onclick=()=>{exitBattle();showEndlessSelect()};
          }
        }else{
          // 败北：本轮全员阵亡，标记所有出战角色阵亡
          for(const c of this.allies){
            if(c.endlessId)run.deadChars.add(c.endlessId);
          }
          title.textContent='败北';
          const totalChars=1+game.disciples.length;
          if(run.deadChars.size>=totalChars){
            btn.textContent='结算';btn.onclick=()=>endEndlessRun('defeat');
          }else{
            run.round++;
            run.pillUsed=new Set();
            btn.textContent='下一轮';btn.onclick=()=>{exitBattle();showEndlessSelect()};
          }
          rewardInfo=`<div class="result-row"><span>第 ${run.round} 轮</span><span style="color:var(--red)">败北</span></div>
            <div style="font-size:11px;color:var(--dim)">本轮出战角色全部阵亡</div>`;
        }
      }else{
        // ============ 普通秘境模式 ============
        if(win){
          const sr=SECRET_REALMS.find(r=>r.id===this.realmId);
          const isBossFloor=this.floor>=sr.floors;
          const spirit=sr.rewards.spirit*(1+.2*(this.floor-1));
          const herb=isBossFloor?sr.rewards.herb*2:sr.rewards.herb*.3*this.floor;
          game.resources.spirit+=Math.floor(spirit);
          game.resources.herb+=Math.floor(herb);
          const pillDrops=sr.pillDrops||[];
          let pillDropInfo='';
          if(pillDrops.length>0){
            const dropCount=isBossFloor?3+Math.floor(Math.random()*3):1;
            for(let i=0;i<dropCount;i++){
              const pillKey=pick(pillDrops);
              game.warehouse.pills[pillKey]=(game.warehouse.pills[pillKey]||0)+1;
              const p=BREAKTHROUGH_PILLS[pillKey];
              pillDropInfo+=`<div class="result-row"><span style="color:${p.color}">${p.name}</span><span style="color:var(--jade)">+1</span></div>`;
            }
          }
          rewardInfo=`<div class="result-row"><span>💎 灵石</span><span style="color:var(--jade)">+${Math.floor(spirit)}</span></div>
            <div class="result-row"><span>🌿 灵草</span><span style="color:var(--jade)">+${Math.floor(herb)}</span></div>`
            +pillDropInfo;
          // 所有参战角色获得修为（与灵石奖励挂钩，随楼层递增）
          const cultGain=Math.floor(spirit*0.3);
          for(const c of this.allies){
            if(c.isPlayer){game.player.cultPoints=(game.player.cultPoints||0)+cultGain}
            else if(c.id){const d=game.disciples.find(x=>x.id===c.id);if(d)d.cultPoints=(d.cultPoints||0)+cultGain}
          }
          rewardInfo+=`<div class="result-row"><span>🧘 全队修为</span><span style="color:var(--jade)">+${cultGain}</span></div>`;
          if(isBossFloor){game.realmProgress[this.realmId].cleared=true;rewardInfo+=`<div class="result-row"><span style="color:var(--gold)">秘境通关!</span><span></span></div>`}
          else{game.realmProgress[this.realmId].floor=this.floor+1}
          btn.textContent='继续';btn.onclick=()=>{exitBattle();if(!isBossFloor)enterRealmFloor(this.realmId,this.floor+1)};
        }else{
          const loss=Math.floor(game.resources.spirit*.1);
          game.resources.spirit-=loss;
          rewardInfo=`<div class="result-row"><span>💎 灵石损失</span><span style="color:var(--red)">-${loss}</span></div>`;
          btn.textContent='返回';btn.onclick=exitBattle;
        }
      }
      // 标签页
      const tabs=[{id:'summary',name:'概览'},{id:'stats',name:'战报'},{id:'chars',name:'角色'}];
      tabsEl.innerHTML=tabs.map(t=>`<button class="result-tab${t.id==='summary'?' active':''}" data-rtab="${t.id}">${t.name}</button>`).join('');
      tabsEl.querySelectorAll('.result-tab').forEach(b=>{
        b.onclick=()=>{
          tabsEl.querySelectorAll('.result-tab').forEach(x=>x.classList.remove('active'));
          b.classList.add('active');
          battle.renderResultTab(b.dataset.rtab,contentEl,rewardInfo);
        };
      });
      battle.renderResultTab('summary',contentEl,rewardInfo);
      saveGame();
      el.classList.add('show');
    },800);
  }

  addLog(msg){this.log.push(msg);if(this.log.length>80)this.log.shift();this.renderLog();this.renderStats()}
  renderLog(){const el=document.getElementById('battle-log');if(!el)return;const lines=this.logExpanded?this.log:this.log.slice(-4);el.innerHTML=lines.map(l=>`<div class="log-line">${l}</div>`).join('')+(this.logExpanded?'':'<div class="log-hint">点击查看全部</div>');el.onclick=()=>this.toggleLog()}

  renderStatsDetail(){

    const rows=[];
    const maxDmg=Math.max(1,...this.allies.map(c=>c.dmgDealt||0),...this.enemies.map(c=>c.dmgDealt||0));
    const fmtChar=(c)=>{
      const dmgPct=Math.round((c.dmgDealt||0)/maxDmg*100);
      const name=getCharName(c);

        <span style="color:#f87171;font-size:10px;width:42px;text-align:right">${c.dmgDealt||0}</span>
        <div style="flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden"><div style="width:${dmgPct}%;height:100%;background:#f87171;border-radius:3px"></div></div>

  toggleLog(){this.logExpanded=!this.logExpanded;const el=document.getElementById('battle-log');if(el)el.classList.toggle('expanded',this.logExpanded);this.renderLog()}
  getTimeline(){
    return this.all.filter(c=>c.alive).sort((a,b)=>b.ctb-a.ctb).slice(0,8);
  }
  render(ctx,W,H){
    ctx.clearRect(0,0,W,H);
    // Background - drawn canvas
    drawBgPortrait(ctx,0,0,W,H);
    // Detect orientation
    const isPortrait=H>W;
    if(isPortrait){
      // Portrait: allies bottom, enemies top, stacked vertically, 3x3 each side
      const slotW=Math.min(W*.22,80),slotH=slotW*1.3;
      const gap=12;
      const totalCols=3;
      const enemiesStartY=H*.15;
      const alliesStartY=H*.55;
      const leftStart=(W-slotW*totalCols-gap*(totalCols-1))/2;
      // Enemies (top)
      for(let i=0;i<this.enemies.length;i++){
        const c=this.enemies[i];if(!c.alive&&c.anim.type!=='die')continue;
        const col=i%totalCols,row=Math.floor(i/totalCols);
        const x=leftStart+col*(slotW+gap);
        const y=enemiesStartY+row*(slotH+gap);
        c._x=x+slotW/2;c._y=y+slotH/2;
        this.drawChar(ctx,c,x,y,slotW,slotH);
      }
      // Allies (bottom)
      for(let i=0;i<this.allies.length;i++){
        const c=this.allies[i];if(!c.alive&&c.anim.type!=='die')continue;
        const col=i%totalCols,row=Math.floor(i/totalCols);
        const x=leftStart+col*(slotW+gap);
        const y=alliesStartY+row*(slotH+gap);
        c._x=x+slotW/2;c._y=y+slotH/2;
        this.drawChar(ctx,c,x,y,slotW,slotH);
      }
    }else{
      // Landscape: allies left, enemies right
      const slotW=Math.min(W*.12,90),slotH=slotW*1.5;
      const gap=14;
      const leftStart=W*.05,rightStart=W*.95-slotW*3-gap*2;
      const startY=H*.2,rowH=slotH+gap;
      for(let side=0;side<2;side++){
        const team=side===0?this.allies:this.enemies;
        for(let i=0;i<team.length;i++){
          const c=team[i];if(!c.alive&&c.anim.type!=='die')continue;
          const col=i%3,row=Math.floor(i/3);
          const x=(side===0?leftStart:rightStart)+col*(slotW+gap);
          const y=startY+row*rowH;
          c._x=x+slotW/2;c._y=y+slotH/2;
          this.drawChar(ctx,c,x,y,slotW,slotH);
        }
      }
    }
    // Effects (attack beams + heals)
    for(let i=this.effects.length-1;i>=0;i--){
      const e=this.effects[i];e.t-=.03;
      if(e.t<=0){this.effects.splice(i,1);continue}
      const alpha=Math.min(1,e.t*1.5);
      if(e.type==='beam'&&e.from&&e.to){
        const fx=e.from._x||0,fy=e.from._y||0,tx=e.to._x||0,ty=e.to._y||0;
        const prog=1-e.t; // 0→1 travel
        const px=fx+(tx-fx)*prog,py=fy+(ty-fy)*prog;
        // Beam trail from caster to current projectile position
        ctx.save();
        ctx.globalAlpha=alpha*.7;
        ctx.strokeStyle=e.color;ctx.lineWidth=4;ctx.lineCap='round';
        ctx.shadowColor=e.color;ctx.shadowBlur=12;
        ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(px,py);ctx.stroke();
        // Bright core
        ctx.globalAlpha=alpha;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(px,py);ctx.stroke();
        // Projectile head
        ctx.globalAlpha=alpha;ctx.fillStyle=e.color;ctx.shadowBlur=16;
        ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }else if(e.type==='heal'&&e.char){
        const cx=e.char._x||0,cy=e.char._y||0;
        ctx.save();ctx.globalAlpha=alpha;
        ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=14;
        // Rising plus signs
        for(let k=0;k<3;k++){
          const off=(1-e.t)*60+k*16;
          const px=cx+Math.sin(k*2+e.t*5)*12,py=cy-off;
          ctx.font='bold 18px sans-serif';ctx.textAlign='center';
          ctx.fillText('+',px,py);
        }
        // Ground glow ring
        ctx.globalAlpha=alpha*.4;
        ctx.beginPath();ctx.ellipse(cx,cy+20,30*(1-e.t*.5),8,0,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }else if(e.type==='aoeBurst'&&e.char){
        // AOE 扩散波纹：从目标位置发出多圈同心环 + 中心爆发光
        const cx=e.char._x||0,cy=e.char._y||0;
        const prog=1-e.t; // 0→1
        ctx.save();
        // 多层同心扩散环（3 圈，相位错开）
        for(let k=0;k<3;k++){
          const ph=(prog*1.3+k/3)%1;
          const r=ph*55;
          const a=(1-ph)*alpha*.9;
          if(r<2)continue;
          ctx.globalAlpha=a;
          ctx.strokeStyle=e.color;ctx.lineWidth=2.5-k*0.4;
          ctx.shadowColor=e.color;ctx.shadowBlur=12;
          ctx.beginPath();
          ctx.ellipse(cx,cy+8,r,r*0.42,0,0,Math.PI*2);
          ctx.stroke();
        }
        // 中心爆发光晕
        ctx.globalAlpha=alpha*(1-prog*.6);
        const grad=ctx.createRadialGradient(cx,cy+8,0,cx,cy+8,28);
        grad.addColorStop(0,e.color);
        grad.addColorStop(0.5,e.color.replace('rgb','rgba').replace(')',',0.4)').replace('#','#'));
        grad.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=20;
        ctx.beginPath();ctx.arc(cx,cy+8,8+prog*8,0,Math.PI*2);ctx.fill();
        // 中心亮点
        ctx.globalAlpha=alpha;
        ctx.fillStyle='#fff';ctx.shadowBlur=10;
        ctx.beginPath();ctx.arc(cx,cy+8,3,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }
    }
    // Damage numbers
    for(let i=this.dmgNums.length-1;i>=0;i--){
      const d=this.dmgNums[i];d.t-=.02;
      if(d.t<=0){this.dmgNums.splice(i,1);continue}
      const dx=d.char._x||0,dy=d.char._y||0;
      const y=dy-30*(1-d.t);const alpha=d.t;
      ctx.textAlign='center';
      const txt=(d.type==='heal'||d.type==='mpHeal'?'+':'-')+d.val;
      ctx.font=`bold ${d.crit?22:16}px sans-serif`;
      ctx.lineWidth=3;ctx.lineJoin='round';ctx.strokeStyle=`rgba(0,0,0,${Math.min(1,alpha*.9)})`;ctx.strokeText(txt,dx,y);
      let fillColor;
      if(d.type==='heal')fillColor=`rgba(74,222,128,${alpha})`;
      else if(d.type==='mpHeal')fillColor=`rgba(59,130,246,${alpha})`;
      else if(d.type==='dot'&&d.color)fillColor=d.color;
      else if(d.type==='dmg'&&d.color)fillColor=d.color;
      else fillColor=`rgba(255,90,90,${alpha})`;
      ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=fillColor;ctx.fillText(txt,dx,y);ctx.restore();
      if(d.crit){ctx.fillStyle=`rgba(255,230,80,${alpha})`;ctx.font='bold 12px sans-serif';ctx.lineWidth=2;ctx.strokeText('暴击!',dx,y+14);ctx.fillText('暴击!',dx,y+14)}
    }
    // CTB timeline update
    this.renderTimeline();
  }
  drawChar(ctx,c,x,y,w,h){
    let ox=0,oy=0,alpha=1;
    if(c.anim.type==='hit'&&c.anim.t>0){
      const t=c.anim.t; // 1→0
      if(c.anim.crit){
        // 暴击固定抖动：固定方向+固定幅度，随时间衰减
        ox=4*t;
        oy=2*t;
      }
      alpha=.4+t*.6;
    }
    if(c.anim.type==='die'){alpha=Math.max(0,c.anim.t)}
    const imgKey=getPortraitKey(c);
    ctx.save();
    ctx.globalAlpha=alpha;
    const fx=x+ox,fy=y+oy;
    // Portrait drawn directly on canvas
    drawPortrait(ctx,fx,fy,w,h,imgKey,c.bigRealm||0,c.portraitIdx||0);
    // Border
    ctx.strokeStyle=c.isAlly?'#d4af37':'#c0392b';
    ctx.lineWidth=2;ctx.strokeRect(fx,fy,w,h);
    ctx.restore();
    // HP/MP bars — 移到立绘内部底部（半透明背景），避免被下一排角色遮挡
    if(c.alive||c.anim.type==='die'){
      const bw=w,bh=3;
      const barH=bh*2+1;
      const by=y+h-barH-1; // 立绘内部底部
      ctx.fillStyle='rgba(10,10,25,0.7)';ctx.fillRect(x,by,bw,barH);
      // HP
      const hpPct=c.hp/c.maxHp;
      ctx.fillStyle='#e74c3c';ctx.fillRect(x,by,bw*hpPct,bh);
      // MP
      if(c.maxMp>0){const mpPct=c.mp/c.maxMp;ctx.fillStyle='#3498db';ctx.fillRect(x,by+bh+1,bw*mpPct,bh)}
      // Name
      ctx.fillStyle='#fff';ctx.font='8px serif';ctx.textAlign='center';
      ctx.fillText(getCharName(c),x+w/2,y-2);
      // CTB gauge — 立绘外部紧贴底部
      if(c.alive){
        const ctby=y+h+2;
        ctx.fillStyle='#1a1a2e';ctx.fillRect(x,ctby,bw,2);
        ctx.fillStyle='#f39c12';ctx.fillRect(x,ctby,bw*Math.min(1,c.ctb/100),2);
      }
      // Status icons — 统一遍历所有状态（poison/burn/cold/brave/ironwall/weak/shatter/swift/regen/meditate/atkUp/defUp/spdUp/critUp/atkDown/spdDown/stun）
      if(c.statuses){
        const sts=[];
        for(const k in c.statuses){if(c.statuses[k].stacks>0)sts.push({key:k,n:c.statuses[k].stacks})}
        if(sts.length>0){
          const r=7,gap=4;
          const totalW=sts.length*(r*2+gap)-gap;
          let sx=x+w/2-totalW/2+r;
          const cy=y-12;
          for(const st of sts){
            const cfg=STATUS_CONFIG[st.key];
            if(st.key==='cold'){
              // 雪花：6 条主臂 + 分支
              ctx.strokeStyle=cfg.color;ctx.lineWidth=1.4;ctx.lineCap='round';
              for(let i=0;i<6;i++){
                const a=i*Math.PI/3;
                const ex=sx+Math.cos(a)*r,ey=cy+Math.sin(a)*r;
                ctx.beginPath();ctx.moveTo(sx,cy);ctx.lineTo(ex,ey);ctx.stroke();
                const bx=sx+Math.cos(a)*r*0.55,by=cy+Math.sin(a)*r*0.55,br=r*0.38;
                ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(a+Math.PI/3)*br,by+Math.sin(a+Math.PI/3)*br);ctx.stroke();
                ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(a-Math.PI/3)*br,by+Math.sin(a-Math.PI/3)*br);ctx.stroke();
              }
            }else if(st.key==='burn'){
              // 火苗：外焰 + 内焰
              ctx.fillStyle=cfg.dmgColor||cfg.color;
              ctx.beginPath();
              ctx.moveTo(sx,cy-r);
              ctx.bezierCurveTo(sx+r*0.85,cy-r*0.25,sx+r*0.6,cy+r*0.85,sx,cy+r);
              ctx.bezierCurveTo(sx-r*0.6,cy+r*0.85,sx-r*0.85,cy-r*0.25,sx,cy-r);
              ctx.fill();
              ctx.fillStyle='#fff7cc';
              ctx.beginPath();
              ctx.moveTo(sx,cy-r*0.55);
              ctx.bezierCurveTo(sx+r*0.45,cy-r*0.1,sx+r*0.3,cy+r*0.45,sx,cy+r*0.55);
              ctx.bezierCurveTo(sx-r*0.3,cy+r*0.45,sx-r*0.45,cy-r*0.1,sx,cy-r*0.55);
              ctx.fill();
            }else if(st.key==='poison'){
              // 骷髅：颅骨 + 双眼 + 牙齿
              ctx.fillStyle=cfg.color;
              ctx.beginPath();ctx.arc(sx,cy-r*0.15,r*0.9,0,Math.PI*2);ctx.fill();
              ctx.fillStyle='#0a3d1a';
              ctx.beginPath();ctx.arc(sx-r*0.32,cy-r*0.1,r*0.2,0,Math.PI*2);ctx.arc(sx+r*0.32,cy-r*0.1,r*0.2,0,Math.PI*2);ctx.fill();
              ctx.fillRect(sx-r*0.3,cy+r*0.35,r*0.6,r*0.28);
              ctx.fillStyle=cfg.color;
              ctx.fillRect(sx-r*0.1,cy+r*0.35,r*0.04,r*0.28);
              ctx.fillRect(sx+r*0.06,cy+r*0.35,r*0.04,r*0.28);
            }else if(st.key==='brave'){
              // 剑刃：纵向刀身 + 横向护手 + 柄
              ctx.fillStyle=cfg.color;
              ctx.beginPath();
              ctx.moveTo(sx,cy-r);
              ctx.lineTo(sx+r*0.3,cy-r*0.2);
              ctx.lineTo(sx+r*0.3,cy+r*0.4);
              ctx.lineTo(sx-r*0.3,cy+r*0.4);
              ctx.lineTo(sx-r*0.3,cy-r*0.2);
              ctx.closePath();ctx.fill();
              ctx.fillRect(sx-r*0.6,cy+r*0.4,r*1.2,r*0.18);
              ctx.fillRect(sx-r*0.12,cy+r*0.55,r*0.24,r*0.35);
            }else if(st.key==='ironwall'){
              // 盾牌：盾面 + 内十字
              ctx.fillStyle=cfg.color;
              ctx.beginPath();
              ctx.moveTo(sx,cy-r);
              ctx.lineTo(sx+r*0.7,cy-r*0.5);
              ctx.lineTo(sx+r*0.7,cy+r*0.2);
              ctx.quadraticCurveTo(sx+r*0.5,cy+r,sx,cy+r);
              ctx.quadraticCurveTo(sx-r*0.5,cy+r,sx-r*0.7,cy+r*0.2);
              ctx.lineTo(sx-r*0.7,cy-r*0.5);
              ctx.closePath();ctx.fill();
              ctx.strokeStyle='#37474f';ctx.lineWidth=1.2;
              ctx.beginPath();ctx.moveTo(sx,cy-r*0.5);ctx.lineTo(sx,cy+r*0.6);
              ctx.moveTo(sx-r*0.4,cy+r*0.05);ctx.lineTo(sx+r*0.4,cy+r*0.05);
              ctx.stroke();
            }else if(st.key==='weak'){
              // 虚弱：向下箭头（红色衰减意象）
              ctx.fillStyle=cfg.color;
              ctx.beginPath();
              ctx.moveTo(sx,cy+r);
              ctx.lineTo(sx+r*0.7,cy-r*0.1);
              ctx.lineTo(sx+r*0.35,cy-r*0.1);
              ctx.lineTo(sx+r*0.35,cy-r);
              ctx.lineTo(sx-r*0.35,cy-r);
              ctx.lineTo(sx-r*0.35,cy-r*0.1);
              ctx.lineTo(sx-r*0.7,cy-r*0.1);
              ctx.closePath();ctx.fill();
            }else if(st.key==='shatter'){
              // 破甲：盾形裂纹（多段折线裂痕）
              ctx.fillStyle=cfg.color;
              ctx.beginPath();
              ctx.moveTo(sx,cy-r);
              ctx.lineTo(sx+r*0.6,cy-r*0.5);
              ctx.lineTo(sx+r*0.6,cy+r*0.2);
              ctx.quadraticCurveTo(sx+r*0.45,cy+r,sx,cy+r);
              ctx.quadraticCurveTo(sx-r*0.45,cy+r,sx-r*0.6,cy+r*0.2);
              ctx.lineTo(sx-r*0.6,cy-r*0.5);
              ctx.closePath();ctx.fill();
              ctx.strokeStyle='#3e2723';ctx.lineWidth=1.3;ctx.lineCap='round';
              ctx.beginPath();
              ctx.moveTo(sx-r*0.3,cy-r*0.4);ctx.lineTo(sx-r*0.05,cy);ctx.lineTo(sx-r*0.2,cy+r*0.4);
              ctx.moveTo(sx-r*0.05,cy);ctx.lineTo(sx+r*0.35,cy+r*0.2);
              ctx.stroke();
            }else if(st.key==='swift'){
              // 迅捷：双翼/风迹（两条弧线 + 短尾迹）
              ctx.strokeStyle=cfg.color;ctx.lineWidth=1.6;ctx.lineCap='round';
              ctx.beginPath();
              ctx.moveTo(sx-r*0.9,cy);ctx.quadraticCurveTo(sx-r*0.2,cy-r*0.8,sx+r*0.7,cy-r*0.4);
              ctx.moveTo(sx-r*0.9,cy+r*0.2);ctx.quadraticCurveTo(sx-r*0.2,cy-r*0.6,sx+r*0.7,cy-r*0.2);
              ctx.moveTo(sx-r*0.9,cy+r*0.4);ctx.quadraticCurveTo(sx-r*0.2,cy-r*0.4,sx+r*0.7,cy);
              ctx.stroke();
            }else if(st.key==='regen'||st.key==='meditate'){
              // 愈合(红)/调息(蓝)：爱心 — 两圆 + 三角底
              ctx.fillStyle=cfg.color;
              const hr=r*0.95;
              ctx.beginPath();
              ctx.arc(sx-hr*0.45,cy-hr*0.15,hr*0.45,0,Math.PI*2);
              ctx.arc(sx+hr*0.45,cy-hr*0.15,hr*0.45,0,Math.PI*2);
              ctx.moveTo(sx-hr*0.88,cy-hr*0.05);
              ctx.lineTo(sx,cy+hr*0.85);
              ctx.lineTo(sx+hr*0.88,cy-hr*0.05);
              ctx.closePath();
              ctx.fill();
              // 高光
              ctx.fillStyle='rgba(255,255,255,0.45)';
              ctx.beginPath();ctx.arc(sx-hr*0.3,cy-hr*0.3,hr*0.12,0,Math.PI*2);ctx.fill();
            }else if(st.key==='atkUp'||st.key==='atkDown'||st.key==='defUp'||st.key==='defDown'||st.key==='spdUp'||st.key==='spdDown'||st.key==='critUp'){
              // 百分比型增益/减益：上下双三角箭头
              const isUp=cfg.atkPct>0||cfg.defPct>0||cfg.spdPct>0||cfg.critPct>0;
              ctx.fillStyle=cfg.color;
              if(isUp){
                // 向上箭头（增益）
                ctx.beginPath();
                ctx.moveTo(sx,cy-r);
                ctx.lineTo(sx+r*0.8,cy+r*0.1);
                ctx.lineTo(sx+r*0.35,cy+r*0.1);
                ctx.lineTo(sx+r*0.35,cy+r);
                ctx.lineTo(sx-r*0.35,cy+r);
                ctx.lineTo(sx-r*0.35,cy+r*0.1);
                ctx.lineTo(sx-r*0.8,cy+r*0.1);
                ctx.closePath();ctx.fill();
              }else{
                // 向下箭头（减益）
                ctx.beginPath();
                ctx.moveTo(sx,cy+r);
                ctx.lineTo(sx+r*0.8,cy-r*0.1);
                ctx.lineTo(sx+r*0.35,cy-r*0.1);
                ctx.lineTo(sx+r*0.35,cy-r);
                ctx.lineTo(sx-r*0.35,cy-r);
                ctx.lineTo(sx-r*0.35,cy-r*0.1);
                ctx.lineTo(sx-r*0.8,cy-r*0.1);
                ctx.closePath();ctx.fill();
              }
            }else if(st.key==='stun'){
              // 眩晕：旋转闪电符号（Z 形）
              ctx.strokeStyle=cfg.color;ctx.lineWidth=1.6;ctx.lineCap='round';ctx.lineJoin='round';
              ctx.beginPath();
              ctx.moveTo(sx-r*0.5,cy-r*0.7);
              ctx.lineTo(sx+r*0.3,cy-r*0.2);
              ctx.lineTo(sx-r*0.2,cy+r*0.15);
              ctx.lineTo(sx+r*0.5,cy+r*0.7);
              ctx.stroke();
            }
            // 层数徽章（右下角白字黑描边）
            ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.lineWidth=2;ctx.strokeStyle='rgba(0,0,0,0.85)';
            ctx.fillStyle='#fff';
            ctx.strokeText(st.n,sx+r*0.95,cy+r*0.95);
            ctx.fillText(st.n,sx+r*0.95,cy+r*0.95);
            ctx.textBaseline='alphabetic';
            sx+=r*2+gap;
          }
        }
      }
    }
    ctx.textAlign='left';
  }
  renderTimeline(){
    const el=document.getElementById('ctb-bar');
    if(!el)return;
    const tl=this.getTimeline();
    let html='';
    for(let i=0;i<tl.length;i++){
      const c=tl[i];
      const imgKey=getPortraitKey(c);
      const border=c.isAlly?'#d4af37':'#c0392b';
      html+=`<div class="ctb-slot" style="border-color:${border};background:${ctbBg(imgKey)}">`;
      html+=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px">${ctbIcon(imgKey)}</div>`;
      html+=`<div class="ctb-num">${Math.floor(c.ctb)}</div></div>`;
      if(i===0)html+='<span class="ctb-arrow">▶</span>';
    }
    el.innerHTML=html;
  }
}

//============ SECRET REALM ============
function enterRealm(realmId){
  const sr=SECRET_REALMS.find(r=>r.id===realmId);
  if(game.player.bigRealm<sr.realmReq){toast('境界不足，需要'+REALMS[sr.realmReq]);return}
  game.currentRealmId=realmId;
  const prog=game.realmProgress[realmId];
  enterRealmFloor(realmId,prog.floor);
}
function enterRealmFloor(realmId,floor){
  const sr=SECRET_REALMS.find(r=>r.id===realmId);
  if(floor>sr.floors){toast('已通关');return}
  const team=getTeamChars();
  if(team.length===0){toast('需要至少1名角色');return}
  // Generate enemies
  const pBig=game.player.bigRealm;
  const numEn=Math.min(3+Math.floor(floor/2),6);
  const enemies=[];
  const isBoss=floor>=sr.floors;
  if(isBoss){
    const bossList=sr.bosses||(sr.boss?[sr.boss]:[]);
    const numBoss=Math.min(bossList.length,3);
    for(let i=0;i<numBoss;i++)enemies.push(createMonster(bossList[i],floor,pBig,sr.realmReq));
    const minionSlots=6-numBoss;
    for(let i=0;i<Math.min(2,minionSlots);i++)enemies.push(createMonster(pick(sr.monsters),floor,pBig,sr.realmReq))
  }else{for(let i=0;i<numEn;i++)enemies.push(createMonster(pick(sr.monsters),floor,pBig,sr.realmReq))}
  game.battle=new Battle(team,enemies,realmId,floor);
  showScreen('battle');
}
function retreat(){
  if(!game.battle)return;
  if(game.battle.isEndless){
    // 百鬼夜行：主动撤退 = 结束本次挑战，保留已获得奖励
    endEndlessRun('retreat');
    return;
  }
  game.battle.over=true;game.battle.winner='enemies';
  game.battle.onEnd();
}
function toggleSpeed(){
  const speeds=[1,2,4];const idx=(speeds.indexOf(game.battleSpeed)+1)%speeds.length;
  game.battleSpeed=speeds[idx];
  document.getElementById('speed-btn').textContent=game.battleSpeed+'x';
}
function exitBattle(){
  document.getElementById('battle-result').classList.remove('show');
  game.battle=null;
  showScreen('realm');
}

//============ 百鬼夜行（无尽挑战） ============
// 获取全部可出战角色（主角 + 弟子），并附加 endlessId
function getAllEndlessChars(){
  const chars=[{id:'player',char:createPlayer()}];
  game.disciples.forEach((d,i)=>chars.push({id:String(i),char:d}));
  return chars;
}
function startEndlessRun(){
  if(game.endlessRun){toast('已有进行中的百鬼夜行');return}
  const allChars=getAllEndlessChars();
  if(allChars.length===0){toast('没有可出战角色');return}
  // 初始化：全员满状态
  const charState={};
  for(const {id,char} of allChars){
    const a=calcAttrs(char);
    charState[id]={hp:a.hp,mp:a.mp};
  }
  game.endlessRun={
    round:1,
    deadChars:new Set(),
    charState,
    pillUsed:new Set(), // 本轮已使用恢复丹的角色 endlessId
    rewards:{spirit:0,herb:0,pills:{},skillBooks:{}}
  };
  showEndlessSelect();
}
// 角色选择界面（在秘境内容区渲染）
let endlessSelected=[];
function showEndlessSelect(){
  const run=game.endlessRun;
  if(!run)return;
  renderRes('realm-res');
  const allChars=getAllEndlessChars();
  const aliveChars=allChars.filter(({id})=>!run.deadChars.has(id));
  // 若存活不足 1 人，直接结束
  if(aliveChars.length===0){endEndlessRun('defeat');return}
  // 限制选择不超过 6 人，且不超过存活人数
  const maxSel=Math.min(6,aliveChars.length);
  // 清理已选列表中阵亡或超出的角色
  endlessSelected=endlessSelected.filter(id=>aliveChars.some(c=>c.id===id)).slice(0,maxSel);
  const isBoss=run.round%5===0;
  const bossIdx=Math.floor(run.round/5)-1;
  const bossName=isBoss?MONSTERS[ENDLESS_BOSSES[bossIdx%ENDLESS_BOSSES.length]].name:'—';
  let html=`<div style="padding:8px">
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="color:var(--gold);font-size:15px;font-weight:bold">👹 百鬼夜行 · 第 ${run.round} 轮</span>
        <span style="font-size:11px;color:var(--dim)">阵亡 ${run.deadChars.size}/${allChars.length} 人</span>
      </div>
      <div style="font-size:12px;color:var(--text)">
        ${isBoss?`<span style="color:var(--red)">⚠ BOSS战：${bossName}</span>`:'<span style="color:var(--jade)">小怪战</span>'}
        &nbsp;|&nbsp; 怪物小境界 +${run.round}
        &nbsp;|&nbsp; 已获 💎${run.rewards.spirit} 🌿${run.rewards.herb}
      </div>
      <div style="font-size:11px;color:var(--dim);margin-top:4px">选择最多 ${maxSel} 名存活角色出战（阵亡角色本次挑战不可再上场）</div>
    </div>`;
  // 角色卡片网格
  html+='<div class="disc-list" style="display:grid;grid-template-columns:1fr 1fr;gap:6px">';
  for(const {id,char} of allChars){
    const dead=run.deadChars.has(id);
    const sel=endlessSelected.includes(id);
    const st=run.charState[id];
    const a=calcAttrs(char);
    const hpPct=st?Math.floor(st.hp/a.hp*100):100;
    const mpPct=st?Math.floor(st.mp/a.mp*100):100;
    const gendSym=(char.gender||'m')==='m'?'♂':'♀';
    const usedPill=!dead&&run.pillUsed.has(id);
    // 恢复丹按钮（仅存活且本轮未用过的角色显示）
    let pillBtns='';
    if(!dead&&!usedPill){
      const parts=[];
      for(const pk in RECOVERY_PILLS){
        const pp=RECOVERY_PILLS[pk];
        const have=game.warehouse.recoveryPills[pk]||0;
        parts.push(`<button class="btn" style="padding:1px 4px;font-size:9px;line-height:1.4;background:${pp.color};color:#000;border:none;border-radius:3px;${have<=0?'opacity:.35;pointer-events:none':''}" onclick="event.stopPropagation();useEndlessPill('${id}','${pk}')" title="${pp.desc}">${pp.name.replace('恢复丹','')}${have>0?'×'+have:''}</button>`);
      }
      pillBtns=`<div style="display:flex;gap:3px;margin-top:3px;flex-wrap:wrap">${parts.join('')}</div>`;
    }
    html+=`<div class="disc-card${sel?' in-team':''}${dead?' locked':''}" style="${dead?'opacity:.4;pointer-events:none':''}" onclick="toggleEndlessSelect('${id}')">
      <div class="disc-name">${char.name} <span style="color:${char.gender==='m'?'#3498db':'#e84393'}">${gendSym}</span></div>
      <div class="disc-prof">${char.profession?PROFESSIONS[char.profession].name:'掌门'}</div>
      <div class="disc-realm"><span class="realm-badge realm-${char.bigRealm}">${realmStr(char)}</span></div>
      <div style="height:6px;background:#333;border-radius:3px;margin-top:3px;overflow:hidden">
        <div style="height:100%;width:${hpPct}%;background:linear-gradient(90deg,#e74c3c,#27ae60)"></div>
      </div>
      <div style="height:4px;background:#333;border-radius:2px;margin-top:2px;overflow:hidden">
        <div style="height:100%;width:${mpPct}%;background:#3498db"></div>
      </div>
      ${pillBtns}
      <div style="font-size:9px;color:var(--dim);margin-top:2px">${dead?'💀 已阵亡':(usedPill?'💊 已用丹':(sel?'✓ 已选':'点击选择'))}</div>
    </div>`;
  }
  html+='</div>';
  // 底部操作栏
  html+=`<div style="position:sticky;bottom:0;background:var(--bg);padding:8px 0;display:flex;gap:6px;margin-top:8px">
    <button class="btn btn-gray" style="flex:1" onclick="endEndlessRun('retreat')">撤退结算</button>
    <button class="btn btn-gold" style="flex:2" onclick="confirmEndlessBattle()" ${endlessSelected.length===0?'disabled':''}>出战 (${endlessSelected.length}/${maxSel})</button>
  </div></div>`;
  document.getElementById('realm-content').innerHTML=html;
  // 仅切换到秘境界面，不触发 renderRealm（避免覆盖选人界面）
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('realm-screen').classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#realm-screen .nav-btn').forEach(b=>{
    const m=b.getAttribute('onclick')||'';
    if(m.includes("'realm'"))b.classList.add('active');
  });
}
function toggleEndlessSelect(id){
  const run=game.endlessRun;
  if(!run||run.deadChars.has(id))return;
  const maxSel=Math.min(6,getAllEndlessChars().filter(c=>!run.deadChars.has(c.id)).length);
  const i=endlessSelected.indexOf(id);
  if(i>=0){endlessSelected.splice(i,1)}
  else{
    if(endlessSelected.length>=maxSel){toast(`最多选择${maxSel}人`);return}
    endlessSelected.push(id);
  }
  showEndlessSelect();
}
// 无尽模式战前使用恢复丹：每存活角色每轮限1颗，阵亡角色不可用
function useEndlessPill(id,kind){
  const run=game.endlessRun;
  if(!run)return;
  if(run.deadChars.has(id)){toast('阵亡角色无法使用丹药');return}
  if(run.pillUsed.has(id)){toast('该角色本轮已用过丹药');return}
  const def=RECOVERY_PILLS[kind];
  if(!def)return;
  const have=game.warehouse.recoveryPills[kind]||0;
  if(have<=0){toast(def.name+'不足');return}
  // 找到角色对象与属性
  const entry=getAllEndlessChars().find(c=>c.id===id);
  if(!entry)return;
  const a=calcAttrs(entry.char);
  const st=run.charState[id];
  if(!st){run.charState[id]={hp:a.hp,mp:a.mp}}
  const cur=run.charState[id];
  const healHp=Math.floor(a.hp*def.pct);
  const healMp=Math.floor(a.mp*def.pct);
  const beforeHp=cur.hp,beforeMp=cur.mp;
  cur.hp=Math.min(a.hp,cur.hp+healHp);
  cur.mp=Math.min(a.mp,cur.mp+healMp);
  const gainedHp=cur.hp-beforeHp,gainedMp=cur.mp-beforeMp;
  game.warehouse.recoveryPills[kind]--;
  run.pillUsed.add(id);
  toast(`${entry.char.name} 使用${def.name}：HP+${gainedHp} MP+${gainedMp}`);
  saveGame();
  showEndlessSelect();
}
// 生成百鬼夜行敌人
function generateEndlessEnemies(round){
  const pBig=game.player.bigRealm;
  const isBoss=round%5===0;
  const enemies=[];
  if(isBoss){
    // BOSS 轮：1 个 BOSS + 小怪填充
    const bossIdx=Math.floor(round/5)-1;
    const bossId=ENDLESS_BOSSES[bossIdx%ENDLESS_BOSSES.length];
    const boss=createMonster(bossId,round,pBig,pBig);
    enemies.push(boss);
    // 小怪池：从所有非 BOSS 怪中随机
    const minionPool=Object.keys(MONSTERS).filter(k=>!MONSTERS[k].isBoss);
    const minionCount=Math.min(2+Math.floor(round/10),4);
    for(let i=0;i<minionCount && enemies.length<6;i++){
      const m=createMonster(pick(minionPool),Math.max(1,round-1),pBig,pBig);
      enemies.push(m);
    }
  }else{
    // 普通轮：3~6 只随机小怪
    const minionPool=Object.keys(MONSTERS).filter(k=>!MONSTERS[k].isBoss);
    const count=Math.min(3+Math.floor(round/3),6);
    for(let i=0;i<count;i++){
      const m=createMonster(pick(minionPool),round,pBig,pBig);
      enemies.push(m);
    }
  }
  return enemies;
}
function confirmEndlessBattle(){
  const run=game.endlessRun;
  if(!run||endlessSelected.length===0){toast('请选择出战角色');return}
  // 构建出战队伍，附加 endlessId 并恢复 charState 中的 HP/MP
  const team=[];
  for(const id of endlessSelected){
    let char;
    if(id==='player'){char=createPlayer()}
    else{char=game.disciples[id]}
    char.endlessId=id;
    // Battle 构造时会从 charState 恢复 HP/MP
    team.push(char);
  }
  const enemies=generateEndlessEnemies(run.round);
  game.battle=new Battle(team,enemies,null,run.round,{isEndless:true});
  showScreen('battle');
}

    <div style="text-align:center;margin-bottom:10px">

function buildingCost(key){

}
function upgradeBuilding(key){

}
// 炼丹：每颗突破丹消耗灵草 = max(5, floor(20 * 0.85^炼丹房等级))
function herbCostPerPill(){
  const lvl=game.sect.buildings.alchemyRoom||0;
  return Math.max(5,Math.floor(20*Math.pow(0.85,lvl)));
}
function brewPill(kind,n){
  n=n||1;
  const lvl=game.sect.buildings.alchemyRoom||0;
  if(lvl<=0){toast('请先升级炼丹房');return}
  // 恢复丹
  if(RECOVERY_PILLS[kind]){
    const per=recHerbCost(kind);
    const cost=per*n;
    if(game.resources.herb<cost){toast('灵草不足（需要'+cost+'）');return}
    game.resources.herb-=cost;
    game.warehouse.recoveryPills[kind]=(game.warehouse.recoveryPills[kind]||0)+n;
    toast('炼制成功：'+RECOVERY_PILLS[kind].name+' ×'+n);
    saveGame();renderAlchemy();return;
  }
  // 突破丹
  const cost=herbCostPerPill()*n;
  if(game.resources.herb<cost){toast('灵草不足（需要'+cost+'）');return}
  game.resources.herb-=cost;
  game.warehouse.pills[kind]=(game.warehouse.pills[kind]||0)+n;
  toast('炼制成功：'+BREAKTHROUGH_PILLS[kind].name+' ×'+n);
  saveGame();renderAlchemy();
}

// 自动退出百鬼夜行结算：用户切换到其它界面时触发
// 百鬼夜行退出确认：标记位，避免弹窗确认后再次拦截
let _endlessExitConfirmed=false;
function showEndlessExitModal(toScreen){
  const html=`
    <h3>百鬼夜行进行中</h3>
    <p style="color:var(--dim);margin-bottom:16px">当前有未结束的百鬼夜行挑战，是否继续？</p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-gold" onclick="confirmEndlessExit(true)">继续挑战</button>
      <button class="btn btn-gray" onclick="confirmEndlessExit(false,'${toScreen}')">结算退出</button>
    </div>`;
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}
function confirmEndlessExit(keepGoing,toScreen){
  document.getElementById('modal').classList.remove('show');
  if(keepGoing)return; // 留在当前界面
  endEndlessRun('retreat');
  _endlessExitConfirmed=true;
  showScreen(toScreen);
}
function tryExitEndlessOnNavigate(toScreen){
  if(!game.endlessRun)return true;
  // 进入战斗界面：直接放行，不要触发撤退结算
  if(toScreen==='battle')return true;
  // 战斗中：直接结算（败北处理——但用户主动离开，按撤退算并保留奖励）
  if(game.battle && game.battle.isEndless){
    // 已经在结算界面 or 正在战斗：先让当前的 battle.onEnd 逻辑走完
    if(game.battle.over){
      // 结算按钮还没点，但用户已切换界面——直接结算
      endEndlessRun('retreat');
      return true;
    }
    // 战斗进行中——调用 retreat 触发结算
    retreat();
    return false; // 等结算界面出来后再导航，让用户看到结算
  }
  // 用户已在弹窗确认结算退出：放行
  if(_endlessExitConfirmed){_endlessExitConfirmed=false;return true}
  // 选角界面——用游戏风格弹窗确认
  showEndlessExitModal(toScreen);
  return false; // 拦截，等用户选择
}
function showScreen(name){
  // 任意切屏时先检查百鬼夜行退出
  if(game.endlessRun){
    const ok=tryExitEndlessOnNavigate(name);
    if(!ok)return; // 拦截导航
  }
  game.screen=name;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(name+'-screen').classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#'+name+'-screen .nav-btn').forEach(b=>{
    const m=b.getAttribute('onclick')||'';
    if(m.includes("'"+name+"'"))b.classList.add('active');
  });
  if(name==='hub')renderHub();
  if(name==='cultivation')renderCultivation();
  if(name==='realm')renderRealm();
  if(name==='disciples')renderDisciples();
  if(name==='sect')renderSect();
  if(name==='warehouse')renderWarehouse();
  if(name==='wiki')renderWiki();
  if(name==='save')renderSave();
}

  const gendSym=m=>m==='m'?'♂':'♀';
  const allChars=[{slot:'player',char:game.player}].concat(
    game.disciples.map((d,i)=>({slot:i,char:d}))
  );
  let cardsHtml='';
  for(const {slot,char} of allChars){
    const cost=cultUpgradeCost(char);
    const canBT=canBreakthrough(char);
    const inSlot=game.cultivateSlots.includes(slot);
    const name=char.name||'主角';
    const prof=char.profession?PROFESSIONS[char.profession].name:'掌门';
    cardsHtml+=`
      <div class="cult-char ${inSlot?'active':''}">
        <div class="cult-char-head">
          <div class="cult-char-name">${name} <span style="color:${char.gender==='m'?'#3498db':'#e84393'}">${gendSym(char.gender||'m')}</span></div>
          <div class="cult-char-meta">${prof} · <span style="color:${REALM_COLORS[char.bigRealm]}">${realmStr(char)}</span></div>
          <button class="cult-toggle ${inSlot?'on':''}" onclick="toggleCultivate(${slot==='player'?"'player'":slot})">${inSlot?'修炼中':'加入修炼'}</button>
        </div>
        <div class="cult-char-bar" data-slot="${slot}">
          <div class="cult-progress"><div class="cult-fill" style="width:${Math.min(100,char.cultPoints/cost*100)}%"></div><div class="cult-text">${fmt(char.cultPoints)}/${fmt(cost)}</div></div>
          <div class="info-row" style="margin:4px 0"><span class="label">修炼速度</span><span class="val">${getCultSpeed(char).toFixed(1)}/秒</span></div>
          ${canBT?(function(){
            const targetRealm=char.bigRealm+1;
            const pillCost=PILL_COST_PER_REALM[targetRealm]||0;
            const root=char.spiritRoot;
            const have=game.warehouse.pills[root]||0;
            const p=BREAKTHROUGH_PILLS[root];
            const enough=have>=pillCost;
            return `<div style="font-size:11px;margin:4px 0;color:${enough?'var(--dim)':'var(--red)'}">需 <span style="color:${p.color}">${p.name}</span> x${pillCost}（持有 ${have}）</div>
              <button class="btn btn-gold" style="width:100%" ${char.cultPoints<cost||!enough?'disabled':''} onclick="doCultivate(${slot==='player'?"'player'":slot})">突破至${REALMS[char.bigRealm+1]}</button>`;
          })():'<button class="btn btn-blue" style="width:100%" '+ (char.cultPoints<cost?'disabled':'') +' onclick="doCultivate('+(slot==='player'?"'player'":slot)+')">提升至'+REALMS[char.bigRealm]+(char.smallRealm+1)+'层</button>'}
        </div>
      </div>`;
  }
  document.getElementById('cult-content').innerHTML=`
    <div class="card">
      <div class="card-title">修炼大殿 <span style="font-size:11px;color:var(--dim);float:right">同时修炼 ${game.cultivateSlots.length}/4 人</span></div>
      <div style="font-size:11px;color:var(--dim);margin-bottom:6px">选择最多 4 名角色同时修炼，获得修为提升境界。掌门（主角）默认修炼且不可移除。</div>
      ${cardsHtml}
    </div>
    <div class="card">
      <div class="card-title">境界成长</div>
      <div style="font-size:11px;line-height:1.6;color:var(--dim)">
        小境界提升: HP/MP+10%基础值, ATK/DEF+5%基础值<br>
        大境界突破: HP/MP+100%基础值, ATK/DEF+50%基础值, 暴击/速度+20%基础值
      </div>
    </div>`;
}

function toggleSkill(idx,skKey){
  const char=idx==='player'?game.player:game.disciples[idx];
  if(!char)return;
  if(!char.equippedSkills)char.equippedSkills=[];
  const i=char.equippedSkills.indexOf(skKey);
  if(i>=0){char.equippedSkills.splice(i,1)}
  else{
    if(char.equippedSkills.length>=MAX_EQUIPPED){toast(`最多装备${MAX_EQUIPPED}个技能`);return}
    char.equippedSkills.push(skKey);
  }
  saveGame();
  showCharDetail(idx);
}
// 调整已装备技能的优先级：dir=-1 上移（优先级+1），dir=1 下移（优先级-1）
// 优先级由 equippedSkills 数组顺序决定：index 0 = 优先级1
function moveSkillPriority(idx,skKey,dir){
  const char=idx==='player'?game.player:game.disciples[idx];
  if(!char||!char.equippedSkills)return;
  const i=char.equippedSkills.indexOf(skKey);
  if(i<0)return;
  const j=i+dir;
  if(j<0||j>=char.equippedSkills.length)return;
  [char.equippedSkills[i],char.equippedSkills[j]]=[char.equippedSkills[j],char.equippedSkills[i]];
  saveGame();
  showCharDetail(idx);
}
// 渲染技能预设区块（操作区）：普攻常驻 → 已装备技能（优先级+↑↓+卸下）→ 未装备技能（装备）
function renderSkillPreset(char,idx){
  const idxArg=typeof idx==='number'?idx:`'${idx}'`;
  const normKey=PROFESSIONS[char.profession].norm;
  const rows=[];
  // 普攻（常驻）
  {
    const s=SKILLS[normKey];
    rows.push(`<div class="attr-row"><span style="font-weight:bold">${s.name}</span><span style="font-size:11px;color:var(--gold)">常驻</span></div>`);
  }
  // 已装备技能（按优先级1→2→3→4）
  char.equippedSkills.forEach((skKey,eqIdx)=>{
    const s=SKILLS[skKey];if(!s)return;
    const eqBtn=`<button class="btn btn-gray" style="padding:2px 8px;font-size:11px" onclick="event.stopPropagation();toggleSkill(${idxArg},'${skKey}')">卸下</button>`;
    const upBtn=eqIdx>0?
      `<button class="btn btn-gold" style="padding:2px 6px;font-size:11px" onclick="event.stopPropagation();moveSkillPriority(${idxArg},'${skKey}',-1)" title="提升优先级">↑</button>`:'';
    const downBtn=eqIdx<char.equippedSkills.length-1?
      `<button class="btn btn-gold" style="padding:2px 6px;font-size:11px" onclick="event.stopPropagation();moveSkillPriority(${idxArg},'${skKey}',1)" title="降低优先级">↓</button>`:'';
    rows.push(`<div class="attr-row"><span style="font-weight:bold">${s.name}${gradeTag(s.grade)}</span><span style="font-size:11px"><span style="color:var(--jade)">优先级${eqIdx+1}</span> ${upBtn}${downBtn} ${eqBtn}</span></div>`);
  });
  // 未装备技能
  char.learnedSkills.forEach(skKey=>{
    if(skKey===normKey||char.equippedSkills.includes(skKey))return;
    const s=SKILLS[skKey];if(!s)return;
    const eqBtn=char.equippedSkills.length>=MAX_EQUIPPED?
      `<button class="btn btn-gray" style="padding:2px 8px;font-size:11px;opacity:0.5" disabled>已满</button>`:
      `<button class="btn btn-gold" style="padding:2px 8px;font-size:11px" onclick="event.stopPropagation();toggleSkill(${idxArg},'${skKey}')">装备</button>`;
    rows.push(`<div class="attr-row"><span style="font-weight:bold">${s.name}${gradeTag(s.grade)}</span><span style="font-size:11px;color:var(--dim)">未装备 ${eqBtn}</span></div>`);
  });
  return rows.join('');
}
// 渲染技能介绍区块（纯说明，无操作按钮）：所有习得技能按学习顺序列出
function renderSkillInfo(char){
  const normKey=PROFESSIONS[char.profession].norm;
  const all=[normKey,...char.learnedSkills.filter(k=>k!==normKey)];
  return all.map(skKey=>{
    const s=SKILLS[skKey];if(!s)return'';
    const desc=getSkillDesc(skKey);
    return `<div class="attr-row"><span style="font-weight:bold">${s.name}${gradeTag(s.grade)}</span><span style="font-size:11px;color:var(--dim);text-align:right;max-width:60%">${desc}</span></div>`;
  }).join('');
}
function showCharDetail(idx){
  const el=document.getElementById('char-detail');
  const content=document.getElementById('char-detail-content');
  let char,attrs,name,prof;
  if(idx==='player'){
    char=game.player;attrs=calcAttrs(createPlayer());
    name=game.player.name;prof=PROFESSIONS[game.player.profession].name;
  }else{
    char=game.disciples[idx];attrs=calcAttrs(char);
    name=char.name;prof=PROFESSIONS[char.profession].name;
  }
  const base={...PROFESSIONS[char.profession].base};
  // 基础值 = 职业基础 + 性别修正 + 天赋加成 + 灵根加成（角色固有属性，与 calcAttrs 同源）
  if(!char.isMonster){
    const pb=PROFESSIONS[char.profession].base;
    const gm=genderMods(char);
    for(const k in base){base[k]=+(base[k]+(gm[k]||0)).toFixed(2)}
    if(char.talents){
      for(const tid of char.talents){
        const t=TALENTS[tid];if(!t)continue;const m=t.mods;
        if(m.allMul){base.hp+=pb.hp*m.allMul;base.mp+=pb.mp*m.allMul;base.atk+=pb.atk*m.allMul;base.def+=pb.def*m.allMul;base.spd+=pb.spd*m.allMul}
        if(m.hpMul)base.hp+=pb.hp*m.hpMul;if(m.mpMul)base.mp+=pb.mp*m.mpMul;
        if(m.atkMul)base.atk+=pb.atk*m.atkMul;if(m.defMul)base.def+=pb.def*m.defMul;
        if(m.spdMul)base.spd+=pb.spd*m.spdMul;if(m.critRateAdd)base.critRate+=m.critRateAdd;if(m.critDmgAdd)base.critDmg+=m.critDmgAdd;
      }
    }
    // 灵根加成（与 calcAttrs 中灵根逻辑一致）
    if(char.spiritRoot){
      const sr=SPIRIT_ROOTS[char.spiritRoot];
      if(sr&&sr.mods){const m=sr.mods;
        if(m.hpMul)base.hp+=pb.hp*m.hpMul;if(m.mpMul)base.mp+=pb.mp*m.mpMul;
        if(m.atkMul)base.atk+=pb.atk*m.atkMul;if(m.defMul)base.def+=pb.def*m.defMul;
        if(m.spdMul)base.spd+=pb.spd*m.spdMul;if(m.critRateAdd)base.critRate+=m.critRateAdd;if(m.critDmgAdd)base.critDmg+=m.critDmgAdd;
      }
    }
  }
  const imgKey=getPortraitKey(char);
  const attrRows=[
    {label:'生命值',base:base.hp,cur:attrs.hp,fmt:fmt},
    {label:'法力值',base:base.mp,cur:attrs.mp,fmt:fmt},
    {label:'攻击力',base:base.atk,cur:attrs.atk,fmt:fmt},
    {label:'防御力',base:base.def,cur:attrs.def,fmt:fmt},
    {label:'速度',base:base.spd,cur:attrs.spd,fmt:v=>v.toFixed(1)},
    {label:'暴击率',base:base.critRate,cur:attrs.critRate,fmt:v=>v.toFixed(1)+'%'},
    {label:'暴击伤害',base:base.critDmg,cur:attrs.critDmg,fmt:v=>v.toFixed(0)+'%'},
  ];
  content.innerHTML=`
    <div class="cd-header">
      <canvas id="detail-portrait" width="160" height="200" class="cd-portrait"></canvas>
      <div class="cd-info">
        <div class="cd-name">${name}</div>
        <div style="font-size:12px;color:var(--jade)">${prof} · ${spiritHtml(char.spiritRoot)||""}</div>
        <div style="margin-top:4px"><span class="realm-badge realm-${char.bigRealm}">${realmStr(char)}</span></div>
      </div>
    </div>
    <div class="cd-attrs">
      <div class="attr-row" style="color:var(--gold);font-size:11px"><span>属性</span><span style="text-align:right">基础 → 当前</span></div>
      ${attrRows.map(r=>`<div class="attr-row"><span>${r.label}</span><span style="text-align:right"><span style="color:var(--dim)">${r.fmt(r.base)}</span> → <span style="color:var(--jade)">${r.fmt(r.cur)}</span></span></div>`).join('')}
    </div>
    <div style="margin-top:10px">
      <div class="card-title">天赋</div>
      ${char.talents.map(t=>`<div class="attr-row"><span style="font-weight:bold">${talentHtml(t)}</span><span style="font-size:11px;color:var(--dim)">${TALENTS[t]?.desc||""} <span style="color:${TALENT_RARITY[TALENTS[t]?.rarity]?.color||'#888'}">[${TALENT_RARITY[TALENTS[t]?.rarity]?.name||'?'}]</span></span></div>`).join('')}
    </div>
    <div style="margin-top:10px">
      <div class="card-title">技能预设 <span style="font-size:11px;color:var(--dim);font-weight:normal">已装备 ${char.equippedSkills.length}/${MAX_EQUIPPED}（数字越小越先释放）</span></div>
      ${renderSkillPreset(char,idx)}
    </div>
    <div style="margin-top:10px">
      <div class="card-title">技能介绍</div>
      ${renderSkillInfo(char)}
    </div>`;
  el.classList.add('show');
  // Draw portrait on canvas
  setTimeout(()=>{
    const c=document.getElementById('detail-portrait');
    if(c){const ctx=c.getContext('2d');drawPortrait(ctx,0,0,c.width,c.height,imgKey,char.bigRealm||0,char.portraitIdx||0);ctx.strokeStyle='#d4af37';ctx.lineWidth=2;ctx.strokeRect(0,0,c.width,c.height)}
  },10);
}

function renderWarehouse(){

  html+='<div class="card" style="margin-bottom:10px"><div class="card-title">技能书</div>';
  const books=game.warehouse.skillBooks;
  const bookKeys=Object.keys(books).filter(k=>books[k]>0);
  if(bookKeys.length===0){
    html+='<p style="color:var(--dim);text-align:center;padding:16px">暂无技能书，可在「建筑 → 藏经阁」购买</p>';
  }else{
    for(const k of bookKeys){

      html+=`<div class="attr-row">
        <span>${s.name}${gradeTag(s.grade)} <span style="color:var(--gold)">x${books[k]}</span> <span style="font-size:10px;color:var(--dim)">${getSkillDesc(k)}</span></span>

  html+='</div>';

  let pillCount=0;
  for(const key in BREAKTHROUGH_PILLS){
    const p=BREAKTHROUGH_PILLS[key];
    const have=game.warehouse.pills[key]||0;
    pillCount+=have;
    html+=`<div class="attr-row">
      <span><span style="color:${p.color}">●</span> ${p.name} <span style="font-size:10px;color:var(--dim)">${p.desc}</span></span>
      <span style="color:var(--gold)">x${have}</span>
    </div>`;
  }
  if(pillCount===0){
    html+='<p style="color:var(--dim);text-align:center;padding:16px">暂无突破丹，可在「建筑 → 藏经阁」购买或炼丹房炼制</p>';
  }
  html+='</div>';
  // 恢复丹
  html+='<div class="card" style="margin-top:10px"><div class="card-title">恢复丹</div>';
  html+='<p style="color:var(--dim);font-size:11px;margin-bottom:6px">无尽模式每轮战前可对存活角色使用，每角色每轮限1颗</p>';
  let recCount=0;
  for(const key in RECOVERY_PILLS){
    const p=RECOVERY_PILLS[key];
    const have=game.warehouse.recoveryPills[key]||0;
    recCount+=have;
    html+=`<div class="attr-row">
      <span><span style="color:${p.color}">●</span> ${p.name} <span style="font-size:10px;color:var(--dim)">${p.desc}</span></span>
      <span style="color:var(--gold)">x${have}</span>
    </div>`;

  if(recCount===0){
    html+='<p style="color:var(--dim);text-align:center;padding:16px">暂无恢复丹，可在「建筑 → 炼丹房」炼制</p>';
  }
  html+='</div>';
  document.getElementById('warehouse-content').innerHTML=html;
}

let _libraryGrade='all'; // 技能书品阶筛选：all/人/玄/黄/地
function openLibrary(){
  _libraryTab='shop';
  _libraryGrade='all';
  renderLibrary();
  document.getElementById('modal').classList.add('show');
}
function switchLibraryTab(tab){_libraryTab=tab;renderLibrary()}
function switchLibraryGrade(g){_libraryGrade=g;renderLibrary()}
function renderLibrary(){
  const el=document.getElementById('modal-content');
  let html=`<h3>藏经阁</h3>
    <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn ${_libraryTab==='shop'?'btn-gold':'btn-gray'}" onclick="switchLibraryTab('shop')">购买技能书</button>
      <button class="btn ${_libraryTab==='pillShop'?'btn-gold':'btn-gray'}" onclick="switchLibraryTab('pillShop')">购买突破丹</button>
      <button class="btn ${_libraryTab==='warehouse'?'btn-gold':'btn-gray'}" onclick="switchLibraryTab('warehouse')">仓库</button>
      <button class="btn btn-gray" style="margin-left:auto" onclick="document.getElementById('modal').classList.remove('show')">关闭</button>
    </div>`;
  if(_libraryTab==='shop'){
    const grades=['all','人','玄','黄','地'];
    const gLabel={all:'全部'};
    html+=`<div style="display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap">
      ${grades.map(g=>`<button class="btn ${_libraryGrade===g?'btn-gold':'btn-gray'}" style="font-size:11px;padding:2px 8px" onclick="switchLibraryGrade('${g}')">${gLabel[g]||g}阶</button>`).join('')}
    </div>`;
    const rootNames={metal:'金',wood:'木',water:'水',fire:'火',earth:'土'};
    for(const elem in SPIRIT_SKILLS){
      const rc=SPIRIT_ROOTS[elem]?.color;
      const list=SPIRIT_SKILLS[elem].filter(sk=>_libraryGrade==='all'||SKILLS[sk]?.grade===_libraryGrade);
      if(list.length===0)continue;
      html+=`<div class="card" style="margin-bottom:10px"><div class="card-title" style="color:${rc}">${rootNames[elem]}系技能书</div>`;
      for(const sk of list){
        const s=SKILLS[sk];const price=SKILL_BOOK_PRICES[sk];
        const canBuy=game.resources.spirit>=price;
        html+=`<div class="attr-row">
          <span>${s.name}${gradeTag(s.grade)} <span style="font-size:10px;color:var(--dim)">${getSkillDesc(sk)}</span></span>
          <button class="btn ${canBuy?'btn-gold':'btn-gray'}" ${canBuy?'':'disabled'} onclick="buySkillBook('${sk}')">${price}💎</button>
        </div>`;
      }
      html+='</div>';
    }
  }else if(_libraryTab==='pillShop'){
    html+='<p style="color:var(--dim);font-size:11px;margin-bottom:10px">突破丹仅对应灵根角色可使用，用于大境界突破。价格随目标境界递增。</p>';
    for(const key in BREAKTHROUGH_PILLS){
      const p=BREAKTHROUGH_PILLS[key];
      const have=game.warehouse.pills[key]||0;
      // 价格：按玩家当前大境界+1计算（即下一次突破所需价格）
      const nextRealm=Math.min(game.player.bigRealm+1,REALMS.length-1);
      const price=PILL_SHOP_PRICE[nextRealm]||20;
      const canBuy=game.resources.spirit>=price;
      html+=`<div class="attr-row">
        <span><span style="color:${p.color}">●</span> ${p.name} <span style="font-size:10px;color:var(--dim)">${p.desc}</span> <span style="color:var(--gold)">x${have}</span></span>
        <button class="btn ${canBuy?'btn-gold':'btn-gray'}" ${canBuy?'':'disabled'} onclick="buyPill('${key}')">${price}💎</button>
      </div>`;
    }
  }else{
    const books=game.warehouse.skillBooks;
    const keys=Object.keys(books).filter(k=>books[k]>0);
    if(keys.length===0){
      html+='<p style="color:var(--dim);text-align:center;padding:20px">仓库空空如也，去「购买技能书」选购吧</p>';
    }else{
      html+='<p style="color:var(--dim);font-size:11px;margin-bottom:8px">技能书为消耗品，使用后消失。仅灵根匹配或伪灵根弟子可学对应五行技能。</p>';
      for(const k of keys){
        const s=SKILLS[k];
        html+=`<div class="attr-row">
          <span>${s.name}${gradeTag(s.grade)} <span style="color:var(--gold)">x${books[k]}</span> <span style="font-size:10px;color:var(--dim)">${getSkillDesc(k)}</span></span>
          <button class="btn btn-gold" onclick="useSkillBook('${k}')">使用</button>
        </div>`;
      }
    }
    // 突破丹展示
    html+='<div class="card-title" style="margin-top:14px">突破丹</div>';
    html+='<p style="color:var(--dim);font-size:11px;margin-bottom:6px">仅对应灵根角色大境界突破时消耗</p>';
    for(const key in BREAKTHROUGH_PILLS){
      const p=BREAKTHROUGH_PILLS[key];
      const have=game.warehouse.pills[key]||0;
      html+=`<div class="attr-row">
        <span><span style="color:${p.color}">●</span> ${p.name} <span style="font-size:10px;color:var(--dim)">${p.desc}</span></span>
        <span style="color:var(--gold)">x${have}</span>
      </div>`;
    }
    // 恢复丹展示
    html+='<div class="card-title" style="margin-top:14px">恢复丹</div>';
    html+='<p style="color:var(--dim);font-size:11px;margin-bottom:6px">无尽模式每轮战前可对存活角色使用，每角色每轮限1颗</p>';
    for(const key in RECOVERY_PILLS){
      const p=RECOVERY_PILLS[key];
      const have=game.warehouse.recoveryPills[key]||0;
      html+=`<div class="attr-row">
        <span><span style="color:${p.color}">●</span> ${p.name} <span style="font-size:10px;color:var(--dim)">${p.desc}</span></span>
        <span style="color:var(--gold)">x${have}</span>
      </div>`;
    }
  }
  el.innerHTML=html;
}
function buySkillBook(sk){
  const price=SKILL_BOOK_PRICES[sk];
  if(game.resources.spirit<price){toast('灵石不足');return}
  game.resources.spirit-=price;
  game.warehouse.skillBooks[sk]=(game.warehouse.skillBooks[sk]||0)+1;
  toast('购入 '+SKILLS[sk].name+' 技能书');
  saveGame();
  renderLibrary();
  renderRes('sect-res');
}
function buyPill(key){
  const nextRealm=Math.min(game.player.bigRealm+1,REALMS.length-1);
  const price=PILL_SHOP_PRICE[nextRealm]||20;
  if(game.resources.spirit<price){toast('灵石不足');return}
  game.resources.spirit-=price;
  game.warehouse.pills[key]=(game.warehouse.pills[key]||0)+1;
  toast('购入 '+BREAKTHROUGH_PILLS[key].name);
  saveGame();
  renderLibrary();
  renderRes('sect-res');
}
let _useBookSkill=null;
let _useBookFromWarehouse=false;
function useSkillBook(sk,fromWarehouse){
  _useBookSkill=sk;
  _useBookFromWarehouse=!!fromWarehouse;
  const s=SKILLS[sk];
  const elem=sk.split('_')[0];
  const chars=[{slot:'player',char:game.player},...game.disciples.map((d,i)=>({slot:i,char:d}))];
  const eligible=chars.filter(({char})=>{
    if(!char)return false;
    if(char.learnedSkills&&char.learnedSkills.includes(sk))return false;
    const sr=char.spiritRoot;
    return sr==='pseudo'||sr===elem;
  });
  let html=`<h3>使用技能书 - ${s.name}${gradeTag(s.grade)}</h3>
    <p style="color:var(--dim);margin-bottom:10px">选择一名弟子学习（仅灵根匹配或伪灵根可学）</p>`;
  if(eligible.length===0){
    html+='<p style="color:var(--dim);text-align:center;padding:16px">没有可学习该技能的弟子</p>';
  }else{
    for(const {slot,char} of eligible){
      const rootName=SPIRIT_ROOTS[char.spiritRoot]?.name||'未知';
      const rootColor=SPIRIT_ROOTS[char.spiritRoot]?.color;
      html+=`<div class="recruit-card" style="cursor:pointer" onclick="learnFromBook('${sk}','${slot}')">
        <div class="recruit-name">${char.name}</div>
        <div class="recruit-prof" style="font-size:11px">${PROFESSIONS[char.profession]?.name||''} · ${realmStr(char)} · <span style="color:${rootColor}">${rootName}</span></div>
      </div>`;
    }
  }
  html+='<div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button class="btn btn-gray" onclick="returnFromUseBook()">返回</button></div>';
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}
function returnFromUseBook(){
  if(_useBookFromWarehouse){
    document.getElementById('modal').classList.remove('show');
    renderWarehouse();
  }else{
    renderLibrary();
  }
}
function learnFromBook(sk,slot){
  const char=slot==='player'?game.player:game.disciples[slot];
  if(!char)return;
  if(!Array.isArray(char.learnedSkills))char.learnedSkills=getCharSkills(char.profession).learned;
  if(char.learnedSkills.includes(sk)){toast('已学过该技能');return}
  char.learnedSkills.push(sk);
  if(!Array.isArray(char.equippedSkills))char.equippedSkills=getCharSkills(char.profession).equipped;
  if(char.equippedSkills.length<MAX_EQUIPPED)char.equippedSkills.push(sk);
  game.warehouse.skillBooks[sk]=(game.warehouse.skillBooks[sk]||0)-1;
  if(game.warehouse.skillBooks[sk]<=0)delete game.warehouse.skillBooks[sk];
  toast((char.name||'主角')+'学会了 '+SKILLS[sk].name);
  saveGame();
  returnFromUseBook();
}
