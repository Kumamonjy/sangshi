      }
      function renderFilters(){
        let fh='<div style="width:100%;font-size:11px;color:var(--dim);margin-bottom:2px">灵根筛选：</div>';
        for(const r of roots){
          const active=mFilter===r;
          fh+=`<button class="btn ${active?'btn-gold':'btn-gray'}" style="font-size:11px;padding:4px 8px" onclick="window._setMFilter('${r}')" ${active?'data-active':''}>${rootCN[r]}</button>`;
        }
        fh+='<div style="width:100%;font-size:11px;color:var(--dim);margin:4px 0 2px">类型筛选：</div>';
        for(const [k,v] of [['all','全部'],['boss','仅BOSS'],['normal','普通']]){
          const active=bossFilter===k;
          fh+=`<button class="btn ${active?'btn-gold':'btn-gray'}" style="font-size:11px;padding:4px 8px" onclick="window._setBossFilter('${k}')" ${active?'data-active':''}>${v}</button>`;
        }
        filterEl.innerHTML=fh;
      }
      window._setMFilter=function(r){mFilter=r;localStorage.setItem('wikiMFilter_monster',r);renderFilters();renderMonsterList()};
      window._setBossFilter=function(k){bossFilter=k;localStorage.setItem('wikiBossFilter_monster',k);renderFilters();renderMonsterList()};
      renderFilters();
      renderMonsterList();
    },10);
  }
  el.innerHTML=html;
}

//============ TOAST ============
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500)}

//============ GAME LOOP ============
let lastTime=0;
let herbAccum=0;
// 逻辑循环：setInterval 保证移动端 rAF 被限制时修炼/草药/战斗逻辑仍稳定运行
let _logicLast=performance.now();
let _saveAccum=0;
setInterval(()=>{
  try{
    const now=performance.now();
    const dt=Math.min((now-_logicLast)/1000,1/15);
    _logicLast=now;
    // Cultivation (all selected chars gain cult points, capped at current stage max)
    for(const slot of game.cultivateSlots){
      const ch=getCharFromSlot(slot);
      if(ch){ch.cultPoints=Math.min(ch.cultPoints+getCultSpeed(ch)*dt,cultUpgradeCost(ch))}
    }
    // Herb production
    const herbLvl=game.sect.buildings.herbGarden||0;
    if(herbLvl>0){herbAccum+=herbLvl*dt/60;if(herbAccum>=1){game.resources.herb+=Math.floor(herbAccum);herbAccum%=1}}
    // Battle logic
    if(game.battle&&!game.battle.over){game.battle.update(dt)}
    // Auto-save (every 30s)
    _saveAccum+=dt;
    if(_saveAccum>=30){_saveAccum=0;saveGame()}
  }catch(e){console.error('logic tick error',e)}
},100);
// 渲染循环：仅负责画面渲染与 UI 刷新
function gameLoop(time){
  try{
    const dt=Math.min((time-lastTime)/1000,1/15);
    lastTime=time;
    // Battle render
    if(game.battle&&!game.battle.over){
      const canvas=document.getElementById('battle-canvas');
      if(canvas){const ctx=canvas.getContext('2d');game.battle.render(ctx,canvas.width,canvas.height)}
    }
    // Update UI
    if(game.screen==='cultivation'){updateCultBar()}
  }catch(e){console.error('render tick error',e)}
  requestAnimationFrame(gameLoop);
}
function updateCultBar(){
  if(game.screen!=='cultivation')return;
  const bars=document.querySelectorAll('#cult-content .cult-char-bar');
  bars.forEach(el=>{
    const slot=el.dataset.slot;
    const char=getCharFromSlot(slot);
    if(!char)return;
    const cost=cultUpgradeCost(char);
    const fill=el.querySelector('.cult-fill');
    const text=el.querySelector('.cult-text');
    if(fill)fill.style.width=Math.min(100,char.cultPoints/cost*100)+'%';
    if(text)text.textContent=fmt(char.cultPoints)+'/'+fmt(cost);
  });
}

//============ INIT ============
function resizeCanvas(){
  const c=document.getElementById('battle-canvas');
  c.width=window.innerWidth;c.height=window.innerHeight;
}
window.addEventListener('resize',resizeCanvas);
window.addEventListener('orientationchange',()=>setTimeout(resizeCanvas,100));

function init(){
  resizeCanvas();
  preloadAIImgs();
  // 优先从 URL hash 读存档（跨 origin/设备可用），其次 localStorage，最后新游戏
  if(!loadFromUrlHash() && !loadGame()){
    // Start with 2 disciples
    game.disciples=[createDisciple(),createDisciple()];
    game.teamSlots=[0,1];
    saveGame();
  }
  showScreen('hub');
  requestAnimationFrame(gameLoop);
}
window.addEventListener('load',init);
</script>
